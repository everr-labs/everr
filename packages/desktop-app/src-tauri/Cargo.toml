[package]
name = "everr-app"
version = "0.4.2"
description = "Everr app"
authors = [ "Everr" ]
edition = "2021"

[lib]
name = "everr_app_lib"
crate-type = [ "staticlib", "cdylib", "rlib" ]

[build-dependencies]
serde_json = "1"

[build-dependencies.tauri-build]
version = "2"
features = []

[dependencies]
arboard = "3.6.1"
anyhow = "1.0.98"
futures-util = "0.3"
dirs = "6.0.0"
serde_json = "1"
sha2 = "0.10.9"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
uuid = { version = "1", features = ["v4"] }
webbrowser = "1.0.6"
url = "2"

[dependencies.opentelemetry]
version = "0.32"
features = ["logs"]

[dependencies.opentelemetry-appender-tracing]
version = "0.32"

[dependencies.opentelemetry-otlp]
version = "0.32"
default-features = false
features = ["http-proto", "logs", "reqwest-blocking-client", "reqwest-rustls"]

[dependencies.opentelemetry_sdk]
version = "0.32"
features = ["logs", "rt-tokio"]

[dependencies.nix]
version = "0.29"
features = [ "signal" ]
default-features = false

[dependencies.reqwest]
version = "0.12"
default-features = false
features = [ "rustls-tls" ]

[dependencies.everr-core]
path = "../../../crates/everr-core"

[dependencies.serde]
version = "1"
features = [ "derive" ]

[dependencies.tauri]
version = "2"
features = [ "tray-icon", "macos-private-api" ]

[dependencies.time]
version = "0.3"
features = [ "formatting" ]

[dependencies.tokio]
version = "1.44.2"
features = [ "time", "sync", "macros", "process", "io-util" ]

[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"

[target."cfg(target_os = \"linux\")".dependencies]
libloading = "0.8"
notify-rust = "4"
tauri-plugin-single-instance = "2"
zbus = "5"

[dev-dependencies]
tempfile = "3.18.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

              width: 12
              height: 8
              content:
                $ref: "#/spec/panels/load"
            - x: 0
              y: 45
              width: 12
              height: 8
              content:
                $ref: "#/spec/panels/classes"
            - x: 12
              y: 45
              width: 12
              height: 8
              content:
                $ref: "#/spec/panels/class-activity"
            - x: 0
              y: 53
              width: 12
              height: 8

name: Build & Check App

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect resource usage
        uses: ./.github/actions/everr-action
        with:
          check-run-id: ${{ job.check_run_id }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: >-
          pnpm exec biome check
          packages/app packages/cloud packages/datemath packages/otel-errors
          packages/otel-web packages/tanstack-start-otel
          packages/telemetry-explorer packages/ui

      - name: Check package boundaries
        run: pnpm check:boundaries

      - name: Typecheck
        run: pnpm -r --filter @everr/app-cloud... typecheck

      - name: Generate migrations
        env:
          DATABASE_HOST: localhost
          DATABASE_NAME: mock
          DATABASE_PORT: "5432"
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
        run: pnpm -r --filter @everr/app --filter @everr/app-cloud db:generate

      - name: Ensure no unstaged/changed files
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "❌ Uncommitted migrations. Run db:generate in packages/app and packages/cloud and commit the changes."
            git status --porcelain
            git diff
            exit 1
          fi
      - name: Build
        run: pnpm -r --filter @everr/app build

      - name: Build Cloud
        env:
          SKIP_ENV_VALIDATION: "true"
          BETTER_AUTH_URL: http://localhost:3000
          BETTER_AUTH_SECRET: ci-prerender-only-not-a-runtime-secret
        run: pnpm --filter @everr/app-cloud build

name: Build & Check App

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collect resource usage
        uses: ./.github/actions/everr-action
        with:
          check-run-id: ${{ job.check_run_id }}

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r --filter @everr/app-cloud... typecheck

      - name: Generate migrations
        env:
          DATABASE_HOST: localhost
          DATABASE_NAME: mock
          DATABASE_PORT: "5432"
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
        run: pnpm -r --filter @everr/app --filter @everr/app-cloud db:generate

      - name: Ensure no unstaged/changed files
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "❌ Uncommitted migrations. Run db:generate in packages/app and packages/cloud and commit the changes."
            git status --porcelain
            git diff
            exit 1
          fi

      - name: ClickHouse migrations are immutable
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          pnpm --filter @everr/app exec tsx --tsconfig tsconfig.json scripts/check-clickhouse-migrations.ts "origin/$BASE_REF"

      - name: Build
        env:
          SKIP_ENV_VALIDATION: "true"
          BETTER_AUTH_URL: http://localhost:3000
          BETTER_AUTH_SECRET: ci-prerender-only-not-a-runtime-secret
        run: pnpm -r --filter @everr/app build

      - name: Build Cloud
        env:
          SKIP_ENV_VALIDATION: "true"
          BETTER_AUTH_URL: http://localhost:3000
          BETTER_AUTH_SECRET: ci-prerender-only-not-a-runtime-secret
        run: pnpm --filter @everr/app-cloud build

name: Build & Push Images

on:
  workflow_call:
    inputs:
      app:
        type: boolean
        required: true
      collector:
        type: boolean
        required: true
      docs:
        type: boolean
        required: true

permissions:
  contents: read

concurrency:
  group: build-and-push-images
  cancel-in-progress: false

env:
  SCW_REGISTRY_HOST: rg.fr-par.scw.cloud
  SCW_REGISTRY_NAMESPACE: everr

jobs:
  build-app:
    name: Build Everr Cloud Image
    runs-on: blacksmith-2vcpu-ubuntu-2404
    if: inputs.app
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collect resource usage
        uses: ./.github/actions/everr-action
        with:
          check-run-id: ${{ job.check_run_id }}

      - name: Load Scaleway registry credentials
        id: scw-creds
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SCW_SECRET_KEY: op://Everr/Infra/secret_key

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.SCW_REGISTRY_HOST }}
          username: nologin
          password: ${{ steps.scw-creds.outputs.SCW_SECRET_KEY }}

      - name: Set up Blacksmith Docker builder
        uses: useblacksmith/setup-docker-builder@9657a6e02ca6445e6d6ce5ffaf370f4828dea50d # v2.4.0
        with:
          cache-key: build-and-push-images/app

      - name: Build and push Everr Cloud image
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          context: .
          file: packages/cloud/Dockerfile
          push: true
          build-args: |
            VITE_EVERR_PUBLIC_INGEST_KEY=${{ vars.APP_EVERR_PUBLIC_INGEST_KEY }}
            SERVICE_VERSION=${{ github.sha }}
            VCS_REPOSITORY_URL_FULL=${{ github.server_url }}/${{ github.repository }}
            VCS_REF_HEAD_REVISION=${{ github.sha }}
          tags: |
            ${{ env.SCW_REGISTRY_HOST }}/${{ env.SCW_REGISTRY_NAMESPACE }}/app:${{ github.sha }}
            ${{ env.SCW_REGISTRY_HOST }}/${{ env.SCW_REGISTRY_NAMESPACE }}/app:latest

  build-collector:
    name: Build Collector Image
    runs-on: blacksmith-2vcpu-ubuntu-2404
    if: inputs.collector
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collect resource usage
        uses: ./.github/actions/everr-action
        with:
          check-run-id: ${{ job.check_run_id }}

      - name: Load Scaleway registry credentials
        id: scw-creds
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SCW_SECRET_KEY: op://Everr/Infra/secret_key

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.SCW_REGISTRY_HOST }}
          username: nologin
          password: ${{ steps.scw-creds.outputs.SCW_SECRET_KEY }}

      - name: Set up Blacksmith Docker builder
        uses: useblacksmith/setup-docker-builder@9657a6e02ca6445e6d6ce5ffaf370f4828dea50d # v2.4.0
        with:
          cache-key: build-and-push-images/collector

      - name: Build and push collector image
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          context: ./collector
          file: collector/Dockerfile
          push: true
          build-args: |
            EVERR_BUILD_TARGET=cloud
          tags: |
            ${{ env.SCW_REGISTRY_HOST }}/${{ env.SCW_REGISTRY_NAMESPACE }}/collector:${{ github.sha }}
            ${{ env.SCW_REGISTRY_HOST }}/${{ env.SCW_REGISTRY_NAMESPACE }}/collector:latest

  build-docs:
    name: Build Docs Image
    runs-on: blacksmith-2vcpu-ubuntu-2404
    if: inputs.docs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collect resource usage
        uses: ./.github/actions/everr-action
        with:
          check-run-id: ${{ job.check_run_id }}

      - name: Load Scaleway registry credentials
        id: scw-creds
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SCW_SECRET_KEY: op://Everr/Infra/secret_key

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.SCW_REGISTRY_HOST }}
          username: nologin
          password: ${{ steps.scw-creds.outputs.SCW_SECRET_KEY }}

      - name: Set up Blacksmith Docker builder
        uses: useblacksmith/setup-docker-builder@9657a6e02ca6445e6d6ce5ffaf370f4828dea50d # v2.4.0
        with:
          cache-key: build-and-push-images/docs

      - name: Build and push docs image
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          context: .
          file: packages/docs/Dockerfile
          push: true
          build-args: |
            VITE_POSTHOG_PROJECT_TOKEN=${{ vars.DOCS_POSTHOG_PROJECT_TOKEN }}
            VITE_POSTHOG_HOST=${{ vars.DOCS_POSTHOG_HOST }}
            VITE_EVERR_PUBLIC_INGEST_KEY=${{ vars.DOCS_EVERR_PUBLIC_INGEST_KEY }}
            VITE_COMMIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.SCW_REGISTRY_HOST }}/${{ env.SCW_REGISTRY_NAMESPACE }}/docs:${{ github.sha }}
            ${{ env.SCW_REGISTRY_HOST }}/${{ env.SCW_REGISTRY_NAMESPACE }}/docs:latest

  notify-deploy:
    name: Notify Deploy Repo
    runs-on: ubuntu-24.04
    needs: [build-app, build-collector, build-docs]
    if: |
      always() &&
      (inputs.app ||
       inputs.collector ||
       inputs.docs) &&
      !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collect resource usage
        uses: ./.github/actions/everr-action
        with:
          check-run-id: ${{ job.check_run_id }}

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.EVERR_DEPLOY_BOT_APP_ID }}
          private-key: ${{ secrets.EVERR_DEPLOY_BOT_PRIVATE_KEY }}
          owner: everr-labs
          repositories: everr-deploy

      - name: Dispatch image update event
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: everr-labs/everr-deploy
          event-type: image-update
          client-payload: |
            {
              "sha": "${{ github.sha }}",
              "app": ${{ inputs.app }},
              "collector": ${{ inputs.collector }},
              "docs": ${{ inputs.docs }}
            }

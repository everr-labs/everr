name: Build & Push Images

on:
  workflow_call:
    inputs:
      app:
        type: boolean
        required: true
      collector:
        type: boolean
        required: true
      docs:
        type: boolean
        required: true

permissions:
  contents: read

concurrency:
  group: build-and-push-images
  cancel-in-progress: false

env:
  SCW_REGISTRY_HOST: rg.fr-par.scw.cloud
  SCW_REGISTRY_NAMESPACE: everr

jobs:
  build-app:
    name: Build Everr Cloud Image
    runs-on: blacksmith-2vcpu-ubuntu-2404
    if: inputs.app
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Collect resource usage
        uses: ./.github/actions/everr-action
        with:
          check-run-id: ${{ job.check_run_id }}

      - name: Load Scaleway registry credentials
        id: scw-creds
        uses: 1password/load-secrets-action@v2
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SCW_SECRET_KEY: op://Everr/Infra/secret_key

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.SCW_REGISTRY_HOST }}
          username: nologin
          password: ${{ steps.scw-creds.outputs.SCW_SECRET_KEY }}

      - name: Build and push Everr Cloud image
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: packages/cloud/Dockerfile
          push: true
          build-args: |
            VITE_EVERR_PUBLIC_INGEST_KEY=${{ vars.APP_EVERR_PUBLIC_INGEST_KEY }}
          tags: |
            ${{ env.SCW_REGISTRY_HOST }}/${{ env.SCW_REGISTRY_NAMESPACE }}/app:${{ github.sha }}
            ${{ env.SCW_REGISTRY_HOST }}/${{ env.SCW_REGISTRY_NAMESPACE }}/app:latest

  build-collector:
    name: Build Collector Image
    runs-on: blacksmith-2vcpu-ubuntu-2404
    if: inputs.collector
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Collect resource usage
        uses: ./.github/actions/everr-action
        with:
          check-run-id: ${{ job.check_run_id }}

      - name: Load Scaleway registry credentials
        id: scw-creds
        uses: 1password/load-secrets-action@v2
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SCW_SECRET_KEY: op://Everr/Infra/secret_key

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.SCW_REGISTRY_HOST }}
          username: nologin
          password: ${{ steps.scw-creds.outputs.SCW_SECRET_KEY }}

      - name: Build and push collector image
        uses: useblacksmith/build-push-action@v2
        with:
          context: ./collector
          file: collector/Dockerfile
          push: true
          tags: |
            ${{ env.SCW_REGISTRY_HOST }}/${{ env.SCW_REGISTRY_NAMESPACE }}/collector:${{ github.sha }}
            ${{ env.SCW_REGISTRY_HOST }}/${{ env.SCW_REGISTRY_NAMESPACE }}/collector:latest

  build-docs:
    name: Build Docs Image
    runs-on: blacksmith-2vcpu-ubuntu-2404
    if: inputs.docs
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Collect resource usage
        uses: ./.github/actions/everr-action
        with:
          check-run-id: ${{ job.check_run_id }}

      - name: Load Scaleway registry credentials
        id: scw-creds
        uses: 1password/load-secrets-action@v2
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SCW_SECRET_KEY: op://Everr/Infra/secret_key

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.SCW_REGISTRY_HOST }}
          username: nologin
          password: ${{ steps.scw-creds.outputs.SCW_SECRET_KEY }}

      - name: Build and push docs image
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: packages/docs/Dockerfile
          push: true
          build-args: |
            VITE_POSTHOG_PROJECT_TOKEN=${{ vars.DOCS_POSTHOG_PROJECT_TOKEN }}
            VITE_POSTHOG_HOST=${{ vars.DOCS_POSTHOG_HOST }}
            VITE_EVERR_PUBLIC_INGEST_KEY=${{ vars.DOCS_EVERR_PUBLIC_INGEST_KEY }}
            VITE_COMMIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.SCW_REGISTRY_HOST }}/${{ env.SCW_REGISTRY_NAMESPACE }}/docs:${{ github.sha }}
            ${{ env.SCW_REGISTRY_HOST }}/${{ env.SCW_REGISTRY_NAMESPACE }}/docs:latest

  notify-deploy:
    name: Notify Deploy Repo
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: [build-app, build-collector, build-docs]
    if: |
      always() &&
      (inputs.app ||
       inputs.collector ||
       inputs.docs) &&
      !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Collect resource usage
        uses: ./.github/actions/everr-action
        with:
          check-run-id: ${{ job.check_run_id }}

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.EVERR_DEPLOY_BOT_APP_ID }}
          private-key: ${{ secrets.EVERR_DEPLOY_BOT_PRIVATE_KEY }}
          owner: everr-labs
          repositories: everr-deploy

      - name: Dispatch image update event
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: everr-labs/everr-deploy
          event-type: image-update
          client-payload: |
            {
              "sha": "${{ github.sha }}",
              "app": ${{ inputs.app }},
              "collector": ${{ inputs.collector }},
              "docs": ${{ inputs.docs }}
            }

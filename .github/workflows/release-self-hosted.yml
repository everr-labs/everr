name: Release self-hosted images

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags: ["@everr/app@*"]

env:
  IMAGE_PREFIX: ghcr.io/everr-labs

jobs:
  build:
    name: Build ${{ matrix.image.name }} (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: true
      matrix:
        image:
          - name: everr-app
            context: .
            file: packages/app/Dockerfile
            build-args: ""
          - name: everr-collector
            context: ./collector
            file: collector/Dockerfile
            build-args: EVERR_BUILD_TARGET=self-hosted
        platform:
          - arch: amd64
            runner: blacksmith-2vcpu-ubuntu-2404
          - arch: arm64
            runner: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collect resource usage
        uses: ./.github/actions/everr-action
        with:
          check-run-id: ${{ job.check_run_id }}

      - name: Verify release tag
        id: version
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/app/package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "@everr/app@${version}" ]]; then
            echo "Release tag '$GITHUB_REF_NAME' does not match @everr/app@${version}." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image.name }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      # A local BuildKit on a Blacksmith sticky disk keeps the layer cache between
      # releases, one disk per image and architecture.
      - name: Set up Blacksmith Docker builder
        uses: useblacksmith/setup-docker-builder@9657a6e02ca6445e6d6ce5ffaf370f4828dea50d # v2.4.0
        with:
          cache-key: release-self-hosted/${{ matrix.image.name }}-${{ matrix.platform.arch }}

      # Each platform builds on a native runner and pushes by digest only. The
      # publish job then creates one multi-platform manifest under the version tags.
      - name: Build and push by digest
        id: build
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          # The collector image ignores SERVICE_VERSION.
          build-args: |
            ${{ matrix.image.build-args }}
            SERVICE_VERSION=${{ steps.version.outputs.version }}
          platforms: linux/${{ matrix.platform.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true

      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.image }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: build
    strategy:
      matrix:
        image: [everr-app, everr-collector]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collect resource usage
        uses: ./.github/actions/everr-action
        with:
          check-run-id: ${{ job.check_run_id }}

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./packages/app/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Prereleases (changesets pre mode, e.g. 0.12.0-next.0) get only their exact
      # version tag. Stable releases also move the minor tag and latest.
      # GHCR reads the source, description, and version of a multi-platform image
      # from the annotations of its index.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(steps.version.outputs.version, '-') }}
          annotations: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Create multi-platform manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do args+=(-t "$tag"); done \
            < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          while IFS= read -r annotation; do args+=(--annotation "$annotation"); done \
            < <(jq -r '.annotations[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do
            args+=("${{ env.IMAGE_PREFIX }}/${{ matrix.image }}@sha256:${digest}")
          done
          docker buildx imagetools create "${args[@]}"

      - name: Inspect image
        run: docker buildx imagetools inspect "${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ steps.version.outputs.version }}"

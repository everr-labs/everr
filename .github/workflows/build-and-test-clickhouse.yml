name: Build & Test ClickHouse

permissions:
  contents: read

concurrency:
  # For pushes, this lets concurrent runs happen, so each push gets a result.
  # But for other events (e.g. PRs), we can cancel the previous runs.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - .github/workflows/build-and-test-clickhouse.yml
      - biome.json
      - clickhouse/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

  push:
    branches: [main]
    paths:
      - .github/workflows/build-and-test-clickhouse.yml
      - biome.json
      - clickhouse/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

jobs:
  usage-metering:
    name: Usage Metering
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect resource usage
        uses: ./.github/actions/everr-action
        with:
          check-run-id: ${{ job.check_run_id }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint usage metering test
        run: pnpm exec biome check clickhouse

      - name: Test usage metering
        run: pnpm test:clickhouse

name: Build & Check Docs

on:
  workflow_call:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Collect resource usage
        uses: ./.github/actions/everr-action
        with:
          check-run-id: ${{ job.check_run_id }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck docs
        run: pnpm --filter @everr/docs types:check
      - name: Build docs
        env:
          VITE_POSTHOG_PROJECT_TOKEN: ci-build-placeholder
        run: pnpm --filter @everr/docs build

name: Everr CLI CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect resource usage
        uses: ./.github/actions/everr-action
        with:
          check-run-id: ${{ job.check_run_id }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/cli/go.mod
          cache-dependency-path: |
            packages/cli/go.sum
            collector/**/go.sum
      - run: pnpm install --frozen-lockfile

      # Compressing libchdb takes minutes on this runner. The scripts pin the
      # chDB version and the compression settings, so they make the key.
      - name: Cache compressed chDB
        uses: actions/cache@v4
        with:
          path: target/cli-go-assets/release/libchdb.so.zst
          key: chdb-zst-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/cli/scripts/build-support.ts', 'packages/cli/scripts/stage-go-assets.ts') }}

      - name: Typecheck local frontend
        run: pnpm --filter @everr/local-app typecheck

      - name: Build release binary
        run: pnpm --filter @everr/cli build:release

      - name: Test with prepared assets
        run: pnpm --filter @everr/cli test:go --prepared

      - name: Smoke test
        run: ./target/go/release/everr --help

name: Everr CLI CI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - .github/workflows/build-everr-cli.yml
      - packages/cli/**
      - packages/local-app/**
      - Cargo.toml
      - Cargo.lock
      - collector/**
      - packages/ui/**
      - packages/telemetry-explorer/**
      - packages/otel-web/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .nvmrc
      - packages/docs/Dockerfile
      - packages/docs/public/install.sh
      - packages/docs/content/docs/reference/cli.mdx
  push:
    branches: [main]
    paths:
      - .github/workflows/build-everr-cli.yml
      - packages/cli/**
      - packages/local-app/**
      - Cargo.toml
      - Cargo.lock
      - collector/**
      - packages/ui/**
      - packages/telemetry-explorer/**
      - packages/otel-web/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .nvmrc
      - packages/docs/Dockerfile
      - packages/docs/public/install.sh
      - packages/docs/content/docs/reference/cli.mdx

jobs:
  build:
    name: Build
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect resource usage
        uses: ./.github/actions/everr-action
        with:
          check-run-id: ${{ job.check_run_id }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: collector/go.mod
          cache-dependency-path: collector/**/go.sum
      - run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Test
        run: pnpm --filter @everr/cli test:rust

      - name: Build release binary
        run: pnpm --filter @everr/cli build:release

      - name: Smoke test
        run: ./target/release/everr --help

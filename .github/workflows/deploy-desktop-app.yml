name: Deploy Desktop App

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    tags:
      - "@everr/desktop-app@*"

jobs:
  build-desktop:
    name: Build, Sign, Notarize Desktop
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 25
    env:
      EVERR_DESKTOP_PUBLIC_BASE_URL: https://everr.dev/everr-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: collector/go.mod
          cache-dependency-path: |
            collector/**/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release secrets
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          EVERR_INGEST_KEY: ${{ secrets.EVERR_INGEST_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          missing=()
          for name in \
            APPLE_API_ISSUER \
            APPLE_API_KEY_ID \
            APPLE_API_PRIVATE_KEY \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_KEYCHAIN_PASSWORD \
            EVERR_INGEST_KEY \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required secret(s): %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Import Apple Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          certificate_path="$RUNNER_TEMP/everr-developer-id.p12"
          keychain_path="$RUNNER_TEMP/everr-build.keychain-db"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path" 2>/dev/null || \
            printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$certificate_path"

          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$APPLE_KEYCHAIN_PASSWORD" \
            "$keychain_path"

          cert_info="$(security find-identity -v -p codesigning "$keychain_path" | awk '/Developer ID Application/ { print; exit }')"
          if [[ -z "$cert_info" ]]; then
            echo "No Developer ID Application identity was found in the imported certificate."
            security find-identity -v -p codesigning "$keychain_path"
            exit 1
          fi

          cert_id="$(printf '%s' "$cert_info" | awk -F'"' '{print $2}')"
          {
            echo "APPLE_SIGNING_IDENTITY=$cert_id"
            echo "APPLE_KEYCHAIN_PATH=$keychain_path"
          } >> "$GITHUB_ENV"

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          key_dir="$RUNNER_TEMP/app-store-connect"
          key_path="$key_dir/AuthKey_${APPLE_API_KEY_ID}.p8"

          mkdir -p "$key_dir"
          printf '%s' "$APPLE_API_PRIVATE_KEY" | perl -0pe 's/\\n/\n/g' > "$key_path"
          chmod 600 "$key_path"

          {
            echo "APPLE_API_KEY=$APPLE_API_KEY_ID"
            echo "APPLE_API_KEY_PATH=$key_path"
          } >> "$GITHUB_ENV"

      - name: Build signed desktop release
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          EVERR_INGEST_KEY: ${{ secrets.EVERR_INGEST_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --dir packages/desktop-app build:desktop:ci

      - name: Verify signing and notarization
        run: |
          set -euo pipefail

          app_path="$(find target/release/bundle/macos packages/desktop-app/src-tauri/target/release/bundle/macos -maxdepth 1 -name 'Everr.app' -print -quit 2>/dev/null || true)"
          dmg_path="target/desktop-release/everr-app/everr-macos-arm64.dmg"
          cli_path="target/desktop-release/everr"

          if [[ -z "$app_path" ]]; then
            echo "Could not find the built Everr.app bundle."
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign --verify --strict --verbose=2 "$cli_path"
          spctl --assess --type execute --verbose "$app_path"
          spctl --assess --type open --context context:primary-signature --verbose "$dmg_path"
          xcrun stapler validate "$app_path"
          xcrun stapler validate "$dmg_path"

      - name: Upload desktop release payload
        uses: actions/upload-artifact@v4
        with:
          name: everr-desktop-release-payload-${{ github.sha }}
          path: target/desktop-release
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Write release summary
        run: |
          {
            echo "## Desktop release artifact"
            echo
            echo "- Payload artifact: everr-desktop-release-payload-${GITHUB_SHA}"
            echo
            echo '```json'
            cat target/desktop-release/release-metadata.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete temporary keychain
        if: always()
        run: |
          set -euo pipefail
          if [[ -n "${APPLE_KEYCHAIN_PATH:-}" && -f "$APPLE_KEYCHAIN_PATH" ]]; then
            security delete-keychain "$APPLE_KEYCHAIN_PATH"
          fi

  build-linux-cli:
    name: Build Linux CLI ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64
            runner: blacksmith-2vcpu-ubuntu-2404-arm
            asset: everr-linux-arm64
          - name: x86_64
            runner: ubuntu-24.04
            asset: everr-linux-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Test
        run: cargo test --manifest-path packages/desktop-app/src-cli/Cargo.toml

      - name: Build release binary
        run: cargo build --release --manifest-path packages/desktop-app/src-cli/Cargo.toml

      - name: Stage Linux CLI binary
        run: |
          set -euo pipefail
          mkdir -p target/linux-cli-release
          cp target/release/everr "target/linux-cli-release/${{ matrix.asset }}"
          chmod +x "target/linux-cli-release/${{ matrix.asset }}"
          (
            cd target/linux-cli-release
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          )

      - name: Smoke test
        run: ./target/linux-cli-release/${{ matrix.asset }} --help

      - name: Upload Linux CLI payload
        uses: actions/upload-artifact@v4
        with:
          name: everr-linux-cli-${{ matrix.name }}-${{ github.sha }}
          path: |
            target/linux-cli-release/${{ matrix.asset }}
            target/linux-cli-release/${{ matrix.asset }}.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  package-release:
    name: Package Release
    runs-on: ubuntu-24.04
    needs:
      - build-desktop
      - build-linux-cli
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download desktop payload
        uses: actions/download-artifact@v4
        with:
          name: everr-desktop-release-payload-${{ github.sha }}
          path: target/desktop-release

      - name: Download Linux CLI payloads
        uses: actions/download-artifact@v4
        with:
          pattern: everr-linux-cli-*-${{ github.sha }}
          path: target/linux-cli-release
          merge-multiple: true

      - name: Read desktop app version
        id: version
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/desktop-app/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Merge Linux CLI assets
        run: |
          set -euo pipefail

          for asset in everr-linux-arm64 everr-linux-x86_64; do
            test -f "target/linux-cli-release/$asset"
            chmod +x "target/linux-cli-release/$asset"
            test -x "target/linux-cli-release/$asset"
            test -f "target/linux-cli-release/$asset.sha256"
            (
              cd target/linux-cli-release
              sha256sum --check "$asset.sha256"
            )
            cp "target/linux-cli-release/$asset" "target/desktop-release/$asset"
            cp "target/linux-cli-release/$asset.sha256" "target/desktop-release/$asset.sha256"
          done

      - name: Stage action bundled CLI assets
        run: |
          set -euo pipefail

          action_bin="target/action-bundled-cli"
          rm -rf "$action_bin"
          mkdir -p "$action_bin/darwin-arm64" "$action_bin/linux-arm64" "$action_bin/linux-x64"

          cp target/desktop-release/everr "$action_bin/darwin-arm64/everr"
          cp target/desktop-release/everr.sha256 "$action_bin/darwin-arm64/everr.sha256"
          cp target/desktop-release/everr-linux-arm64 "$action_bin/linux-arm64/everr"
          cp target/desktop-release/everr-linux-arm64.sha256 "$action_bin/linux-arm64/everr.sha256"
          cp target/desktop-release/everr-linux-x86_64 "$action_bin/linux-x64/everr"
          cp target/desktop-release/everr-linux-x86_64.sha256 "$action_bin/linux-x64/everr.sha256"

          chmod +x "$action_bin/darwin-arm64/everr" "$action_bin/linux-arm64/everr" "$action_bin/linux-x64/everr"

      - name: Refresh release metadata and checksums
        run: |
          set -euo pipefail
          node <<'NODE'
          const { createHash } = require("node:crypto");
          const { readdirSync, readFileSync, statSync, writeFileSync } = require("node:fs");
          const { join, relative } = require("node:path");

          const root = "target/desktop-release";
          const ignored = new Set(["SHA256SUMS", "release-metadata.json"]);

          function findFiles(dir) {
            return readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const entryPath = join(dir, entry.name);
              return entry.isDirectory() ? findFiles(entryPath) : [entryPath];
            });
          }

          function rel(file) {
            return relative(root, file).split(/[\\/]/).join("/");
          }

          function sha256(file) {
            return createHash("sha256").update(readFileSync(file)).digest("hex");
          }

          const files = findFiles(root)
            .filter((file) => !ignored.has(rel(file)))
            .map((file) => ({
              path: rel(file),
              sha256: sha256(file),
              size: statSync(file).size,
            }))
            .sort((left, right) => left.path.localeCompare(right.path));

          const metadataPath = join(root, "release-metadata.json");
          const metadata = JSON.parse(readFileSync(metadataPath, "utf8"));
          metadata.files = files;
          writeFileSync(metadataPath, `${JSON.stringify(metadata, null, 2)}\n`);

          const checksums = findFiles(root)
            .filter((file) => rel(file) !== "SHA256SUMS")
            .map((file) => ({ path: rel(file), sha256: sha256(file) }))
            .sort((left, right) => left.path.localeCompare(right.path))
            .map((entry) => `${entry.sha256}  ${entry.path}`)
            .join("\n");
          writeFileSync(join(root, "SHA256SUMS"), `${checksums}\n`);
          NODE

      - name: Validate combined release payload
        run: |
          set -euo pipefail
          test -f target/desktop-release/everr
          test -f target/desktop-release/everr.sha256
          test -f target/desktop-release/everr-linux-arm64
          test -f target/desktop-release/everr-linux-arm64.sha256
          test -f target/desktop-release/everr-linux-x86_64
          test -f target/desktop-release/everr-linux-x86_64.sha256
          test -f target/desktop-release/everr-app/latest.json
          test -f target/desktop-release/everr-app/everr-macos-arm64.dmg
          test -f target/desktop-release/everr-app/everr-macos-arm64.app.tar.gz
          test -f target/desktop-release/everr-app/everr-macos-arm64.app.tar.gz.sig
          (
            cd target/desktop-release
            sha256sum --check SHA256SUMS
          )

      - name: Attest release artifact checksums
        uses: actions/attest@v4
        with:
          subject-checksums: target/desktop-release/SHA256SUMS

      - name: Upload release artifact
        id: upload-desktop-release
        uses: actions/upload-artifact@v4
        with:
          name: everr-desktop-release-${{ steps.version.outputs.version }}
          path: target/desktop-release
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload action bundled CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: everr-action-bundled-cli-${{ steps.version.outputs.version }}
          path: target/action-bundled-cli
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Generate GitHub App token for action repo
        id: action-repo-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.EVERR_DEPLOY_BOT_APP_ID }}
          private-key: ${{ secrets.EVERR_DEPLOY_BOT_PRIVATE_KEY }}
          owner: everr-labs
          repositories: everr-action

      - name: Push bundled CLI assets to action repo
        env:
          GH_TOKEN: ${{ steps.action-repo-token.outputs.token }}
          SRC_SHA: ${{ github.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          work="${RUNNER_TEMP}/everr-action-clone"
          rm -rf "$work"
          git clone --depth 1 --branch main \
            "https://x-access-token:${GH_TOKEN}@github.com/everr-labs/everr-action.git" "$work"

          cd "$work"
          git config user.name "everr-action-bot"
          git config user.email "everr-action-bot@users.noreply.github.com"

          rm -rf bin
          mkdir -p bin
          cp -R "${GITHUB_WORKSPACE}/target/action-bundled-cli"/. bin/

          git add -A bin
          if git diff --cached --quiet; then
            echo "No bundled CLI asset changes to publish."
          else
            git commit -m "Update bundled CLI ${VERSION} (from everr-labs/everr@${SRC_SHA})"
            git push origin main || {
              git pull --rebase origin main
              git push origin main
            }
          fi

  notify-deploy:
    name: Notify Deploy Repo
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: package-release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read desktop app version
        id: version
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/desktop-app/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.EVERR_DEPLOY_BOT_APP_ID }}
          private-key: ${{ secrets.EVERR_DEPLOY_BOT_PRIVATE_KEY }}
          owner: everr-labs
          repositories: everr-deploy

      - name: Dispatch desktop app release event
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: everr-labs/everr-deploy
          event-type: desktop-app-release
          client-payload: |
            {
              "source_repo": "${{ github.repository }}",
              "run_id": "${{ github.run_id }}",
              "sha": "${{ github.sha }}",
              "version": "${{ steps.version.outputs.version }}",
              "artifact_name": "everr-desktop-release-${{ steps.version.outputs.version }}"
            }

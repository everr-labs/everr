name: Build & Test Collector

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: ./collector

jobs:
  lint:
    name: Lint
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect resource usage
        uses: ./.github/actions/everr-action
        with:
          check-run-id: ${{ job.check_run_id }}

      - name: Set up Go
        id: go
        uses: actions/setup-go@v5
        with:
          go-version-file: collector/go.mod
          cache: false

      - name: Cache Go
        id: cache
        timeout-minutes: 5
        uses: actions/cache@v4
        with:
          path: |
            ~/go/bin
            ~/go/pkg/mod
            ~/.cache/go-build
            ./collector/.tools
          key: go-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('collector/**/go.mod', 'collector/**/go.sum') }}
          restore-keys: |
            go-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - name: Warm module cache
        if: steps.cache.outputs.cache-hit != 'true'
        run: go mod download

      - name: Install tools
        run: make install-tools

      - name: Make lint-all
        run: make lint-all

      - name: Check formatting
        run: |
          make fmt-all
          git diff -s --exit-code || (echo 'Code is not formatted. Run make fmt-all and commit the changes' && exit 1)

      - name: Check Code Generation
        run: |
          make generate
          git diff -s --exit-code || (echo 'Generated code is out of date. Run make generate and commit the changes' && exit 1)

      - name: Check packages are up-to-date
        run: |
          make tidy-all
          git diff -s --exit-code || (echo 'Packages are out of date. Run make tidy-all and commit the changes' && exit 1)

      - name: Check crosslink run
        run: |
          make crosslink
          git diff -s --exit-code || (echo 'Replace statements not updated. Run make crosslink and commit the changes' && exit 1)

  build:
    name: Build
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect resource usage
        uses: ./.github/actions/everr-action
        with:
          check-run-id: ${{ job.check_run_id }}

      - name: Set up Go
        id: go
        uses: actions/setup-go@v5
        with:
          go-version-file: collector/go.mod
          cache: false

      - name: Cache Go
        id: cache
        timeout-minutes: 5
        uses: actions/cache@v4
        with:
          path: |
            ~/go/bin
            ~/go/pkg/mod
            ~/.cache/go-build
            ./collector/.tools
          key: go-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('collector/**/go.mod', 'collector/**/go.sum') }}
          restore-keys: |
            go-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - name: Warm module cache
        if: steps.cache.outputs.cache-hit != 'true'
        run: go mod download

      - name: Make build
        run: make build

  test:
    name: Test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect resource usage
        uses: ./.github/actions/everr-action
        with:
          check-run-id: ${{ job.check_run_id }}

      - name: Set up Go
        id: go
        uses: actions/setup-go@v5
        with:
          go-version-file: collector/go.mod
          cache: false

      - name: Cache Go
        id: cache
        timeout-minutes: 5
        uses: actions/cache@v4
        with:
          path: |
            ~/go/bin
            ~/go/pkg/mod
            ~/.cache/go-build
            ./collector/.tools
          key: go-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('collector/**/go.mod', 'collector/**/go.sum') }}
          restore-keys: |
            go-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - name: Warm module cache
        if: steps.cache.outputs.cache-hit != 'true'
        run: go mod download

      - name: Make test-all
        run: make test-all

name: Bundle Size

on:
  workflow_call:

permissions:
  contents: read

jobs:
  size:
    name: Size gate
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Collect resource usage
        uses: ./.github/actions/everr-action
        with:
          check-run-id: ${{ job.check_run_id }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and gate bundle size
        # Builds the package, then asserts the cookieless core and (when
        # present) the lazy replay chunk stay within the spec budgets. The
        # measured size is printed so growth is watchable, not just gated.
        run: pnpm --filter @everr/otel-web size

name: Fallow

on:
  workflow_call:

permissions:
  contents: read

jobs:
  dead-code:
    name: Dead-code scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: fallow dead-code
        # Stage 1 of the fallow rollout — enforces only the rules we cleaned
        # under .fallowrc.jsonc. Health + dupes move under `fallow audit` with
        # baselines in stage 2.
        run: pnpm exec fallow dead-code --fail-on-issues --quiet

kind: AlertRule
metadata:
  name: log-volume-spike
  labels:
    team: platform
spec:
  display:
    name: Log volume spike
    description: Services with elevated log volume in the recent window.
  notificationMessage:
    title: "${ServiceName} exceeded the log volume threshold"
    description: "SEmitted ${n} logs in the last window"
  evaluationInterval: 1m
  query: |
    SELECT
      ServiceName,
      count() AS n
    FROM logs
    WHERE TimestampTime >= now() - INTERVAL 15 MINUTE
      AND ServiceName != 'alert'
    GROUP BY ServiceName
    HAVING n > 1
    ORDER BY n DESC
    LIMIT 5

kind: AlertRule
metadata:
  name: even-minute-check
  labels:
    team: platform
spec:
  display:
    name: Even-minute failure test
    description: Fires when the scheduler observes an even minute.
  notificationMessage:
    title: "Even-minute failure test is firing"
    description: "The current minute is even at ${checked_at}"
  evaluationInterval: 1m
  instanceLabels: [checked_at]
  query: |
    SELECT
      now() AS checked_at
    WHERE modulo(toMinute(now()), 2) = 0

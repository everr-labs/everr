kind: AlertRule
metadata:
  name: every-minute
  labels:
    team: platform
spec:
  display:
    name: Every minute alert
    description: Fires an alert every minute to check that the schedule works properly
  notificationMessage:
    title: "Every minute failure test is firing"
    description: "The current minute is ${minute} ad ${now}"
  evaluationInterval: 1m
  instanceLabels: [minute]
  query: |
    SELECT toMinute(now()) AS minute, now() as now

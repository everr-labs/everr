kind: AlertRule
metadata:
  name: even-minute-failure
  labels:
    team: platform
spec:
  evaluationInterval: 1m
  instanceLabels: [checked_at]
  summary: "Even-minute failure test is firing"
  description: "The current minute is even at ${top_checked_at}"
  query: |
    SELECT
      now() AS checked_at
    WHERE modulo(toMinute(now()), 2) = 0

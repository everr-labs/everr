kind: AlertRule
metadata:
  name: log-volume-spike
  labels:
    team: platform
spec:
  evaluationInterval: 1m
  summary: "${row_count} services exceeded the log volume threshold"
  description: "Top service ${top_ServiceName} emitted ${top_n} logs in the last window"
  query: |
    SELECT
      ServiceName,
      count() AS n
    FROM logs
    WHERE TimestampTime >= now() - INTERVAL 15 MINUTE
      AND ServiceName != 'alert'
    GROUP BY ServiceName
    HAVING n > 1
    ORDER BY n DESC
    LIMIT 5

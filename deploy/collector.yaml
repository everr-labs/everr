extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage/ingestion:
    directory: ${env:EVERR_QUEUE_DIRECTORY:-/var/lib/everr/queue}
    create_directory: true
    fsync: true
  everr_usage:
    max_series: 30000
  # Authenticates public OTLP ingest by exchanging a Bearer key with the
  # everr app's internal verify endpoint. The shared secret guards that
  # endpoint; rotate both sides together.
  everr_apikey:
    endpoint: http://app:3000/api/internal/verify-key
    shared_secret: ${env:INGEST_VERIFY_SHARED_SECRET}

connectors:
  everr_usage_connector:
    interval: 60s
    timeout: 10s

receivers:
  # Public OTLP ingest. Authenticated via the everr_apikey extension; tenant
  # is derived from the validated key, never from request headers/attrs.
  otlp/public:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: everr_apikey
        # Browser ingestion: CORS preflights carry no Authorization header,
        # so the receiver must admit any origin at the CORS layer. Real
        # enforcement is per key: the everr_apikey extension forwards the
        # request's Origin to verify-key, which only allows public keys from
        # their allowlisted origins.
        cors:
          allowed_origins: ["*"]
          allowed_headers: ["Authorization", "Content-Type"]
        # confighttp's default (20 MiB), made explicit for the public edge.
        max_request_body_size: 20971520
      grpc:
        endpoint: 0.0.0.0:4317
        auth:
          authenticator: everr_apikey

processors:
  everr_usage: {}
  delta_to_cumulative/usage:
    max_stale: 5m
    max_streams: 60000
  # Reserve the everr.* metric namespace on every incoming metrics pipeline.
  # Generated usage has its own pipeline and bypasses this filter.
  filter/reserved_everr:
    error_mode: propagate
    metric_conditions:
      - 'IsMatch(metric.name, "^everr[.]")'
  # Public pipeline: strip any client-supplied tenant or retention attr from
  # spans/logs/metric points so only the auth-derived values land downstream.
  attributes/strip_user_tenant:
    actions:
      - action: delete
        key: everr.tenant.id
      - action: delete
        key: everr.retention.days

  # Public pipeline: stamp tenant and retention from the auth context onto the
  # resource. upsert overwrites any client-supplied resource value.
  resource/public_tenant:
    attributes:
      - action: upsert
        key: everr.tenant.id
        from_context: auth.tenant_id
  resource/public_retention_traces:
    attributes:
      - action: upsert
        key: everr.retention.days
        from_context: auth.retention_traces_days
  resource/public_retention_logs:
    attributes:
      - action: upsert
        key: everr.retention.days
        from_context: auth.retention_logs_days
  resource/public_retention_metrics:
    attributes:
      - action: upsert
        key: everr.retention.days
        from_context: auth.retention_metrics_days

exporters:
  # Writes into otel.* landing tables (ENGINE = Null). Nothing is stored there;
  # the views in clickhouse/init/10-create-mvs.sql stamp tenant and retention
  # and write app.*. `ttl` is unused with create_schema: false.
  clickhouse:
    endpoint: http://clickhouse:8123
    username: collector_rw
    password: ${env:COLLECTOR_RW_PASSWORD}
    database: otel
    create_schema: false
    connection_params:
      wait_for_async_insert: "1"
      materialized_views_ignore_errors: "0"
    # Logs and traces write JSON attribute columns with typed values and one
    # keys array per attribute column; the landing tables in
    # clickhouse/init/03 declare that column set. A Map exporter against those
    # tables fails every insert, and the reverse too, so this flag and the
    # schema move together.
    json: true
    # Successful exporter calls acknowledge durable admission. Delivery,
    # batching, and retries remain inside the standard exporter.
    sending_queue:
      enabled: true
      storage: file_storage/ingestion
      wait_for_result: false
      queue_size: 10000
      num_consumers: 10
      batch:
        min_size: 8192
        flush_timeout: 1s
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0s
  # Usage has its own persistent metrics queue, separate from customer metrics.
  # The exporter ID namespaces queue storage even with the same file storage extension.
  clickhouse/usage:
    endpoint: http://clickhouse:8123
    username: collector_rw
    password: ${env:COLLECTOR_RW_PASSWORD}
    database: otel
    create_schema: false
    connection_params:
      wait_for_async_insert: "1"
      materialized_views_ignore_errors: "0"
    json: true
    # Wait for queue capacity within the usage publication timeout.
    # Database delivery and retries remain asynchronous after admission.
    sending_queue:
      enabled: true
      storage: file_storage/ingestion
      wait_for_result: false
      block_on_overflow: true
      queue_size: 10000
      num_consumers: 10
      batch:
        min_size: 8192
        flush_timeout: 1s
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0s
service:
  extensions: [health_check, everr_apikey, everr_usage, file_storage/ingestion]
  pipelines:
    metrics/usage:
      receivers: [everr_usage_connector]
      processors: [delta_to_cumulative/usage]
      exporters: [clickhouse/usage]

    # Tenant and retention come exclusively from authenticated keys.
    traces/public:
      receivers: [otlp/public]
      processors: [attributes/strip_user_tenant, resource/public_tenant, resource/public_retention_traces, everr_usage]
      exporters: [clickhouse, everr_usage_connector]
    metrics/public:
      receivers: [otlp/public]
      processors: [filter/reserved_everr, attributes/strip_user_tenant, resource/public_tenant, resource/public_retention_metrics, everr_usage]
      exporters: [clickhouse, everr_usage_connector]
    logs/public:
      receivers: [otlp/public]
      processors: [attributes/strip_user_tenant, resource/public_tenant, resource/public_retention_logs, everr_usage]
      exporters: [clickhouse, everr_usage_connector]

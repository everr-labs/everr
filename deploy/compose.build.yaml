# Build the images from this checkout instead of pulling them from Docker Hub:
#   docker compose -f compose.yaml -f compose.build.yaml up -d --build --wait
services:
  app:
    image: everr-app:local
    build:
      context: ..
      dockerfile: packages/app/Dockerfile

  clickhouse:
    image: everr-clickhouse:local
    build:
      context: ../clickhouse
      target: self-hosted

  collector:
    image: everr-collector:local
    build:
      context: ../collector
      args:
        EVERR_BUILD_TARGET: self-hosted

kind: Dashboard
metadata:
  name: service-health-stats
  project: demo
spec:
  display:
    name: Service Health Stats
    description: Demonstrates the StatChart visualization rendering multiple tiles via multi-column selects, SQL pivots, and multi-query panels.
  duration: 7d
  refreshInterval: 1m
  panels:
    latency-percentiles:
      kind: Panel
      spec:
        display:
          name: Latency percentiles (ms)
          description: p50 / p95 / p99 for everr-web-node server spans — 3 sparklined tiles from one query.
        plugin:
          kind: StatChart
          spec:
            calculation: last
            unit: ms
            sparkline: true
            thresholds:
              mode: absolute
              defaultColor: "#22c55e"
              steps:
                - { value: 200, color: "#f59e0b" }
                - { value: 500, color: "#ef4444" }
        queries:
          - kind: ClickHouseSQL
            spec:
              plugin:
                kind: ClickHouseSQL
                spec:
                  query: |
                    SELECT toStartOfInterval(Timestamp, INTERVAL {step:UInt32} SECOND) AS ts,
                           quantile(0.5)(Duration) / 1e6  AS p50_ms,
                           quantile(0.95)(Duration) / 1e6 AS p95_ms,
                           quantile(0.99)(Duration) / 1e6 AS p99_ms
                    FROM traces
                    WHERE Timestamp >= {from:String} AND Timestamp <= {to:String}
                      AND ServiceName = 'everr-web-node'
                      AND SpanKind = 'Server'
                    GROUP BY ts
                    ORDER BY ts
    spans-by-kind:
      kind: Panel
      spec:
        display:
          name: Spans by kind
          description: SQL-pivot of span counts into 3 tiles (Server / Client / Internal).
        plugin:
          kind: StatChart
          spec:
            calculation: last
            unit: ""
            sparkline: false
            thresholds:
              mode: absolute
              defaultColor: "#22c55e"
              steps:
                - { value: 1000, color: "#f59e0b" }
                - { value: 10000, color: "#ef4444" }
        queries:
          - kind: ClickHouseSQL
            spec:
              plugin:
                kind: ClickHouseSQL
                spec:
                  query: |
                    SELECT countIf(SpanKind = 'Server')   AS server_spans,
                           countIf(SpanKind = 'Client')   AS client_spans,
                           countIf(SpanKind = 'Internal') AS internal_spans
                    FROM traces
                    WHERE Timestamp >= {from:String} AND Timestamp <= {to:String}
                      AND ServiceName = 'everr-web-node'
    golden-signals-counts:
      kind: Panel
      spec:
        display:
          name: Golden signals — volume
          description: Total requests + error count for everr-web-node server spans (sum reduction, count unit).
        plugin:
          kind: StatChart
          spec:
            calculation: sum
            unit: ""
            sparkline: true
            thresholds:
              mode: absolute
              defaultColor: "#22c55e"
        queries:
          - kind: ClickHouseSQL
            spec:
              plugin:
                kind: ClickHouseSQL
                spec:
                  query: |
                    SELECT toStartOfInterval(Timestamp, INTERVAL {step:UInt32} SECOND) AS ts,
                           count()                          AS total_requests,
                           countIf(StatusCode = 'Error')    AS error_count
                    FROM traces
                    WHERE Timestamp >= {from:String} AND Timestamp <= {to:String}
                      AND ServiceName = 'everr-web-node'
                      AND SpanKind = 'Server'
                    GROUP BY ts
                    ORDER BY ts
    golden-signals-rates:
      kind: Panel
      spec:
        display:
          name: Golden signals — error rate & p95
          description: Error rate % and p95 latency ms — overall snapshot (last reduction).
        plugin:
          kind: StatChart
          spec:
            calculation: last
            unit: ""
            sparkline: false
            thresholds:
              mode: absolute
              defaultColor: "#22c55e"
              steps:
                - { value: 1, color: "#f59e0b" }
                - { value: 5, color: "#ef4444" }
        queries:
          - kind: ClickHouseSQL
            spec:
              plugin:
                kind: ClickHouseSQL
                spec:
                  query: |
                    SELECT countIf(StatusCode = 'Error') / count() * 100 AS error_rate_pct,
                           quantile(0.95)(Duration) / 1e6               AS p95_ms
                    FROM traces
                    WHERE Timestamp >= {from:String} AND Timestamp <= {to:String}
                      AND ServiceName = 'everr-web-node'
                      AND SpanKind = 'Server'
    multi-query-stats:
      kind: Panel
      spec:
        display:
          name: Cross-source snapshot
          description: Tiles from THREE separate queries on one panel — web requests, Postgres calls, CI spans.
        plugin:
          kind: StatChart
          spec:
            calculation: last
            unit: ""
            sparkline: false
            thresholds:
              mode: absolute
              defaultColor: "#3b82f6"
        queries:
          - kind: ClickHouseSQL
            spec:
              plugin:
                kind: ClickHouseSQL
                spec:
                  query: |
                    SELECT count() AS web_server_spans
                    FROM traces
                    WHERE Timestamp >= {from:String} AND Timestamp <= {to:String}
                      AND ServiceName = 'everr-web-node'
                      AND SpanKind = 'Server'
          - kind: ClickHouseSQL
            spec:
              plugin:
                kind: ClickHouseSQL
                spec:
                  query: |
                    SELECT count() AS postgres_queries
                    FROM traces
                    WHERE Timestamp >= {from:String} AND Timestamp <= {to:String}
                      AND ServiceName = 'everr-web-node'
                      AND SpanKind = 'Client'
                      AND SpanAttributes['db.system'] = 'postgresql'
          - kind: ClickHouseSQL
            spec:
              plugin:
                kind: ClickHouseSQL
                spec:
                  query: |
                    SELECT count() AS ci_spans
                    FROM traces
                    WHERE Timestamp >= {from:String} AND Timestamp <= {to:String}
                      AND ServiceName = 'github-actions'
    request-rate:
      kind: Panel
      spec:
        display:
          name: Request rate (spans/min)
          description: everr-web-node server span volume over time, for context.
        plugin:
          kind: TimeSeriesChart
          spec:
            unit: ""
            showLegend: true
            lineWidth: 1.5
            curveType: monotone
            connectNulls: false
        queries:
          - kind: ClickHouseSQL
            spec:
              plugin:
                kind: ClickHouseSQL
                spec:
                  query: |
                    SELECT toStartOfInterval(Timestamp, INTERVAL {step:UInt32} SECOND) AS ts,
                           count() AS requests
                    FROM traces
                    WHERE Timestamp >= {from:String} AND Timestamp <= {to:String}
                      AND ServiceName = 'everr-web-node'
                      AND SpanKind = 'Server'
                    GROUP BY ts
                    ORDER BY ts
  layouts:
    - kind: Grid
      spec:
        items:
          - { x: 0,  y: 0,  width: 24, height: 6,  content: { $ref: "#/spec/panels/latency-percentiles" } }
          - { x: 0,  y: 6,  width: 12, height: 6,  content: { $ref: "#/spec/panels/spans-by-kind" } }
          - { x: 12, y: 6,  width: 12, height: 6,  content: { $ref: "#/spec/panels/golden-signals-rates" } }
          - { x: 0,  y: 12, width: 12, height: 6,  content: { $ref: "#/spec/panels/golden-signals-counts" } }
          - { x: 12, y: 12, width: 12, height: 6,  content: { $ref: "#/spec/panels/multi-query-stats" } }
          - { x: 0,  y: 18, width: 24, height: 8,  content: { $ref: "#/spec/panels/request-rate" } }

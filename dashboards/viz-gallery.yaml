kind: Dashboard
metadata:
  name: viz-gallery
  project: demo
spec:
  display:
    name: Visualization Gallery
    description: >-
      Exercises every visualization kind with every spec option — the visual
      regression sheet for the dashboard panel system. When a visualization or
      option is added, a panel here must exercise it. Panels are driven by the
      deterministic TestData query kind (no real telemetry), so the sheet renders
      identical output every time.
  duration: 7d
  refreshInterval: 1m
  panels:
    # ── TimeSeriesChart ──────────────────────────────────────────────
    # Options: unit, showLegend, lineWidth, curveType (all 5 values),
    # connectNulls. Plus behaviors: grouped pivot, multi-column series.
    ts-monotone-grouped:
      kind: Panel
      spec:
        display:
          name: "TS: monotone, grouped, legend"
          description: "curveType: monotone · showLegend: true · connectNulls: false · grouped pivot (one series per StatusCode)"
        plugin:
          kind: TimeSeriesChart
          spec:
            unit: ""
            showLegend: true
            lineWidth: 1.5
            curveType: monotone
            connectNulls: false
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: random_walk
                  seed: 11
                  labelColumn: status
                  series:
                    - { name: Ok,    start: 800, noise: 60, min: 0 }
                    - { name: Error, start: 40,  noise: 12, min: 0 }
                    - { name: Unset, start: 120, noise: 20, min: 0 }
    ts-step-after-multi-column:
      kind: Panel
      spec:
        display:
          name: "TS: stepAfter, unit, two columns"
          description: "curveType: stepAfter · unit: ms · lineWidth: 2 · two value columns from one query"
        plugin:
          kind: TimeSeriesChart
          spec:
            unit: ms
            showLegend: true
            lineWidth: 2
            curveType: stepAfter
            connectNulls: false
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: random_walk
                  seed: 7
                  series:
                    - { name: p50_ms, start: 40,  noise: 5,  min: 0 }
                    - { name: p95_ms, start: 120, noise: 12, min: 0 }
    ts-linear-connect-nulls:
      kind: Panel
      spec:
        display:
          name: "TS: linear, connectNulls, thick"
          description: "curveType: linear · connectNulls: true (sparse errors bridge gaps) · lineWidth: 3"
        plugin:
          kind: TimeSeriesChart
          spec:
            unit: ""
            showLegend: false
            lineWidth: 3
            curveType: linear
            connectNulls: true
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: random_walk
                  seed: 3
                  series:
                    - { name: error_spans, start: 4, noise: 3, min: 0, nullChance: 0.45 }
    ts-natural:
      kind: Panel
      spec:
        display:
          name: "TS: natural, seconds unit"
          description: "curveType: natural · unit: s"
        plugin:
          kind: TimeSeriesChart
          spec:
            unit: s
            showLegend: false
            lineWidth: 1.5
            curveType: natural
            connectNulls: false
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: random_walk
                  seed: 5
                  series:
                    - { name: avg_s, start: 0.5, noise: 0.1, min: 0 }
    ts-step-before:
      kind: Panel
      spec:
        display:
          name: "TS: stepBefore, hairline"
          description: "curveType: stepBefore · lineWidth: 1"
        plugin:
          kind: TimeSeriesChart
          spec:
            unit: ""
            showLegend: false
            lineWidth: 1
            curveType: stepBefore
            connectNulls: false
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: random_walk
                  seed: 9
                  series:
                    - { name: spans, start: 50, noise: 10, min: 0 }
    # ── StatChart ────────────────────────────────────────────────────
    # Options: calculation (all 9 values), unit, decimals, sparkline,
    # thresholds (mode absolute/percent, defaultColor, steps, max),
    # colorMode (value/background), showLabel, noValue. Plus behaviors:
    # multi-query tiles, placeholder tile, row-order sparkline.
    stat-last:
      kind: Panel
      spec:
        display:
          name: "Stat: last"
          description: "calculation: last · unit: ms · decimals: 1 · sparkline · absolute thresholds with steps"
        plugin:
          kind: StatChart
          spec:
            calculation: last
            unit: ms
            decimals: 1
            sparkline: true
            thresholds:
              mode: absolute
              defaultColor: "#22c55e"
              steps:
                - { value: 10000, color: "#f59e0b" }
                - { value: 60000, color: "#ef4444" }
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: random_walk
                  seed: 21
                  series:
                    - { name: p95_ms, start: 120, noise: 18, min: 0 }
    stat-first:
      kind: Panel
      spec:
        display:
          name: "Stat: first"
          description: "calculation: first · decimals: 0"
        plugin:
          kind: StatChart
          spec:
            calculation: first
            decimals: 0
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: random_walk
                  seed: 22
                  series:
                    - { name: ci_spans, start: 200, noise: 30, min: 0 }
    stat-mean:
      kind: Panel
      spec:
        display:
          name: "Stat: mean"
          description: "calculation: mean · unit: s · decimals: 2"
        plugin:
          kind: StatChart
          spec:
            calculation: mean
            unit: s
            decimals: 2
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: random_walk
                  seed: 23
                  series:
                    - { name: avg_s, start: 0.6, noise: 0.1, min: 0 }
    stat-min:
      kind: Panel
      spec:
        display:
          name: "Stat: min"
          description: "calculation: min · unit: ms"
        plugin:
          kind: StatChart
          spec:
            calculation: min
            unit: ms
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: random_walk
                  seed: 24
                  series:
                    - { name: min_ms, start: 5, noise: 2, min: 0 }
    stat-max-percent-thresholds:
      kind: Panel
      spec:
        display:
          name: "Stat: max, percent thresholds"
          description: "calculation: max · thresholds mode: percent with max: 2000 (steps compare value/max·100)"
        plugin:
          kind: StatChart
          spec:
            calculation: max
            thresholds:
              mode: percent
              max: 2000
              defaultColor: "#22c55e"
              steps:
                - { value: 50, color: "#f59e0b" }
                - { value: 90, color: "#ef4444" }
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: random_walk
                  seed: 25
                  series:
                    - { name: ci_spans, start: 800, noise: 200, min: 0 }
    stat-sum-background:
      kind: Panel
      spec:
        display:
          name: "Stat: sum, background color"
          description: "calculation: sum · colorMode: background (tile fills with the threshold color) · sparkline on a filled tile"
        plugin:
          kind: StatChart
          spec:
            calculation: sum
            sparkline: true
            colorMode: background
            thresholds:
              mode: absolute
              defaultColor: "#3b82f6"
              steps:
                - { value: 1000, color: "#f59e0b" }
                - { value: 10000, color: "#ef4444" }
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: random_walk
                  seed: 26
                  series:
                    - { name: ci_spans, start: 300, noise: 80, min: 0 }
    stat-count-show-label:
      kind: Panel
      spec:
        display:
          name: "Stat: count, forced label"
          description: "calculation: count (number of buckets) · showLabel: true on a single tile"
        plugin:
          kind: StatChart
          spec:
            calculation: count
            showLabel: true
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: random_walk
                  seed: 27
                  series:
                    - { name: active_buckets, start: 10, noise: 4, min: 0 }
    stat-range:
      kind: Panel
      spec:
        display:
          name: "Stat: range"
          description: "calculation: range (max − min) · sparkline"
        plugin:
          kind: StatChart
          spec:
            calculation: range
            sparkline: true
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: random_walk
                  seed: 28
                  series:
                    - { name: ci_spans, start: 500, noise: 120, min: 0 }
    stat-diff:
      kind: Panel
      spec:
        display:
          name: "Stat: diff"
          description: "calculation: diff (last − first; can be negative)"
        plugin:
          kind: StatChart
          spec:
            calculation: diff
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: random_walk
                  seed: 29
                  series:
                    - { name: ci_spans, start: 500, noise: 120, min: 0 }
    stat-multi-query-no-value:
      kind: Panel
      spec:
        display:
          name: "Stat: multi-query + noValue"
          description: "Two queries on one panel — Query B returns no rows, so its tile shows the custom noValue text under the Query B fallback label."
        plugin:
          kind: StatChart
          spec:
            calculation: last
            noValue: "n/a"
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: random_walk
                  seed: 30
                  series:
                    - { name: ci_spans, start: 1000, noise: 150, min: 0 }
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: csv
                  columns: [svc, never]
                  rows: []
    stat-row-order-sparkline:
      kind: Panel
      spec:
        display:
          name: "Stat: row-order sparkline"
          description: "No time column — the sparkline follows row order (50 generated points, no ts)."
        plugin:
          kind: StatChart
          spec:
            calculation: max
            sparkline: true
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: random_walk
                  seed: 31
                  timeColumn: false
                  points: 50
                  series:
                    - { name: spans, start: 5, noise: 6, min: 0 }
    # ── Table ────────────────────────────────────────────────────────
    # Options: stickyHeader. Plus behaviors: multi-query selector, NULL
    # rendering, scroll container.
    table-sticky:
      kind: Panel
      spec:
        display:
          name: "Table: sticky header"
          description: "stickyHeader: true — header stays pinned while the 100 rows scroll."
        plugin:
          kind: Table
          spec:
            stickyHeader: true
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: table
                  seed: 41
                  rows: 100
                  columns:
                    - { name: Timestamp,  time: true }
                    - { name: SpanName,   values: [GET /users, POST /orders, GET /health, POST /login, GET /metrics] }
                    - { name: SpanKind,   values: [Server, Client, Internal] }
                    - { name: StatusCode, values: [Ok, Error, Unset] }
                    - { name: duration_ms, walk: { start: 50, noise: 30, min: 0, round: 1 } }
    table-multi-query:
      kind: Panel
      spec:
        display:
          name: "Table: query selector"
          description: "stickyHeader: false · two queries — the Query A/B toggle switches frames."
        plugin:
          kind: Table
          spec:
            stickyHeader: false
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: table
                  seed: 42
                  rows: 20
                  columns:
                    - { name: SpanName, values: [GET /users, POST /orders, GET /health, POST /login, GET /metrics] }
                    - { name: spans,    walk: { start: 200, noise: 50, min: 0, round: 0 } }
                    - { name: p95_ms,   walk: { start: 120, noise: 20, min: 0, round: 1 } }
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: csv
                  columns: [severity, logs]
                  rows:
                    - [ERROR, 12]
                    - [WARN, 48]
                    - [INFO, 320]
                    - [DEBUG, 90]
  layouts:
    - kind: Grid
      spec:
        items:
          - { x: 0,  y: 0,  width: 12, height: 8, content: { $ref: "#/spec/panels/ts-monotone-grouped" } }
          - { x: 12, y: 0,  width: 12, height: 8, content: { $ref: "#/spec/panels/ts-step-after-multi-column" } }
          - { x: 0,  y: 8,  width: 8,  height: 7, content: { $ref: "#/spec/panels/ts-linear-connect-nulls" } }
          - { x: 8,  y: 8,  width: 8,  height: 7, content: { $ref: "#/spec/panels/ts-natural" } }
          - { x: 16, y: 8,  width: 8,  height: 7, content: { $ref: "#/spec/panels/ts-step-before" } }
          - { x: 0,  y: 15, width: 8,  height: 5, content: { $ref: "#/spec/panels/stat-last" } }
          - { x: 8,  y: 15, width: 8,  height: 5, content: { $ref: "#/spec/panels/stat-first" } }
          - { x: 16, y: 15, width: 8,  height: 5, content: { $ref: "#/spec/panels/stat-mean" } }
          - { x: 0,  y: 20, width: 8,  height: 5, content: { $ref: "#/spec/panels/stat-min" } }
          - { x: 8,  y: 20, width: 8,  height: 5, content: { $ref: "#/spec/panels/stat-max-percent-thresholds" } }
          - { x: 16, y: 20, width: 8,  height: 5, content: { $ref: "#/spec/panels/stat-sum-background" } }
          - { x: 0,  y: 25, width: 8,  height: 5, content: { $ref: "#/spec/panels/stat-count-show-label" } }
          - { x: 8,  y: 25, width: 8,  height: 5, content: { $ref: "#/spec/panels/stat-range" } }
          - { x: 16, y: 25, width: 8,  height: 5, content: { $ref: "#/spec/panels/stat-diff" } }
          - { x: 0,  y: 30, width: 12, height: 6, content: { $ref: "#/spec/panels/stat-multi-query-no-value" } }
          - { x: 12, y: 30, width: 12, height: 6, content: { $ref: "#/spec/panels/stat-row-order-sparkline" } }
          - { x: 0,  y: 36, width: 24, height: 10, content: { $ref: "#/spec/panels/table-sticky" } }
          - { x: 0,  y: 46, width: 24, height: 8, content: { $ref: "#/spec/panels/table-multi-query" } }

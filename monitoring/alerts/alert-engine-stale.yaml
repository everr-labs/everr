kind: AlertRule
metadata:
  name: alert-engine-stale
  labels:
    team: platform
spec:
  display:
    name: Alert engine stale
    description: The alert event projection has not produced alert-service logs recently.
  notificationMessage:
    title: "${ServiceName} alert engine telemetry is stale"
    description: "No alert-service events in the last 10 minutes. Last event in the 1-hour lookback: ${last_seen}"
  evaluationInterval: 1m
  instanceLabels: [ServiceName]
  query: |
    SELECT
      'alert' AS ServiceName,
      countIf(TimestampTime >= now() - INTERVAL 10 MINUTE) AS recent_events,
      max(TimestampTime) AS last_seen
    FROM logs
    WHERE TimestampTime >= now() - INTERVAL 1 HOUR
      AND ServiceName = 'alert'
    HAVING recent_events = 0

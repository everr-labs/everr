kind: Dashboard
metadata:
  name: web-http-overview
  project: demo
spec:
  display:
    name: Web HTTP Overview
    description: HTTP traffic for the everr-web-node service — request rate, latency, and top routes.
  duration: 7d
  refreshInterval: 1m
  variables:
    - kind: ListVariable
      spec:
        name: method
        display: { name: HTTP Method }
        allowMultiple: true
        allowAllValue: true
        defaultValue: "__all"
        sort: alphabetical-asc
        plugin:
          kind: ClickHouseSQLVariable
          spec:
            query: |
              SELECT DISTINCT SpanAttributes['http.method'] AS method
              FROM traces
              WHERE ServiceName = 'everr-web-node'
                AND SpanKind = 'Server'
                AND SpanAttributes['http.method'] != ''
              ORDER BY method
  panels:
    request-rate:
      kind: Panel
      spec:
        display: { name: Request rate by method }
        plugin:
          kind: TimeSeriesChart
          spec: { unit: req, showLegend: true, lineWidth: 1.5, curveType: monotone }
        queries:
          - kind: ClickHouseSQL
            spec:
              plugin:
                kind: ClickHouseSQL
                spec:
                  query: |
                    SELECT toStartOfInterval(Timestamp, INTERVAL {step:UInt32} SECOND) AS ts,
                           SpanAttributes['http.method'] AS method,
                           count() AS requests
                    FROM traces
                    WHERE Timestamp >= {from:String} AND Timestamp <= {to:String}
                      AND ServiceName = 'everr-web-node'
                      AND SpanKind = 'Server'
                      AND SpanAttributes['http.method'] IN $method
                    GROUP BY ts, method
                    ORDER BY ts, method
    latency-percentiles:
      kind: Panel
      spec:
        display: { name: Server latency p50/p95/p99 (ms) }
        plugin:
          kind: TimeSeriesChart
          spec: { unit: ms, showLegend: true, lineWidth: 1.5, curveType: monotone }
        queries:
          - kind: ClickHouseSQL
            spec:
              plugin:
                kind: ClickHouseSQL
                spec:
                  query: |
                    SELECT toStartOfInterval(Timestamp, INTERVAL {step:UInt32} SECOND) AS ts,
                           quantile(0.50)(Duration) / 1e6 AS p50_ms,
                           quantile(0.95)(Duration) / 1e6 AS p95_ms,
                           quantile(0.99)(Duration) / 1e6 AS p99_ms
                    FROM traces
                    WHERE Timestamp >= {from:String} AND Timestamp <= {to:String}
                      AND ServiceName = 'everr-web-node'
                      AND SpanKind = 'Server'
                      AND SpanAttributes['http.method'] IN $method
                    GROUP BY ts
                    ORDER BY ts
    total-requests:
      kind: Panel
      spec:
        display: { name: Total requests }
        plugin:
          kind: StatChart
          spec:
            calculation: sum
            unit: req
            sparkline: true
        queries:
          - kind: ClickHouseSQL
            spec:
              plugin:
                kind: ClickHouseSQL
                spec:
                  query: |
                    SELECT toStartOfInterval(Timestamp, INTERVAL {step:UInt32} SECOND) AS ts,
                           count() AS requests
                    FROM traces
                    WHERE Timestamp >= {from:String} AND Timestamp <= {to:String}
                      AND ServiceName = 'everr-web-node'
                      AND SpanKind = 'Server'
                      AND SpanAttributes['http.method'] IN $method
                    GROUP BY ts
                    ORDER BY ts
    top-routes:
      kind: Panel
      spec:
        display: { name: Top routes by p95 latency }
        plugin:
          kind: Table
          spec: { stickyHeader: true }
        queries:
          - kind: ClickHouseSQL
            spec:
              plugin:
                kind: ClickHouseSQL
                spec:
                  query: |
                    SELECT SpanAttributes['http.route'] AS route,
                           count() AS requests,
                           round(quantile(0.95)(Duration) / 1e6, 1) AS p95_ms,
                           countIf(StatusCode = 'Error') AS errors
                    FROM traces
                    WHERE Timestamp >= {from:String} AND Timestamp <= {to:String}
                      AND ServiceName = 'everr-web-node'
                      AND SpanKind = 'Server'
                      AND SpanAttributes['http.method'] IN $method
                      AND SpanAttributes['http.route'] != ''
                    GROUP BY route
                    ORDER BY p95_ms DESC
                    LIMIT 15
  layouts:
    - kind: Grid
      spec:
        items:
          - { x: 0,  y: 0,  width: 16, height: 8,  content: { $ref: "#/spec/panels/request-rate" } }
          - { x: 16, y: 0,  width: 8,  height: 8,  content: { $ref: "#/spec/panels/total-requests" } }
          - { x: 0,  y: 8,  width: 24, height: 8,  content: { $ref: "#/spec/panels/latency-percentiles" } }
          - { x: 0,  y: 16, width: 24, height: 10, content: { $ref: "#/spec/panels/top-routes" } }

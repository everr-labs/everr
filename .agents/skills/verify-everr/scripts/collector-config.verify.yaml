# verify-everr: verification-only collector config, mounted by compose.verify.yaml.
# It is collector/config.example.yml minus the githubactions receiver and the three internal
# pipelines that read it (they trust the x-everr-tenant-id header), so it needs no GitHub App
# webhook secret or .pem. Everything on the public OTLP path is kept as in the example: the
# everr_apikey extension (verifies the Bearer key against the app's /api/internal/verify-key with
# INGEST_VERIFY_SHARED_SECRET), the strip/stamp tenant and retention processors, usage metering,
# and the ClickHouse exporter into the otel.* landing tables.
# The container runs with host networking, so every endpoint is a per-run loopback port that
# web-launch writes into compose.env. Keep in sync with config.example.yml when the public
# pipelines change. Two settings the collector refuses to start without:
# file_storage fsync: true, and block_on_overflow: true on clickhouse/usage.
extensions:
  file_storage/ingestion:
    directory: /var/lib/everr/queue
    create_directory: true
    fsync: true
  everr_usage:
    max_series: 30000
  everr_apikey:
    endpoint: http://127.0.0.1:${env:VERIFY_WEB_PORT}/api/internal/verify-key
    shared_secret: ${env:INGEST_VERIFY_SHARED_SECRET}
connectors:
  everr_usage_connector:
    interval: 60s
    timeout: 10s
receivers:
  otlp/public:
    protocols:
      http:
        endpoint: 127.0.0.1:${env:VERIFY_OTLP_HTTP_PORT}
        auth: {authenticator: everr_apikey}
      grpc:
        endpoint: 127.0.0.1:${env:VERIFY_OTLP_GRPC_PORT}
        auth: {authenticator: everr_apikey}
processors:
  everr_usage: {}
  delta_to_cumulative/usage: {max_stale: 5m, max_streams: 60000}
  filter/reserved_everr:
    error_mode: propagate
    metric_conditions: ['IsMatch(metric.name, "^everr[.]")']
  attributes/strip_user_tenant:
    actions:
      - {action: delete, key: everr.tenant.id}
      - {action: delete, key: everr.retention.days}
  resource/public_tenant:
    attributes: [{action: upsert, key: everr.tenant.id, from_context: auth.tenant_id}]
  resource/public_retention_traces:
    attributes: [{action: upsert, key: everr.retention.days, from_context: auth.retention_traces_days}]
  resource/public_retention_logs:
    attributes: [{action: upsert, key: everr.retention.days, from_context: auth.retention_logs_days}]
  resource/public_retention_metrics:
    attributes: [{action: upsert, key: everr.retention.days, from_context: auth.retention_metrics_days}]
exporters:
  clickhouse:
    endpoint: http://127.0.0.1:${env:VERIFY_CH_PORT}
    username: collector_rw
    password: collector-dev
    database: otel
    create_schema: false
    connection_params: {wait_for_async_insert: "1", materialized_views_ignore_errors: "0"}
    json: true
    sending_queue:
      enabled: true
      storage: file_storage/ingestion
      wait_for_result: false
      queue_size: 10000
      num_consumers: 10
      batch: {min_size: 8192, flush_timeout: 1s}
    retry_on_failure: {enabled: true, max_elapsed_time: 0s}
  clickhouse/usage:
    endpoint: http://127.0.0.1:${env:VERIFY_CH_PORT}
    username: collector_rw
    password: collector-dev
    database: otel
    create_schema: false
    connection_params: {wait_for_async_insert: "1", materialized_views_ignore_errors: "0"}
    json: true
    sending_queue:
      enabled: true
      storage: file_storage/ingestion
      wait_for_result: false
      block_on_overflow: true
      queue_size: 10000
      num_consumers: 10
      batch: {min_size: 8192, flush_timeout: 1s}
    retry_on_failure: {enabled: true, max_elapsed_time: 0s}
service:
  # Self-metrics would bind :8888 on the host network; nothing here reads them.
  telemetry:
    metrics: {level: none}
  extensions: [everr_apikey, everr_usage, file_storage/ingestion]
  pipelines:
    metrics/usage:
      receivers: [everr_usage_connector]
      processors: [delta_to_cumulative/usage]
      exporters: [clickhouse/usage]
    traces/public:
      receivers: [otlp/public]
      processors: [attributes/strip_user_tenant, resource/public_tenant, resource/public_retention_traces, everr_usage]
      exporters: [clickhouse, everr_usage_connector]
    metrics/public:
      receivers: [otlp/public]
      processors: [filter/reserved_everr, attributes/strip_user_tenant, resource/public_tenant, resource/public_retention_metrics, everr_usage]
      exporters: [clickhouse, everr_usage_connector]
    logs/public:
      receivers: [otlp/public]
      processors: [attributes/strip_user_tenant, resource/public_tenant, resource/public_retention_logs, everr_usage]
      exporters: [clickhouse, everr_usage_connector]

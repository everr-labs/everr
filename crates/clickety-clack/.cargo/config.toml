# The API role fails closed without CC_API_KEYS (see src/api/auth.rs); this is the dev
# opt-in that keeps `cargo run` / `cargo test` zero-config. It only reaches cargo-launched
# processes, so the shipped image (ENTRYPOINT ["cc"]) still fails closed. Set CC_API_KEYS
# to override.
[env]
CC_DEV_INSECURE_NO_AUTH = "1"

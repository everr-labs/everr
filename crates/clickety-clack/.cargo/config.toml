# Dev opt-ins that keep `cargo run` / `cargo test` zero-config. They only reach
# cargo-launched processes, so the shipped image (ENTRYPOINT ["cc"]) still fails closed
# on both.
#
# - The API role fails closed without CC_API_KEYS (see src/api/auth.rs); set CC_API_KEYS
#   to require bearer auth instead.
# - The api/evaluator roles fail closed when tenant rule SQL would run as ClickHouse's
#   `default` user in `shared` auth mode (see Config::unhardened_ch_user), which is
#   exactly the local-dev default (CC_CH_URL http://127.0.0.1:8123, user `default`).
[env]
CC_DEV_INSECURE_NO_AUTH = "1"
CC_DEV_INSECURE_CH_DEFAULT_USER = "1"

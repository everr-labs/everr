kind: Notebook
metadata:
  name: even-minute-firing
  # no project -> "default", matching the even-minute-firing alert
spec:
  display:
    name: Even minute firing test — runbook
    description: Runbook for testing alert notebook links in notifications and the alerts UI.
  duration: 1h
  refreshInterval: 1m
  panels:
    current-state:
      kind: Panel
      spec:
        display:
          name: Current synthetic state
          description: Shows whether the alert query should currently return a firing instance.
        plugin:
          kind: Table
          spec:
            stickyHeader: true
        queries:
          - kind: ClickHouseSQL
            spec:
              plugin:
                kind: ClickHouseSQL
                spec:
                  query: |
                    SELECT
                      now() AS evaluated_at,
                      toMinute(now()) AS minute,
                      if(toMinute(now()) % 2 = 0, 'firing', 'resolved') AS expected_state,
                      toString(toStartOfMinute(now())) AS instance_id
    alert-status:
      kind: Panel
      spec:
        display:
          name: Alert service status
          description: Recent alert service events for this alert, projected into logs.
        plugin:
          kind: Table
          spec:
            stickyHeader: true
        queries:
          - kind: ClickHouseSQL
            spec:
              plugin:
                kind: ClickHouseSQL
                spec:
                  query: |
                    SELECT
                      TimestampTime AS event_time,
                      LogAttributes['alert.event_type'] AS event_type,
                      LogAttributes['alert.row_count'] AS row_count,
                      LogAttributes['alert.silenced'] AS silenced,
                      LogAttributes['alert.delivery_targets'] AS delivery_targets,
                      LogAttributes['alert.instance_labels'] AS instance_labels
                    FROM logs
                    WHERE Timestamp >= {from:String} AND Timestamp <= {to:String}
                      AND ServiceName = 'alert'
                      AND LogAttributes['alert.slug'] = 'even-minute-firing'
                    ORDER BY event_time DESC
                    LIMIT 50
  markdown:
    inline: |
      # Even minute firing test — runbook

      This runbook is attached to the **even-minute-firing** synthetic alert. It
      exists to test the alerts UI and notification notebook links.

      The alert evaluates every minute:

      - **Even minute**: the query returns one row and the alert fires.
      - **Odd minute**: the query returns no rows and the alert resolves.
      - The firing instance id is `toStartOfMinute(now())`, so each even-minute
        firing uses a different `instance_id`.

      ```panel
      ref: current-state
      ```

      ## Alert service status

      This panel reads the alert service's projected logs for
      **even-minute-firing**. Use it to verify the UI and notification test
      generated the expected `firing` and `resolved` events, and to inspect
      delivery/silence metadata.

      ```panel
      ref: alert-status
      ```

      ## Test checklist

      1. Wait for the next even minute and confirm the alert fires.
      2. Confirm Slack and Telegram notifications include a notebook link.
      3. Open the alert detail page and confirm the Notebook row links here.
      4. Wait for the next odd minute and confirm the alert resolves.

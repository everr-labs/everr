kind: Runbook
metadata:
  name: alert-clock-restarts
spec:
  display:
    name: Alert for-clock restarts, runbook
    description: >-
      Triage steps for the alert-clock-restarts alert (the engine keeps
      discarding pending progress because evaluations arrive too late).
  duration: 6h
  refreshInterval: 1m
  panels:
    restarts-over-time:
      kind: Panel
      spec:
        display:
          name: Clock restarts over time
          description: >-
            How often the engine threw away a pending instance's for progress,
            by rule. A flat line at zero with one spike is a worker restart. A
            line that never returns to zero is a cadence the engine cannot
            keep.
        plugin:
          kind: TimeSeriesChart
          spec:
            showLegend: true
            lineWidth: 1.5
            curveType: monotone
        queries:
          - kind: ClickHouseSQL
            spec:
              plugin:
                kind: ClickHouseSQL
                spec:
                  query: |
                    SELECT
                      toStartOfInterval(Timestamp, INTERVAL {step:UInt32} SECOND) AS ts,
                      LogAttributes['everr.alert.rule'] AS rule,
                      count() AS restarts
                    FROM logs
                    WHERE Timestamp >= {from:String} AND Timestamp <= {to:String}
                      AND Body = 'alerts.evaluate.for_clock_restarted'
                    GROUP BY ts, rule
                    ORDER BY ts
    affected-rules:
      kind: Panel
      spec:
        display:
          name: Affected rules
          description: >-
            One row per rule. Compare the worst gap against the interval: the
            engine restarts the clock past two intervals. A rule whose for
            clause is shorter than the worst gap can still fire between
            restarts; one whose for clause is longer cannot fire at all.
        plugin:
          kind: Table
          spec:
            stickyHeader: true
        queries:
          - kind: ClickHouseSQL
            spec:
              plugin:
                kind: ClickHouseSQL
                spec:
                  query: |
                    SELECT
                      LogAttributes['everr.alert.rule'] AS rule,
                      count() AS restarts,
                      sum(toUInt32OrZero(LogAttributes['everr.alert.restarted_instances'])) AS instances,
                      max(toUInt64OrZero(LogAttributes['everr.alert.unobserved_gap_ms'])) AS worst_gap_ms,
                      max(toUInt32OrZero(LogAttributes['everr.alert.interval_secs'])) AS interval_secs,
                      max(toUInt32OrZero(LogAttributes['everr.alert.for_secs'])) AS for_secs,
                      formatDateTime(max(Timestamp), '%m-%d %H:%i:%S') AS last_seen
                    FROM logs
                    WHERE Timestamp >= {from:String} AND Timestamp <= {to:String}
                      AND Body = 'alerts.evaluate.for_clock_restarted'
                    GROUP BY rule
                    ORDER BY restarts DESC
                    LIMIT 50
    evaluation-failures:
      kind: Panel
      spec:
        display:
          name: Evaluation failures
          description: >-
            A failed evaluation observes nothing, so a run of them opens the
            same unwatched stretch a late one does. When this tracks the
            restarts, the query is the cause and the scheduler is innocent.
        plugin:
          kind: TimeSeriesChart
          spec:
            showLegend: false
            lineWidth: 1.5
            curveType: monotone
        queries:
          - kind: ClickHouseSQL
            spec:
              plugin:
                kind: ClickHouseSQL
                spec:
                  query: |
                    SELECT
                      toStartOfInterval(Timestamp, INTERVAL {step:UInt32} SECOND) AS ts,
                      count() AS failures
                    FROM logs
                    WHERE Timestamp >= {from:String} AND Timestamp <= {to:String}
                      AND Body = 'alerts.evaluate.query_failed'
                    GROUP BY ts
                    ORDER BY ts
  markdown:
    file: ./alert-clock-restarts.runbook.md

kind: AlertRule
metadata:
  name: app-server-error-rate
spec:
  runbook: app-server-error-rate
  display:
    name: App server error rate
    description: App server spans with an elevated error rate over the last 15 minutes.
  notificationMessage:
    title: "${ServiceName} server error rate is ${error_pct}%"
    description: "${errors} errors out of ${total} server spans in the last 15 minutes"
  evaluationInterval: 1m
  instanceLabels: [ServiceName]
  query: |
    SELECT
      ServiceName,
      count() AS total,
      countIf(StatusCode = 'Error') AS errors,
      round(errors / total * 100, 2) AS error_pct
    FROM traces
    WHERE Timestamp >= now() - INTERVAL 15 MINUTE
      AND ServiceName IN ('everr-dev-app', 'everr-app')
      AND SpanKind = 'Server'
    GROUP BY ServiceName
    HAVING total >= 100
      AND error_pct > 1
    ORDER BY error_pct DESC
    LIMIT 10

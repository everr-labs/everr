kind: Dashboard
metadata:
  name: demo-heatmap
  project: demo
spec:
  display:
    name: Heatmap
    description: >-
      Heatmap regression sheet — every option (yColumn/valueColumn selection,
      unit, showValues, showLegend, all six colorScheme values, all scaleType
      values, min/max domain, cellGap) and behavior (spec defaults, numeric
      bucket ordering, multi-query summing, empty, no time column) exercised
      with deterministic TestData.
  duration: 7d
  refreshInterval: 1m
  panels:
    # ── Formats and options ──────────────────────────────────────────
    hm-defaults:
      kind: Panel
      spec:
        display:
          name: "Heatmap: spec defaults"
          description: "Empty spec {} — long format (ts, bucket, value) · colorScheme: spectral · scaleType: linear · showLegend: true · showValues: false · cellGap: 1"
        plugin:
          kind: Heatmap
          spec: {}
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: random_walk
                  seed: 110
                  labelColumn: route
                  series:
                    - { name: /checkout, start: 60, noise: 20, min: 0 }
                    - { name: /search,   start: 40, noise: 15, min: 0 }
                    - { name: /api,      start: 80, noise: 25, min: 0 }
                    - { name: /static,   start: 20, noise: 10, min: 0 }
    hm-values-unit:
      kind: Panel
      spec:
        display:
          name: "Heatmap: values in cells"
          description: "showValues: true · unit: req · colorScheme: greens — value text inside cells wide enough to fit it, text contrast follows cell luminance; sparse rows leave gaps"
        plugin:
          kind: Heatmap
          spec:
            showValues: true
            unit: req
            colorScheme: greens
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: table
                  seed: 111
                  rows: 12
                  columns:
                    - { name: ts, time: true }
                    - { name: service, values: [api, db, worker] }
                    - { name: requests, walk: { start: 50, noise: 35, min: 0, round: 0 } }
    hm-sqrt:
      kind: Panel
      spec:
        display:
          name: "Heatmap: sqrt scale"
          description: "scaleType: sqrt · colorScheme: oranges — lifts the low end of the ramp"
        plugin:
          kind: Heatmap
          spec:
            scaleType: sqrt
            colorScheme: oranges
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: random_walk
                  seed: 112
                  labelColumn: queue
                  series:
                    - { name: ingest,  start: 90, noise: 40, min: 0 }
                    - { name: exports, start: 15, noise: 10, min: 0 }
                    - { name: emails,  start: 40, noise: 20, min: 0 }
    hm-log:
      kind: Panel
      spec:
        display:
          name: "Heatmap: log scale, skewed data"
          description: "scaleType: log · colorScheme: reds — one dominant bucket; log keeps the sparse cells visible"
        plugin:
          kind: Heatmap
          spec:
            scaleType: log
            colorScheme: reds
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: random_walk
                  seed: 113
                  labelColumn: status
                  series:
                    - { name: "2xx", start: 5000, noise: 800, min: 1 }
                    - { name: "4xx", start: 60,   noise: 25,  min: 1 }
                    - { name: "5xx", start: 8,    noise: 5,   min: 1 }
    hm-columns:
      kind: Panel
      spec:
        display:
          name: "Heatmap: explicit columns"
          description: "yColumn: service · valueColumn: requests · colorScheme: blues — overrides the column-order defaults (the decoy numeric `errors` column is ignored)"
        plugin:
          kind: Heatmap
          spec:
            yColumn: service
            valueColumn: requests
            colorScheme: blues
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: table
                  seed: 114
                  rows: 60
                  columns:
                    - { name: ts, time: true }
                    - { name: errors, walk: { start: 5, noise: 3, min: 0 } }
                    - { name: service, values: [api, db, worker] }
                    - { name: requests, walk: { start: 50, noise: 25, min: 0 } }
    hm-numeric-buckets:
      kind: Panel
      spec:
        display:
          name: "Heatmap: numeric buckets"
          description: "colorScheme: greenYellowRed · all-numeric bucket labels (latency bounds) sort like a y-axis, largest at the top"
        plugin:
          kind: Heatmap
          spec:
            unit: ms
            colorScheme: greenYellowRed
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: random_walk
                  seed: 115
                  labelColumn: bucket
                  series:
                    - { name: "50",   start: 80, noise: 30, min: 0 }
                    - { name: "500",  start: 10, noise: 8,  min: 0 }
                    - { name: "100",  start: 50, noise: 20, min: 0 }
                    - { name: "250",  start: 25, noise: 12, min: 0 }
    hm-domain:
      kind: Panel
      spec:
        display:
          name: "Heatmap: fixed domain, no gaps"
          description: "min: 0 · max: 100 · cellGap: 0 — colors anchored to a fixed ceiling, cells touch"
        plugin:
          kind: Heatmap
          spec:
            min: 0
            max: 100
            cellGap: 0
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: random_walk
                  seed: 116
                  labelColumn: node
                  series:
                    - { name: node-1, start: 70, noise: 20, min: 0, max: 100 }
                    - { name: node-2, start: 35, noise: 25, min: 0, max: 100 }
                    - { name: node-3, start: 55, noise: 15, min: 0, max: 100 }
    hm-gap-no-legend:
      kind: Panel
      spec:
        display:
          name: "Heatmap: wide gaps, no legend"
          description: "cellGap: 4 · showLegend: false — spaced cells, no ramp legend row"
        plugin:
          kind: Heatmap
          spec:
            cellGap: 4
            showLegend: false
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: random_walk
                  seed: 117
                  labelColumn: region
                  series:
                    - { name: us-east, start: 60, noise: 20, min: 0 }
                    - { name: eu-west, start: 40, noise: 15, min: 0 }
    # ── Data-shape behaviors ─────────────────────────────────────────
    hm-multi-query:
      kind: Panel
      spec:
        display:
          name: "Heatmap: multi-query summing"
          description: "Two queries on one panel — rows landing on the same (time, bucket) cell sum, buckets share one grid and color domain"
        plugin:
          kind: Heatmap
          spec: {}
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: random_walk
                  seed: 118
                  labelColumn: source
                  series:
                    - { name: web, start: 50, noise: 20, min: 0 }
                    - { name: ios, start: 30, noise: 15, min: 0 }
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: random_walk
                  seed: 119
                  labelColumn: source
                  series:
                    - { name: web,     start: 40, noise: 20, min: 0 }
                    - { name: android, start: 20, noise: 10, min: 0 }
    hm-empty:
      kind: Panel
      spec:
        display:
          name: "Heatmap: empty result"
          description: "Single query returns no rows → 'No heatmap data in this time range'"
        plugin:
          kind: Heatmap
          spec: {}
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: csv
                  columns: [ts, bucket, count]
                  rows: []
    hm-no-time:
      kind: Panel
      spec:
        display:
          name: "Heatmap: no time column"
          description: "Result without a ts/time/timestamp column can't be placed on the grid → empty state"
        plugin:
          kind: Heatmap
          spec: {}
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: csv
                  columns: [bucket, count]
                  rows:
                    - ["<10ms", 12]
                    - ["<100ms", 48]
  layouts:
    - kind: Grid
      spec:
        items:
          - { x: 0,  y: 0,  width: 12, height: 6, content: { $ref: "#/spec/panels/hm-defaults" } }
          - { x: 12, y: 0,  width: 12, height: 6, content: { $ref: "#/spec/panels/hm-values-unit" } }
          - { x: 0,  y: 6,  width: 12, height: 6, content: { $ref: "#/spec/panels/hm-sqrt" } }
          - { x: 12, y: 6,  width: 12, height: 6, content: { $ref: "#/spec/panels/hm-log" } }
          - { x: 0,  y: 12, width: 12, height: 6, content: { $ref: "#/spec/panels/hm-columns" } }
          - { x: 12, y: 12, width: 12, height: 6, content: { $ref: "#/spec/panels/hm-numeric-buckets" } }
          - { x: 0,  y: 18, width: 12, height: 6, content: { $ref: "#/spec/panels/hm-domain" } }
          - { x: 12, y: 18, width: 12, height: 6, content: { $ref: "#/spec/panels/hm-gap-no-legend" } }
          - { x: 0,  y: 24, width: 8,  height: 5, content: { $ref: "#/spec/panels/hm-multi-query" } }
          - { x: 8,  y: 24, width: 8,  height: 5, content: { $ref: "#/spec/panels/hm-empty" } }
          - { x: 16, y: 24, width: 8,  height: 5, content: { $ref: "#/spec/panels/hm-no-time" } }

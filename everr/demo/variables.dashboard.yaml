kind: Dashboard
metadata:
  name: variables
  project: demo
spec:
  display:
    name: Variables
    description: >-
      Variable toolbar regression sheet: ten variables at once, mixing
      single/multi selects, allow-all, hidden, text inputs, and a live
      ClickHouse-backed list, to check how the toolbar wraps and aligns.
  duration: 7d
  refreshInterval: 1m
  variables:
    - kind: ListVariable
      spec:
        name: service
        display: { name: Service }
        allowMultiple: true
        allowAllValue: true
        plugin:
          kind: ClickHouseSQLVariable
          spec:
            query: SELECT DISTINCT ServiceName FROM traces ORDER BY ServiceName
    - kind: ListVariable
      spec:
        name: status
        display: { name: Status }
        allowMultiple: true
        defaultValue: [Ok, Error]
        plugin:
          kind: StaticListVariable
          spec:
            values: [Ok, Error, Unset]
    - kind: ListVariable
      spec:
        name: region
        display: { name: Region }
        allowAllValue: true
        plugin:
          kind: StaticListVariable
          spec:
            values: [eu-west-1, eu-central-1, us-east-1, us-west-2, ap-south-1]
    - kind: ListVariable
      spec:
        name: environment
        display: { name: Environment }
        defaultValue: production
        plugin:
          kind: StaticListVariable
          spec:
            values: [production, staging, development]
    - kind: ListVariable
      spec:
        name: endpoint
        display: { name: Endpoint }
        allowMultiple: true
        allowAllValue: true
        plugin:
          kind: StaticListVariable
          spec:
            values:
              - /api/users/{id}/preferences
              - /api/orders/{id}/line-items
              - /api/checkout/session
              - /api/search
              - /healthz
    - kind: ListVariable
      spec:
        name: method
        display: { name: Method }
        allowMultiple: true
        defaultValue: [GET, POST]
        plugin:
          kind: StaticListVariable
          spec:
            values: [GET, POST, PUT, PATCH, DELETE]
    - kind: ListVariable
      spec:
        name: tier
        display: { name: Tier }
        sort: alphabetical-asc
        plugin:
          kind: StaticListVariable
          spec:
            values: [free, pro, enterprise]
    - kind: TextVariable
      spec:
        name: threshold_ms
        display: { name: Threshold (ms) }
        value: "250"
    - kind: TextVariable
      spec:
        name: message_filter
        display: { name: Message filter }
        value: ""
    - kind: ListVariable
      spec:
        name: percentile
        display: { name: Percentile }
        defaultValue: p95
        plugin:
          kind: StaticListVariable
          spec:
            values: [p50, p75, p90, p95, p99]
  panels:
    walk:
      kind: Panel
      spec:
        display:
          name: Random walk
          description: TestData filler so the toolbar sits above a real grid.
        plugin:
          kind: TimeSeriesChart
          spec:
            unit: ""
            showLegend: true
            lineWidth: 1.5
            curveType: monotone
            connectNulls: false
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: random_walk
                  seed: 3
                  labelColumn: status
                  series:
                    - { name: Ok,    start: 900, noise: 70, min: 0 }
                    - { name: Error, start: 30,  noise: 10, min: 0 }
    latency:
      kind: Panel
      spec:
        display:
          name: Latency
        plugin:
          kind: TimeSeriesChart
          spec:
            unit: ms
            showLegend: true
            lineWidth: 2
            curveType: stepAfter
            connectNulls: false
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: random_walk
                  seed: 9
                  series:
                    - { name: p50_ms, start: 45,  noise: 6,  min: 0 }
                    - { name: p95_ms, start: 140, noise: 15, min: 0 }
  layouts:
    - kind: Grid
      spec:
        items:
          - x: 0
            y: 0
            width: 12
            height: 8
            content: { $ref: "#/spec/panels/walk" }
          - x: 12
            y: 0
            width: 12
            height: 8
            content: { $ref: "#/spec/panels/latency" }

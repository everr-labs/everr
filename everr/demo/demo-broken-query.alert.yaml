kind: AlertRule
metadata:
  name: demo-broken-query
  project: demo
spec:
  runbook: demo-alerts
  display:
    name: Connection pool (demo)
    description: >-
      A synthetic connection-pool utilization that stays below the threshold.
      Exercises a healthy, non-firing instance with values that vary over time.
  evaluationInterval: 1m
  notificationMessage:
    title: "Demo alert: connection pool utilization high"
    description: "${scope} reached ${value}% pool utilization."
  instanceLabels: [scope]
  condition:
    operator: gte
    threshold: 95
  query: |
    WITH
      toUnixTimestamp(now()) AS t,
      intDiv(t, 60) AS minute
    SELECT
      'orders-db' AS scope,
      round(
        45
          + 25 * (0.5 - 0.5 * cos(t / 900. * 2 * pi()))
          + 12 * ((cityHash64(minute, 'pool') % 1000) / 1000. - 0.5),
        1
      ) AS value

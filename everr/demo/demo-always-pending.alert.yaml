kind: AlertRule
metadata:
  name: demo-always-pending
  project: demo
spec:
  runbook: demo-alerts
  display:
    name: Always pending (demo)
    description: >-
      Permanently pending rule for exercising the pending state in the
      alerting UI. The condition holds for four minutes out of every five,
      but `for` demands ten continuous minutes: the one-minute gap resets the
      `for` clock every cycle (and stays under `resolveAfter`, so the
      instance is never dropped back to inactive). It can neither fire nor
      leave pending.
  evaluationInterval: 1m
  # Longer than the condition can ever continuously hold (4m), so the fire
  # threshold is unreachable by construction.
  for: 10m
  # The 1-minute gap is one evaluation, occasionally two as the tick drifts;
  # 3 keeps the pending instance held through it rather than dropped.
  resolveAfter: 3
  notificationMessage:
    title: "Demo alert: always-pending fired"
    description: >-
      This rule is constructed never to fire. If this notification arrived,
      the `for` clock did not reset across an absent gap: file a bug against
      the engine's state machine.
  instanceLabels: [phase]
  condition:
    operator: eq
    threshold: 1
  query: |
    SELECT
      'limbo' AS phase,
      toUInt8(intDiv(toUnixTimestamp(now()), 60) % 5 != 0) AS value

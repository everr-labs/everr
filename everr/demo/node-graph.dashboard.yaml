kind: Dashboard
metadata:
  name: graph
  project: demo
spec:
  display:
    name: NodeGraph
    description: >-
      NodeGraph regression sheet — default and custom source/target/value
      columns, column fallback, unit, directed off, showValues edge labels,
      weightless edge lists, bidirectional edge pairs, duplicate-edge and
      multi-query summing, dropped rows (nulls + self-loops), maxNodes
      trimming, and the empty state, driven by the deterministic csv
      TestData scenario.
  timeRange:
    from: now-7d
    to: now
  refreshInterval: 1m
  panels:
    node-graph-defaults:
      kind: Panel
      spec:
        display:
          name: "NodeGraph: defaults"
          description: "default source/target/value columns · directed arrows · node size = total weight"
        plugin:
          kind: NodeGraph
          spec: {}
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: csv
                  columns: [source, target, value]
                  rows:
                    - [web, api, 420]
                    - [web, auth, 90]
                    - [api, db, 310]
                    - [api, cache, 260]
                    - [api, auth, 70]
                    - [auth, db, 60]
                    - [worker, db, 120]
                    - [worker, queue, 200]
                    - [api, queue, 80]
    node-graph-columns-unit:
      kind: Panel
      spec:
        display:
          name: "NodeGraph: custom columns + unit"
          description: "sourceColumn: caller · targetColumn: callee · valueColumn: calls · unit: {request}"
        plugin:
          kind: NodeGraph
          spec:
            sourceColumn: caller
            targetColumn: callee
            valueColumn: calls
            valueFormat:
              unit: "{request}"
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: csv
                  columns: [caller, callee, calls]
                  rows:
                    - [frontend, checkout, 1200]
                    - [frontend, search, 800]
                    - [checkout, payments, 950]
                    - [checkout, inventory, 400]
                    - [search, inventory, 300]
    node-graph-fallback:
      kind: Panel
      spec:
        display:
          name: "NodeGraph: column fallback"
          description: "no source/target/value columns → first two columns + first numeric column"
        plugin:
          kind: NodeGraph
          spec: {}
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: csv
                  columns: [from, to, note, n]
                  rows:
                    - [a, b, x, 5]
                    - [b, c, y, 3]
                    - [a, c, z, 2]
    node-graph-undirected:
      kind: Panel
      spec:
        display:
          name: "NodeGraph: undirected"
          description: "directed: false → no arrowheads"
        plugin:
          kind: NodeGraph
          spec: { directed: false }
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: csv
                  columns: [source, target, value]
                  rows:
                    - [eu-west, us-east, 40]
                    - [eu-west, ap-south, 25]
                    - [us-east, ap-south, 15]
    node-graph-showvalues:
      kind: Panel
      spec:
        display:
          name: "NodeGraph: edge values"
          description: "showValues: true → value label at each edge midpoint · unit: ms"
        plugin:
          kind: NodeGraph
          spec: { showValues: true, valueFormat: { unit: ms } }
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: csv
                  columns: [source, target, value]
                  rows:
                    - [gateway, orders, 12]
                    - [gateway, users, 8]
                    - [orders, postgres, 4]
                    - [users, postgres, 3]
    node-graph-weightless:
      kind: Panel
      spec:
        display:
          name: "NodeGraph: no weight column"
          description: "two-column edge list → every edge weighs 1, repeats sum (a→b twice)"
        plugin:
          kind: NodeGraph
          spec: {}
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: csv
                  columns: [source, target]
                  rows:
                    - [a, b]
                    - [a, b]
                    - [b, c]
                    - [c, d]
    node-graph-top-to-bottom:
      kind: Panel
      spec:
        display:
          name: "NodeGraph: top to bottom"
          description: "direction: TB → callers on top, the services they call below"
        plugin:
          kind: NodeGraph
          spec: { direction: TB }
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: csv
                  columns: [source, target, value]
                  rows:
                    - [web, api, 420]
                    - [api, db, 310]
                    - [api, cache, 260]
                    - [worker, db, 120]
    node-graph-health:
      kind: Panel
      spec:
        display:
          name: "NodeGraph: health"
          description: "stats: errors (reduce: rate, thresholds: [0.01, 0.05]) and p90_ms (mean, no thresholds) · linkToTraces"
        plugin:
          kind: NodeGraph
          spec:
            valueFormat: { unit: "{request}" }
            stats:
              - column: errors
                reduce: rate
                format: { unit: "1", display: percent }
                thresholds: [0.01, 0.05]
              - column: p90_ms
                format: { unit: ms, scale: duration }
            linkToTraces: true
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: csv
                  columns: [source, target, value, errors, p90_ms]
                  rows:
                    - [frontend, checkout, 1200, 4, 180]
                    - [frontend, search, 800, 0, 95]
                    - [checkout, payments, 950, 76, 640]
                    - [checkout, inventory, 400, 6, 40]
                    - [search, inventory, 300, 1, 35]
                    - [payments, postgres, 900, 2, 12]
                    - [inventory, postgres, 700, 0, 8]
    node-graph-health-levels:
      kind: Panel
      spec:
        display:
          name: "NodeGraph: health levels"
          description: "errors as a rate with thresholds [0.01, 0.05] · healthy (green), degraded (amber) and failing (red) services side by side"
        plugin:
          kind: NodeGraph
          spec:
            valueFormat: { unit: "{request}" }
            stats:
              - column: errors
                reduce: rate
                format: { unit: "1", display: percent }
                thresholds: [0.01, 0.05]
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: csv
                  columns: [source, target, value, errors]
                  rows:
                    - [gateway, healthy-api, 1000, 2]
                    - [gateway, degraded-api, 1000, 25]
                    - [gateway, failing-api, 1000, 120]
                    - [healthy-api, cache, 900, 0]
                    - [degraded-api, cache, 800, 12]
                    - [failing-api, database, 700, 90]
    node-graph-health-latency:
      kind: Panel
      spec:
        display:
          name: "NodeGraph: latency thresholds"
          description: "one stat: p99 (mean) with thresholds [0.5, 2] in seconds, the column's unit · latency alone sets each level"
        plugin:
          kind: NodeGraph
          spec:
            valueFormat: { unit: "{request}" }
            stats:
              - column: p99
                format: { unit: s, scale: duration, decimals: 1 }
                thresholds: [0.5, 2]
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: csv
                  columns: [source, target, value, p99]
                  rows:
                    - [web, search, 500, 0.9]
                    - [web, recommendations, 300, 2.8]
                    - [search, index, 500, 0.31]
                    - [recommendations, feature-store, 300, 2.4]
                    - [recommendations, index, 120, 0.35]
    node-graph-health-strict:
      kind: Panel
      spec:
        display:
          name: "NodeGraph: strict thresholds"
          description: "errors as a rate with strict thresholds [0.001, 0.005] · 0.3% shows as degraded here"
        plugin:
          kind: NodeGraph
          spec:
            valueFormat: { unit: "{request}" }
            stats:
              - column: errors
                reduce: rate
                format: { unit: "1", display: percent }
                thresholds: [0.001, 0.005]
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: csv
                  columns: [source, target, value, errors]
                  rows:
                    - [checkout, payments, 10000, 30]
                    - [checkout, fraud-check, 10000, 80]
                    - [checkout, tax, 10000, 2]
    node-graph-health-large:
      kind: Panel

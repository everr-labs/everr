    node-graph-bidirectional:
      kind: Panel
      spec:
        display:
          name: "NodeGraph: bidirectional edges"
          description: "a→b and b→a are distinct edges, each with its own route"
        plugin:
          kind: NodeGraph
          spec: { valueFormat: { unit: "{message}" } }
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: csv
                  columns: [source, target, value]
                  rows:
                    - [producer, broker, 500]
                    - [broker, producer, 120]
                    - [broker, consumer, 480]
                    - [consumer, broker, 60]
    node-graph-multiquery:
      kind: Panel
      spec:
        display:
          name: "NodeGraph: multi-query"
          description: "two queries merge into one graph; the shared web→api edge sums (100+50)"
        plugin:
          kind: NodeGraph
          spec: {}
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: csv
                  columns: [source, target, value]
                  rows:
                    - [web, api, 100]
                    - [api, db, 80]
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: csv
                  columns: [source, target, value]
                  rows:
                    - [web, api, 50]
                    - [api, cache, 30]
    node-graph-dropped:
      kind: Panel
      spec:
        display:
          name: "NodeGraph: dropped rows"
          description: "null endpoints and self-loops → 'N rows not shown' badge"
        plugin:
          kind: NodeGraph
          spec: {}
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: csv
                  columns: [source, target, value]
                  rows:
                    - [ok, fine, 10]
                    - [fine, good, 6]
                    - [null, fine, 5]
                    - [ok, null, 4]
                    - [ok, ok, 3]
    node-graph-maxnodes:
      kind: Panel
      spec:
        display:
          name: "NodeGraph: maxNodes"
          description: "maxNodes: 4 → the 4 highest-value nodes stay, 'N nodes not shown' badge"
        plugin:
          kind: NodeGraph
          spec: { maxNodes: 4 }
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: csv
                  columns: [source, target, value]
                  rows:
                    - [hub, alpha, 900]
                    - [hub, beta, 700]
                    - [hub, gamma, 500]
                    - [hub, delta, 20]
                    - [hub, epsilon, 10]
                    - [hub, zeta, 5]
    node-graph-empty:
      kind: Panel
      spec:
        display:
          name: "NodeGraph: empty result"
          description: "Query returns no rows → 'No edges to graph in this result'"
        plugin:
          kind: NodeGraph
          spec: {}
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec: { scenario: csv, columns: [source, target, value], rows: [] }
    format-none:
      kind: Panel
      spec:
        display:
          name: "Format: none"
          description: "valueFormat: none, unit: {connection}, decimals: 2"
        plugin:
          kind: NodeGraph
          spec:
            { valueFormat: { unit: "{connection}", scale: none, decimals: 2 }, showValues: true }
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: table
                  rows: 3
                  columns:
                    [
                      { name: source, values: [api, worker] },
                      { name: target, values: [db, cache] },
                      { name: value, const: 12500 },
                    ]
    format-decimal:
      kind: Panel
      spec:
        display:
          name: "Format: decimal"
          description: "valueFormat: decimal, unit: widgets/s, decimals: 2"
        plugin:
          kind: NodeGraph
          spec: { valueFormat: { unit: widgets/s, scale: decimal, decimals: 2 }, showValues: true }
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: table
                  rows: 3
                  columns:
                    [
                      { name: source, values: [api, worker] },
                      { name: target, values: [db, cache] },
                      { name: value, const: 12500 },
                    ]
    format-binary:
      kind: Panel
      spec:
        display:
          name: "Format: binary"
          description: "valueFormat: binary, unit: By/s, decimals: 2"
        plugin:
          kind: NodeGraph
          spec: { valueFormat: { unit: By/s, scale: binary, decimals: 2 }, showValues: true }
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: table
                  rows: 3
                  columns:
                    [
                      { name: source, values: [api, worker] },
                      { name: target, values: [db, cache] },
                      { name: value, const: 2621440 },
                    ]
    format-duration:
      kind: Panel
      spec:
        display:
          name: "Format: duration"
          description: "valueFormat: duration, unit: s, decimals: 1"
        plugin:
          kind: NodeGraph
          spec: { valueFormat: { unit: s, scale: duration, decimals: 1 }, showValues: true }
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: table
                  rows: 3
                  columns:
                    [
                      { name: source, values: [api, worker] },
                      { name: target, values: [db, cache] },
                      { name: value, const: 0.025 },
                    ]
    format-percent:
      kind: Panel
      spec:
        display:
          name: "Format: ratio as percent"
          description: "unit: 1, display: percent; raw query ratios are unchanged"
        plugin:
          kind: NodeGraph
          spec:
            valueFormat:
              unit: "1"
              display: percent
            showValues: true
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: table
                  rows: 3
                  columns:
                    - name: source
                      values:
                        - api
                        - worker
                    - name: target
                      values:
                        - db
                        - cache
                    - name: value
                      const: 0.75
    format-si:
      kind: Panel
      spec:
        display:
          name: "Format: SI prefixes"
          description: "unit: Hz, scale: decimal; conventional GHz label"
        plugin:
          kind: NodeGraph
          spec:
            valueFormat:
              unit: Hz
              scale: decimal
            showValues: true
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: table
                  rows: 3
                  columns:
                    - name: source
                      values:
                        - api
                        - worker
                    - name: target
                      values:
                        - db
                        - cache
                    - name: value
                      const: 3200000000

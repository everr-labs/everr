kind: AlertRule
metadata:
  name: demo-flapping
  project: demo
spec:
  runbook: demo-alerts
  display:
    name: Flapping (demo)
    description: Fires for three minutes, resolves for three minutes, forever. Exercises firing and resolved transitions, notification churn, and event history in the alerting UI.
  evaluationInterval: 1m
  notificationMessage:
    title: "Demo alert: flapping is in its on phase"
    description: "This rule alternates between firing and resolved every three minutes to test state transitions in the UI."
  instanceLabels: [phase]
  condition:
    operator: eq
    threshold: 1
  query: |
    SELECT
      'flapper' AS phase,
      toUInt8(intDiv(toUnixTimestamp(now()), 180) % 2 = 0) AS value

kind: Dashboard
metadata:
  name: series
  project: demo
spec:
  display:
    name: Time Series
    description: >-
      TimeSeriesChart regression sheet — every option (unit, showLegend,
      lineWidth, curveType, connectNulls, stacked) and behavior (grouped pivot,
      multi-column, multi-query, mixed sample rates, gaps, empty result, no
      numeric column) exercised with deterministic TestData.
  duration: 7d
  refreshInterval: 1m
  panels:
    # ── Options ──────────────────────────────────────────────────────
    ts-grouped-legend:
      kind: Panel
      spec:
        display:
          name: "TS: grouped, legend"
          description: "curveType: linear (the default) · showLegend: true · connectNulls: false · grouped pivot (one series per StatusCode)"
        plugin:
          kind: TimeSeriesChart
          spec:
            unit: ""
            showLegend: true
            lineWidth: 1.5
            curveType: linear
            connectNulls: false
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: random_walk
                  seed: 11
                  labelColumn: status
                  series:
                    - { name: Ok,    start: 800, noise: 60, min: 0 }
                    - { name: Error, start: 40,  noise: 12, min: 0 }
                    - { name: Unset, start: 120, noise: 20, min: 0 }
    ts-step-after-multi-column:
      kind: Panel
      spec:
        display:
          name: "TS: stepAfter, unit, two columns"
          description: "curveType: stepAfter · unit: ms · lineWidth: 2 · two value columns from one query"
        plugin:
          kind: TimeSeriesChart
          spec:
            unit: ms
            showLegend: true
            lineWidth: 2
            curveType: stepAfter
            connectNulls: false
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: random_walk
                  seed: 7
                  series:
                    - { name: p50_ms, start: 40,  noise: 5,  min: 0 }
                    - { name: p95_ms, start: 120, noise: 12, min: 0 }
    ts-step-before:
      kind: Panel
      spec:
        display:
          name: "TS: stepBefore, hairline"
          description: "curveType: stepBefore · lineWidth: 1"
        plugin:
          kind: TimeSeriesChart
          spec:
            unit: ""
            showLegend: false
            lineWidth: 1
            curveType: stepBefore
            connectNulls: false
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: random_walk
                  seed: 9
                  series:
                    - { name: spans, start: 50, noise: 10, min: 0 }
    ts-unit-seconds:
      kind: Panel
      spec:
        display:
          name: "TS: seconds unit"
          description: "unit: s · single series, default interpolation"
        plugin:
          kind: TimeSeriesChart
          spec:
            unit: s
            showLegend: false
            lineWidth: 1.5
            curveType: linear
            connectNulls: false
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: random_walk
                  seed: 5
                  series:
                    - { name: avg_s, start: 0.5, noise: 0.1, min: 0 }
    # ── Gaps ─────────────────────────────────────────────────────────
    # The same 40 rows feed both panels; only `connectNulls` differs, so the
    # pair is what makes the option legible. `table` + `values` cycles by row
    # index, so a run of nulls the length of the row count lands exactly once —
    # a real outage-shaped hole, not the scatter `nullChance` produces.
    ts-gap:
      kind: Panel
      spec:
        display:
          name: "TS: gap, unbridged"
          description: "connectNulls: false · lineWidth: 3 · a contiguous run of nulls breaks the line where the data stops"
        plugin:
          kind: TimeSeriesChart
          spec:
            unit: ""
            showLegend: false
            lineWidth: 3
            curveType: linear
            connectNulls: false
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: table
                  rows: 40
                  columns:
                    - { name: ts, time: true }
                    - name: requests
                      values: [320, 340, 331, 358, 372, 349, 361, 388, 402, 377,
                               365, 391, 410, 398, 421,
                               null, null, null, null, null, null, null, null,
                               404, 388, 415, 430, 412, 399, 423, 441, 428, 405,
                               418, 396, 384, 401, 377, 392, 368]
    ts-gap-connected:
      kind: Panel
      spec:
        display:
          name: "TS: gap, bridged"
          description: "connectNulls: true · lineWidth: 3 · same rows as the panel to its left, drawn straight across the hole"
        plugin:
          kind: TimeSeriesChart
          spec:
            unit: ""
            showLegend: false
            lineWidth: 3
            curveType: linear
            connectNulls: true
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: table
                  rows: 40
                  columns:
                    - { name: ts, time: true }
                    - name: requests
                      values: [320, 340, 331, 358, 372, 349, 361, 388, 402, 377,
                               365, 391, 410, 398, 421,
                               null, null, null, null, null, null, null, null,
                               404, 388, 415, 430, 412, 399, 423, 441, 428, 405,
                               418, 396, 384, 401, 377, 392, 368]
    ts-mixed-interval:
      kind: Panel
      spec:
        display:
          name: "TS: mixed sample rates"
          description: "Two queries, 40 rows vs 9 · every series is null where only the other one sampled, so the coarse series needs connectNulls: true to draw at all"
        plugin:
          kind: TimeSeriesChart
          spec:
            unit: ""
            showLegend: true
            lineWidth: 1.5
            curveType: linear
            connectNulls: true
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: table
                  seed: 31
                  rows: 40
                  columns:
                    - { name: ts, time: true }
                    - { name: requests, walk: { start: 400, noise: 40, min: 0, round: 0 } }
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: table
                  seed: 32
                  rows: 9
                  columns:
                    - { name: ts, time: true }
                    - { name: batch_jobs, walk: { start: 120, noise: 25, min: 0, round: 0 } }
    # ── Stacking ─────────────────────────────────────────────────────
    ts-stacked-grouped:
      kind: Panel
      spec:
        display:
          name: "TS: stacked, grouped, legend"
          description: "stacked: true · showLegend: true · grouped pivot (one band per StatusCode)"
        plugin:
          kind: TimeSeriesChart
          spec:
            unit: ""
            showLegend: true
            lineWidth: 1.5
            curveType: linear
            connectNulls: false
            stacked: true
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: random_walk
                  seed: 11
                  labelColumn: status
                  series:
                    - { name: Ok,    start: 800, noise: 60, min: 0 }
                    - { name: Error, start: 40,  noise: 12, min: 0 }
                    - { name: Unset, start: 120, noise: 20, min: 0 }
    ts-stacked-sparse-step:
      kind: Panel
      spec:
        display:
          name: "TS: stacked, sparse series, stepAfter"
          description: "stacked: true · curveType: stepAfter · a series with no sample contributes 0 there, so stacking never shows a gap and connectNulls has no effect"
        plugin:
          kind: TimeSeriesChart
          spec:
            unit: ""
            showLegend: true
            lineWidth: 1
            curveType: stepAfter
            connectNulls: false
            stacked: true
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: random_walk
                  seed: 21
                  series:
                    - { name: requests, start: 300, noise: 30, min: 0 }
                    - { name: retries,  start: 25,  noise: 15, min: 0, nullChance: 0.45 }
    # ── Data-shape behaviors + empty states ──────────────────────────
    ts-multi-query:
      kind: Panel
      spec:
        display:
          name: "TS: multi-query merge"
          description: "Two queries on the same timeline merge into one x-axis · showLegend: true"
        plugin:
          kind: TimeSeriesChart
          spec:
            unit: ""
            showLegend: true
            lineWidth: 1.5
            curveType: linear
            connectNulls: false
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: random_walk
                  seed: 51
                  series:
                    - { name: requests, start: 400, noise: 40, min: 0 }
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: random_walk
                  seed: 52
                  series:
                    - { name: errors, start: 30, noise: 12, min: 0 }
    ts-empty:
      kind: Panel
      spec:
        display:
          name: "TS: empty result"
          description: "Query returns no rows → 'No data in this time range'"
        plugin:
          kind: TimeSeriesChart
          spec:
            unit: ""
            showLegend: false
            lineWidth: 1.5
            curveType: linear
            connectNulls: false
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: csv
                  columns: [ts, value]
                  rows: []
    ts-no-numeric:
      kind: Panel
      spec:
        display:
          name: "TS: no numeric column"
          description: "Rows arrive but none carry a numeric column → 'No numeric data to plot', the other empty state"
        plugin:
          kind: TimeSeriesChart
          spec:
            unit: ""
            showLegend: false
            lineWidth: 1.5
            curveType: linear
            connectNulls: false
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: csv
                  columns: [ts, service]
                  rows:
                    - ["2026-01-01 00:00:00", "api"]
                    - ["2026-01-01 00:01:00", "worker"]
  layouts:
    - kind: Grid
      spec:
        items:
          - { x: 0,  y: 0,  width: 12, height: 8, content: { $ref: "#/spec/panels/ts-grouped-legend" } }
          - { x: 12, y: 0,  width: 12, height: 8, content: { $ref: "#/spec/panels/ts-step-after-multi-column" } }
          - { x: 0,  y: 8,  width: 12, height: 8, content: { $ref: "#/spec/panels/ts-gap" } }
          - { x: 12, y: 8,  width: 12, height: 8, content: { $ref: "#/spec/panels/ts-gap-connected" } }
          - { x: 0,  y: 16, width: 8,  height: 7, content: { $ref: "#/spec/panels/ts-step-before" } }
          - { x: 8,  y: 16, width: 8,  height: 7, content: { $ref: "#/spec/panels/ts-unit-seconds" } }
          - { x: 16, y: 16, width: 8,  height: 7, content: { $ref: "#/spec/panels/ts-mixed-interval" } }
          - { x: 0,  y: 23, width: 12, height: 8, content: { $ref: "#/spec/panels/ts-stacked-grouped" } }
          - { x: 12, y: 23, width: 12, height: 8, content: { $ref: "#/spec/panels/ts-stacked-sparse-step" } }
          - { x: 0,  y: 31, width: 12, height: 8, content: { $ref: "#/spec/panels/ts-multi-query" } }
          - { x: 12, y: 31, width: 6,  height: 8, content: { $ref: "#/spec/panels/ts-empty" } }
          - { x: 18, y: 31, width: 6,  height: 8, content: { $ref: "#/spec/panels/ts-no-numeric" } }

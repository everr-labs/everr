kind: Dashboard
metadata:
  name: series
  project: demo
spec:
  display:
    name: Time Series
    description: >-
      TimeSeriesChart regression sheet: every option (unit, valueFormat, showLegend,
      lineWidth, curveType, connectNulls, stacked) and behavior (grouped pivot,
      multi-column, multi-query, null gaps, empty result) exercised with
      deterministic TestData.
  timeRange:
    from: now-7d
    to: now
  refreshInterval: 1m
  panels:
    # ── Options + core behaviors ─────────────────────────────────────
    ts-monotone-grouped:
      kind: Panel
      spec:
        display:
          name: "TS: monotone, grouped, legend"
          description: "curveType: monotone · showLegend: true · connectNulls: false · grouped pivot (one series per StatusCode)"
        plugin:
          kind: TimeSeriesChart
          spec:
            showLegend: true
            lineWidth: 1.5
            curveType: monotone
            connectNulls: false
            valueFormat:
              unit: ""
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: random_walk
                  seed: 11
                  labelColumn: status
                  series:
                    - { name: Ok,    start: 800, noise: 60, min: 0 }
                    - { name: Error, start: 40,  noise: 12, min: 0 }
                    - { name: Unset, start: 120, noise: 20, min: 0 }
    ts-step-after-multi-column:
      kind: Panel
      spec:
        display:
          name: "TS: stepAfter, unit, two columns"
          description: "curveType: stepAfter · unit: ms · lineWidth: 2 · two value columns from one query"
        plugin:
          kind: TimeSeriesChart
          spec:
            showLegend: true
            lineWidth: 2
            curveType: stepAfter
            connectNulls: false
            valueFormat:
              unit: ms
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: random_walk
                  seed: 7
                  series:
                    - { name: p50_ms, start: 40,  noise: 5,  min: 0 }
                    - { name: p95_ms, start: 120, noise: 12, min: 0 }
    ts-linear-connect-nulls:
      kind: Panel
      spec:
        display:
          name: "TS: linear, connectNulls, thick"
          description: "curveType: linear · connectNulls: true (sparse errors bridge gaps) · lineWidth: 3"
        plugin:
          kind: TimeSeriesChart
          spec:
            showLegend: false
            lineWidth: 3
            curveType: linear
            connectNulls: true
            valueFormat:
              unit: ""
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: random_walk
                  seed: 3
                  series:
                    - { name: error_spans, start: 4, noise: 3, min: 0, nullChance: 0.45 }
    ts-natural:
      kind: Panel
      spec:
        display:
          name: "TS: natural, byte units"
          description: "curveType: natural · valueFormat: binary B"
        plugin:
          kind: TimeSeriesChart
          spec:
            valueFormat: { unit: By, scale: binary }
            showLegend: false
            lineWidth: 1.5
            curveType: natural
            connectNulls: false
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: random_walk
                  seed: 5
                  series:
                    - { name: volume, start: 3221225472, noise: 268435456, min: 0 }
    ts-step-before:
      kind: Panel
      spec:
        display:
          name: "TS: stepBefore, hairline"
          description: "curveType: stepBefore · lineWidth: 1"
        plugin:
          kind: TimeSeriesChart
          spec:
            showLegend: false
            lineWidth: 1
            curveType: stepBefore
            connectNulls: false
            valueFormat:
              unit: ""
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: random_walk
                  seed: 9
                  series:
                    - { name: spans, start: 50, noise: 10, min: 0 }
    ts-stacked-grouped:
      kind: Panel
      spec:
        display:
          name: "TS: stacked, grouped, legend"
          description: "stacked: true · showLegend: true · grouped pivot (one band per StatusCode)"
        plugin:
          kind: TimeSeriesChart
          spec:
            showLegend: true
            lineWidth: 1.5
            curveType: monotone
            connectNulls: false
            stacked: true
            valueFormat:
              unit: ""
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: random_walk
                  seed: 11
                  labelColumn: status
                  series:
                    - { name: Ok,    start: 800, noise: 60, min: 0 }
                    - { name: Error, start: 40,  noise: 12, min: 0 }
                    - { name: Unset, start: 120, noise: 20, min: 0 }
    ts-stacked-sparse-step:
      kind: Panel
      spec:
        display:
          name: "TS: stacked, sparse series, stepAfter"
          description: "stacked: true · curveType: stepAfter · sparse series contributes 0 where unsampled (no gaps when stacking)"
        plugin:
          kind: TimeSeriesChart
          spec:
            showLegend: true
            lineWidth: 1
            curveType: stepAfter
            connectNulls: false
            stacked: true
            valueFormat:
              unit: ""
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: random_walk
                  seed: 21
                  series:
                    - { name: requests, start: 300, noise: 30, min: 0 }
                    - { name: retries,  start: 25,  noise: 15, min: 0, nullChance: 0.45 }
    # ── Data-shape behaviors + edge states ───────────────────────────
    ts-multi-query:
      kind: Panel
      spec:
        display:
          name: "TS: multi-query merge"
          description: "Two queries merged onto one timeline · showLegend: true"
        plugin:
          kind: TimeSeriesChart
          spec:
            showLegend: true
            lineWidth: 1.5
            curveType: monotone
            connectNulls: false
            valueFormat:
              unit: ""
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: random_walk
                  seed: 51
                  series:
                    - { name: requests, start: 400, noise: 40, min: 0 }
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: random_walk
                  seed: 52
                  series:
                    - { name: errors, start: 30, noise: 12, min: 0 }
    ts-empty:
      kind: Panel
      spec:
        display:
          name: "TS: empty result"
          description: "Query returns no rows → 'No data in this time range' (the chart's single empty state)"
        plugin:
          kind: TimeSeriesChart
          spec:
            showLegend: false
            lineWidth: 1.5
            curveType: monotone
            connectNulls: false
            valueFormat:
              unit: ""
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: csv
                  columns: [ts, value]
                  rows: []
    format-none:
      kind: Panel
      spec:
        display:
          name: "Format: none"
          description: "valueFormat: none, unit: {connection}, decimals: 2"
        plugin:
          kind: TimeSeriesChart
          spec: { valueFormat: { unit: '{connection}', scale: none, decimals: 2 } }
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: table
                  rows: 12
                  columns: [{ name: ts, time: true }, { name: value, walk: { start: 12500, noise: 1250, min: 0 } }]
    format-decimal:
      kind: Panel
      spec:
        display:
          name: "Format: decimal"
          description: "valueFormat: decimal, unit: widgets/s, decimals: 2"
        plugin:
          kind: TimeSeriesChart
          spec: { valueFormat: { unit: widgets/s, scale: decimal, decimals: 2 } }
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: table
                  rows: 12
                  columns: [{ name: ts, time: true }, { name: value, walk: { start: 12500, noise: 1250, min: 0 } }]
    format-binary:
      kind: Panel
      spec:
        display:
          name: "Format: binary"
          description: "valueFormat: binary, unit: By/s, decimals: 2"
        plugin:
          kind: TimeSeriesChart
          spec: { valueFormat: { unit: By/s, scale: binary, decimals: 2 } }
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: table
                  rows: 12
                  columns: [{ name: ts, time: true }, { name: value, walk: { start: 2621440, noise: 262144, min: 0 } }]
    format-duration:
      kind: Panel
      spec:
        display:
          name: "Format: duration"
          description: "valueFormat: duration, unit: s, decimals: 1"
        plugin:
          kind: TimeSeriesChart
          spec: { valueFormat: { unit: s, scale: duration, decimals: 1 } }
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: table
                  rows: 12
                  columns: [{ name: ts, time: true }, { name: value, walk: { start: 0.025, noise: 0.0025, min: 0 } }]
    format-percent:
      kind: Panel
      spec:
        display:
          name: "Format: ratio as percent"
          description: "unit: 1, display: percent; raw query ratios are unchanged"
        plugin:
          kind: TimeSeriesChart
          spec:
            valueFormat:
              unit: "1"
              display: percent
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: table
                  rows: 12
                  columns:
                    - name: ts
                      time: true
                    - name: value
                      const: 0.75
    format-si:
      kind: Panel
      spec:
        display:
          name: "Format: SI prefixes"
          description: "unit: Hz, scale: decimal; conventional GHz label"
        plugin:
          kind: TimeSeriesChart
          spec:
            valueFormat:
              unit: Hz
              scale: decimal
        queries:
          - kind: TestData
            spec:
              plugin:
                kind: TestData
                spec:
                  scenario: table
                  rows: 12
                  columns:
                    - name: ts
                      time: true
                    - name: value
                      const: 3200000000
  layouts:
    - kind: Grid
      spec:
        items:
          - { x: 0,  y: 0,  width: 12, height: 8, content: { $ref: "#/spec/panels/ts-monotone-grouped" } }
          - { x: 12, y: 0,  width: 12, height: 8, content: { $ref: "#/spec/panels/ts-step-after-multi-column" } }
          - { x: 0,  y: 8,  width: 8,  height: 7, content: { $ref: "#/spec/panels/ts-linear-connect-nulls" } }
          - { x: 8,  y: 8,  width: 8,  height: 7, content: { $ref: "#/spec/panels/ts-natural" } }
          - { x: 16, y: 8,  width: 8,  height: 7, content: { $ref: "#/spec/panels/ts-step-before" } }
          - { x: 0,  y: 15, width: 12, height: 8, content: { $ref: "#/spec/panels/ts-stacked-grouped" } }
          - { x: 12, y: 15, width: 12, height: 8, content: { $ref: "#/spec/panels/ts-stacked-sparse-step" } }
          - { x: 0,  y: 23, width: 16, height: 8, content: { $ref: "#/spec/panels/ts-multi-query" } }
          - { x: 16, y: 23, width: 8,  height: 8, content: { $ref: "#/spec/panels/ts-empty" } }
          - { x: 0, y: 31, width: 12, height: 9, content: { $ref: "#/spec/panels/format-none" } }
          - { x: 12, y: 31, width: 12, height: 9, content: { $ref: "#/spec/panels/format-decimal" } }
          - { x: 0, y: 40, width: 12, height: 9, content: { $ref: "#/spec/panels/format-binary" } }
          - { x: 12, y: 40, width: 12, height: 9, content: { $ref: "#/spec/panels/format-duration" } }
          - { x: 0, y: 49, width: 12, height: 8, content: { $ref: "#/spec/panels/format-percent" } }
          - { x: 12, y: 49, width: 12, height: 8, content: { $ref: "#/spec/panels/format-si" } }

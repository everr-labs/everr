kind: SLO
metadata:
  name: log-pipeline-quality
spec:
  runbook: log-pipeline-quality
  display:
    name: Log pipeline quality
    description: >-
      Share of ingested log records below error severity across the fleet.
      Burns when error-or-worse logs become a meaningful fraction of all logs.
  sli:
    sql: >-
      SELECT countIf(SeverityNumber < 17) AS good, count() AS valid
      FROM app.logs
      WHERE TimestampTime >= {window_start:DateTime}
      AND TimestampTime < {window_end:DateTime}
  targetPercent: 99.5
  timeWindow: 7d
  minValidEvents: 100

kind: SLO
metadata:
  name: log-pipeline-quality
spec:
  runbook: log-pipeline-quality
  display:
    name: Log pipeline quality
    description: >-
      Share of ingested log records below error severity, per service. Burns
      when a service starts emitting a meaningful fraction of error-or-worse
      logs.
  sli:
    sql: >-
      SELECT ServiceName,
      countIf(SeverityNumber < 17) AS good, count() AS valid
      FROM app.logs
      WHERE TimestampTime >= {window_start:DateTime}
      AND TimestampTime < {window_end:DateTime}
      GROUP BY ServiceName
    labelColumns:
      - ServiceName
  targetPercent: 99.5
  timeWindow: 7d
  minValidEvents: 100

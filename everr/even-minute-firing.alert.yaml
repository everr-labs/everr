kind: AlertRule
metadata:
  name: even-minute-firing
spec:
  runbook: even-minute-firing
  display:
    name: Even minute firing test
    description: Synthetic alert that fires on even minutes with a fresh instance id.
  notificationMessage:
    title: "Even minute test fired for ${instance_id}"
    description: "Minute ${minute} at ${evaluated_at}"
  evaluationInterval: 1m
  instanceLabels: [instance_id]
  query: |
    SELECT
      'even-minute-test' AS ServiceName,
      toString(toStartOfMinute(now())) AS instance_id,
      toMinute(now()) AS minute,
      toString(now()) AS evaluated_at
    WHERE toMinute(now()) % 2 = 0

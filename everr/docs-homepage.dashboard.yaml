kind: Dashboard
metadata:
  name: docs-homepage
spec:
  display:
    description: 'Everr-native browser telemetry from the docs homepage (cookieless @everr/web-sdk): traffic and sessions at a glance, top pages, scroll depth, and frustration signals (rage and dead clicks). Populates once the homepage ships with an ingest key.'
    name: Docs Homepage
  duration: 24h
  layouts:
  - kind: Grid
    spec:
      items:
      - content:
          $ref: '#/spec/panels/pageviews'
        height: 5
        width: 6
        x: 0
        y: 0
      - content:
          $ref: '#/spec/panels/sessions'
        height: 5
        width: 6
        x: 6
        y: 0
      - content:
          $ref: '#/spec/panels/scroll-depth'
        height: 5
        width: 6
        x: 12
        y: 0
      - content:
          $ref: '#/spec/panels/frustration'
        height: 5
        width: 6
        x: 18
        y: 0
      - content:
          $ref: '#/spec/panels/traffic'
        height: 9
        width: 16
        x: 0
        y: 5
      - content:
          $ref: '#/spec/panels/top-pages'
        height: 9
        width: 8
        x: 16
        y: 5
      - content:
          $ref: '#/spec/panels/frustration-over-time'
        height: 9
        width: 24
        x: 0
        y: 14
  panels:
    frustration:
      kind: Panel
      spec:
        display:
          name: Frustration clicks
        plugin:
          kind: StatChart
          spec:
            calculation: last
            thresholds:
              defaultColor: '#22c55e'
              mode: absolute
              steps:
              - color: '#f59e0b'
                value: 1
              - color: '#ef4444'
                value: 20
        queries:
        - kind: ClickHouseSQL
          spec:
            plugin:
              kind: ClickHouseSQL
              spec:
                query: |
                  SELECT countIf(EventName = 'browser.interaction.rage_click') AS rage,
                         countIf(EventName = 'browser.interaction.dead_click') AS dead
                  FROM logs
                  WHERE Timestamp >= {from:String} AND Timestamp <= {to:String}
                    AND ServiceName = 'everr-docs'
    frustration-over-time:
      kind: Panel
      spec:
        display:
          name: Rage and dead clicks
        plugin:
          kind: TimeSeriesChart
          spec:
            showLegend: true
        queries:
        - kind: ClickHouseSQL
          spec:
            plugin:
              kind: ClickHouseSQL
              spec:
                query: |
                  SELECT toStartOfInterval(Timestamp, INTERVAL {step:UInt32} SECOND) AS ts,
                         countIf(EventName = 'browser.interaction.rage_click') AS rage_clicks,
                         countIf(EventName = 'browser.interaction.dead_click') AS dead_clicks
                  FROM logs
                  WHERE Timestamp >= {from:String} AND Timestamp <= {to:String}
                    AND ServiceName = 'everr-docs'
                    AND EventName IN ('browser.interaction.rage_click', 'browser.interaction.dead_click')
                  GROUP BY ts
                  ORDER BY ts
    pageviews:
      kind: Panel
      spec:
        display:
          name: Pageviews
        plugin:
          kind: StatChart
          spec:
            calculation: sum
            sparkline: true
        queries:
        - kind: ClickHouseSQL
          spec:
            plugin:
              kind: ClickHouseSQL
              spec:
                query: |
                  SELECT toStartOfInterval(Timestamp, INTERVAL {step:UInt32} SECOND) AS ts,
                         count() AS pageviews
                  FROM logs
                  WHERE Timestamp >= {from:String} AND Timestamp <= {to:String}
                    AND ServiceName = 'everr-docs'
                    AND EventName = 'browser.page_view'
                  GROUP BY ts
                  ORDER BY ts
    scroll-depth:
      kind: Panel
      spec:
        display:
          name: Avg scroll depth
        plugin:
          kind: StatChart
          spec:
            calculation: last
            decimals: 0
            unit: '%'
        queries:
        - kind: ClickHouseSQL
          spec:
            plugin:
              kind: ClickHouseSQL
              spec:
                query: |
                  SELECT round(avg(toFloat64OrZero(LogAttributes['everr.scroll.depth'])) * 100) AS scroll_depth
                  FROM logs
                  WHERE Timestamp >= {from:String} AND Timestamp <= {to:String}
                    AND ServiceName = 'everr-docs'
                    AND EventName = 'browser.page_leave'
    sessions:
      kind: Panel
      spec:
        display:
          name: Sessions
        plugin:
          kind: StatChart
          spec:
            calculation: last
        queries:
        - kind: ClickHouseSQL
          spec:
            plugin:
              kind: ClickHouseSQL
              spec:
                query: |
                  SELECT uniqExact(LogAttributes['session.id']) AS sessions
                  FROM logs
                  WHERE Timestamp >= {from:String} AND Timestamp <= {to:String}
                    AND ServiceName = 'everr-docs'
                    AND EventName = 'browser.page_view'
    top-pages:
      kind: Panel
      spec:
        display:
          name: Top pages
        plugin:
          kind: Table
          spec:
            stickyHeader: true
        queries:
        - kind: ClickHouseSQL
          spec:
            plugin:
              kind: ClickHouseSQL
              spec:
                query: |
                  SELECT LogAttributes['url.path'] AS path,
                         count() AS views,
                         uniqExact(LogAttributes['session.id']) AS sessions
                  FROM logs
                  WHERE Timestamp >= {from:String} AND Timestamp <= {to:String}
                    AND ServiceName = 'everr-docs'
                    AND EventName = 'browser.page_view'
                  GROUP BY path
                  ORDER BY views DESC
                  LIMIT 10
    traffic:
      kind: Panel
      spec:
        display:
          name: Traffic
        plugin:
          kind: TimeSeriesChart
          spec:
            showLegend: true
        queries:
        - kind: ClickHouseSQL
          spec:
            plugin:
              kind: ClickHouseSQL
              spec:
                query: |
                  SELECT toStartOfInterval(Timestamp, INTERVAL {step:UInt32} SECOND) AS ts,
                         count() AS pageviews,
                         uniqExact(LogAttributes['session.id']) AS sessions
                  FROM logs
                  WHERE Timestamp >= {from:String} AND Timestamp <= {to:String}
                    AND ServiceName = 'everr-docs'
                    AND EventName = 'browser.page_view'
                  GROUP BY ts
                  ORDER BY ts
  refreshInterval: 1m

kind: Dashboard
metadata:
  name: web-vitals
spec:
  display:
    name: Web Vitals
    description: >-
      Core Web Vitals from the @everr/web-sdk browser clients (web app and
      docs): p75 per vital against the standard good/poor thresholds, trends
      over time, rating distribution, and the worst routes.
  duration: 24h
  refreshInterval: 1m
  variables:
    - kind: ListVariable
      spec:
        name: service
        display: { name: Service }
        allowMultiple: true
        allowAllValue: true
        defaultValue: "__all"
        sort: alphabetical-asc
        plugin:
          kind: ClickHouseSQLVariable
          spec:
            query: >-
              SELECT DISTINCT ServiceName FROM logs
              WHERE EventName = 'browser.web_vital'
              ORDER BY ServiceName
  panels:
    p75-lcp:
      kind: Panel
      spec:
        display: { name: LCP p75 }
        plugin:
          kind: StatChart
          spec:
            calculation: last
            unit: ms
            decimals: 0
            thresholds:
              mode: absolute
              defaultColor: "#22c55e"
              steps:
                - { value: 2500, color: "#f59e0b" }
                - { value: 4000, color: "#ef4444" }
        queries:
          - kind: ClickHouseSQL
            spec:
              plugin:
                kind: ClickHouseSQL
                spec:
                  query: |
                    SELECT round(quantile(0.75)(toFloat64OrNull(LogAttributes['browser.web_vital.value']))) AS lcp
                    FROM logs
                    WHERE Timestamp >= {from:String} AND Timestamp <= {to:String}
                      AND EventName = 'browser.web_vital'
                      AND LogAttributes['browser.web_vital.name'] = 'lcp'
                      AND ServiceName IN $service
    p75-inp:
      kind: Panel
      spec:
        display: { name: INP p75 }
        plugin:
          kind: StatChart
          spec:
            calculation: last
            unit: ms
            decimals: 0
            thresholds:
              mode: absolute
              defaultColor: "#22c55e"
              steps:
                - { value: 200, color: "#f59e0b" }
                - { value: 500, color: "#ef4444" }
        queries:
          - kind: ClickHouseSQL
            spec:
              plugin:
                kind: ClickHouseSQL
                spec:
                  query: |
                    SELECT round(quantile(0.75)(toFloat64OrNull(LogAttributes['browser.web_vital.value']))) AS inp
                    FROM logs
                    WHERE Timestamp >= {from:String} AND Timestamp <= {to:String}
                      AND EventName = 'browser.web_vital'
                      AND LogAttributes['browser.web_vital.name'] = 'inp'
                      AND ServiceName IN $service
    p75-cls:
      kind: Panel
      spec:
        display: { name: CLS p75 }
        plugin:
          kind: StatChart
          spec:
            calculation: last
            decimals: 3
            thresholds:
              mode: absolute
              defaultColor: "#22c55e"
              steps:
                - { value: 0.1, color: "#f59e0b" }
                - { value: 0.25, color: "#ef4444" }
        queries:
          - kind: ClickHouseSQL
            spec:
              plugin:
                kind: ClickHouseSQL
                spec:
                  query: |
                    SELECT round(quantile(0.75)(toFloat64OrNull(LogAttributes['browser.web_vital.value'])), 3) AS cls
                    FROM logs
                    WHERE Timestamp >= {from:String} AND Timestamp <= {to:String}
                      AND EventName = 'browser.web_vital'
                      AND LogAttributes['browser.web_vital.name'] = 'cls'
                      AND ServiceName IN $service
    p75-ttfb:
      kind: Panel
      spec:
        display: { name: TTFB p75 }
        plugin:
          kind: StatChart
          spec:
            calculation: last
            unit: ms
            decimals: 0
            thresholds:
              mode: absolute
              defaultColor: "#22c55e"
              steps:
                - { value: 800, color: "#f59e0b" }
                - { value: 1800, color: "#ef4444" }
        queries:
          - kind: ClickHouseSQL
            spec:
              plugin:
                kind: ClickHouseSQL
                spec:
                  query: |
                    SELECT round(quantile(0.75)(toFloat64OrNull(LogAttributes['browser.web_vital.value']))) AS ttfb
                    FROM logs
                    WHERE Timestamp >= {from:String} AND Timestamp <= {to:String}
                      AND EventName = 'browser.web_vital'
                      AND LogAttributes['browser.web_vital.name'] = 'ttfb'
                      AND ServiceName IN $service
    p75-fcp:
      kind: Panel
      spec:
        display: { name: FCP p75 }
        plugin:
          kind: StatChart
          spec:
            calculation: last
            unit: ms
            decimals: 0
            thresholds:
              mode: absolute
              defaultColor: "#22c55e"
              steps:
                - { value: 1800, color: "#f59e0b" }
                - { value: 3000, color: "#ef4444" }
        queries:
          - kind: ClickHouseSQL
            spec:
              plugin:
                kind: ClickHouseSQL
                spec:
                  query: |
                    SELECT round(quantile(0.75)(toFloat64OrNull(LogAttributes['browser.web_vital.value']))) AS fcp
                    FROM logs
                    WHERE Timestamp >= {from:String} AND Timestamp <= {to:String}
                      AND EventName = 'browser.web_vital'
                      AND LogAttributes['browser.web_vital.name'] = 'fcp'
                      AND ServiceName IN $service
    ms-vitals-over-time:
      kind: Panel
      spec:
        display:
          name: p75 over time (ms vitals)
          description: LCP, INP, TTFB, and FCP p75 per bucket.
        plugin:
          kind: TimeSeriesChart
          spec: { unit: ms, showLegend: true, connectNulls: true }
        queries:
          - kind: ClickHouseSQL
            spec:
              plugin:
                kind: ClickHouseSQL
                spec:
                  query: |
                    SELECT toStartOfInterval(Timestamp, INTERVAL {step:UInt32} SECOND) AS ts,
                           round(quantileIf(0.75)(toFloat64OrNull(LogAttributes['browser.web_vital.value']), LogAttributes['browser.web_vital.name'] = 'lcp')) AS lcp,
                           round(quantileIf(0.75)(toFloat64OrNull(LogAttributes['browser.web_vital.value']), LogAttributes['browser.web_vital.name'] = 'inp')) AS inp,
                           round(quantileIf(0.75)(toFloat64OrNull(LogAttributes['browser.web_vital.value']), LogAttributes['browser.web_vital.name'] = 'ttfb')) AS ttfb,
                           round(quantileIf(0.75)(toFloat64OrNull(LogAttributes['browser.web_vital.value']), LogAttributes['browser.web_vital.name'] = 'fcp')) AS fcp
                    FROM logs
                    WHERE Timestamp >= {from:String} AND Timestamp <= {to:String}
                      AND EventName = 'browser.web_vital'
                      AND ServiceName IN $service
                    GROUP BY ts
                    ORDER BY ts
    cls-over-time:
      kind: Panel
      spec:
        display: { name: CLS p75 over time }
        plugin:
          kind: TimeSeriesChart
          spec: { showLegend: true, connectNulls: true }
        queries:
          - kind: ClickHouseSQL
            spec:
              plugin:
                kind: ClickHouseSQL
                spec:
                  query: |
                    SELECT toStartOfInterval(Timestamp, INTERVAL {step:UInt32} SECOND) AS ts,
                           ServiceName,
                           round(quantile(0.75)(toFloat64OrNull(LogAttributes['browser.web_vital.value'])), 3) AS cls
                    FROM logs
                    WHERE Timestamp >= {from:String} AND Timestamp <= {to:String}
                      AND EventName = 'browser.web_vital'
                      AND LogAttributes['browser.web_vital.name'] = 'cls'
                      AND ServiceName IN $service
                    GROUP BY ts, ServiceName
                    ORDER BY ts
    rating-by-vital:
      kind: Panel
      spec:
        display:
          name: Rating distribution by vital
          description: Share of good / needs-improvement / poor samples per vital.
        plugin:
          kind: BarChart
          spec: { showLegend: true, stacking: percent }
        queries:
          - kind: ClickHouseSQL
            spec:
              plugin:
                kind: ClickHouseSQL
                spec:
                  query: |
                    SELECT LogAttributes['browser.web_vital.name'] AS vital,
                           LogAttributes['everr.browser.web_vital.rating'] AS rating,
                           count() AS samples
                    FROM logs
                    WHERE Timestamp >= {from:String} AND Timestamp <= {to:String}
                      AND EventName = 'browser.web_vital'
                      AND ServiceName IN $service
                    GROUP BY vital, rating
                    ORDER BY vital, rating
    worst-routes:
      kind: Panel
      spec:
        display:
          name: Worst routes by LCP p75
          description: Route pattern when the router reported one, else the raw path.
        plugin:
          kind: Table
          spec: { stickyHeader: true }
        queries:
          - kind: ClickHouseSQL
            spec:
              plugin:
                kind: ClickHouseSQL
                spec:
                  query: |
                    SELECT ServiceName AS service,
                           if(LogAttributes['everr.route.pattern'] != '', LogAttributes['everr.route.pattern'], LogAttributes['url.path']) AS route,
                           count() AS samples,
                           round(quantileIf(0.75)(toFloat64OrNull(LogAttributes['browser.web_vital.value']), LogAttributes['browser.web_vital.name'] = 'lcp')) AS lcp_p75_ms,
                           round(quantileIf(0.75)(toFloat64OrNull(LogAttributes['browser.web_vital.value']), LogAttributes['browser.web_vital.name'] = 'inp')) AS inp_p75_ms,
                           round(quantileIf(0.75)(toFloat64OrNull(LogAttributes['browser.web_vital.value']), LogAttributes['browser.web_vital.name'] = 'cls'), 3) AS cls_p75
                    FROM logs
                    WHERE Timestamp >= {from:String} AND Timestamp <= {to:String}
                      AND EventName = 'browser.web_vital'
                      AND ServiceName IN $service
                    GROUP BY service, route
                    ORDER BY lcp_p75_ms DESC NULLS LAST
                    LIMIT 15
  layouts:
    - kind: Grid
      spec:
        items:
          - { x: 0,  y: 0,  width: 5,  height: 5, content: { $ref: "#/spec/panels/p75-lcp" } }
          - { x: 5,  y: 0,  width: 5,  height: 5, content: { $ref: "#/spec/panels/p75-inp" } }
          - { x: 10, y: 0,  width: 4,  height: 5, content: { $ref: "#/spec/panels/p75-cls" } }
          - { x: 14, y: 0,  width: 5,  height: 5, content: { $ref: "#/spec/panels/p75-ttfb" } }
          - { x: 19, y: 0,  width: 5,  height: 5, content: { $ref: "#/spec/panels/p75-fcp" } }
          - { x: 0,  y: 5,  width: 16, height: 9, content: { $ref: "#/spec/panels/ms-vitals-over-time" } }
          - { x: 16, y: 5,  width: 8,  height: 9, content: { $ref: "#/spec/panels/cls-over-time" } }
          - { x: 0,  y: 14, width: 10, height: 9, content: { $ref: "#/spec/panels/rating-by-vital" } }
          - { x: 10, y: 14, width: 14, height: 9, content: { $ref: "#/spec/panels/worst-routes" } }

kind: AlertRule
metadata:
  name: alert-clock-restarts
spec:
  runbook: alert-clock-restarts
  severity: warning
  display:
    name: Alert for-clock restarts
    description: >-
      The alerting engine keeps discarding a rule's pending progress because
      evaluations arrive too late to vouch for the stretch between them. A rule
      in this state can never satisfy its `for` clause, and nothing else says
      so.
  notificationMessage:
    title: "${rule} cannot satisfy its for clause (${value} restarts in 30 min)"
    description: >-
      Evaluations are landing more than two intervals apart, so the engine
      restarts the pending clock rather than count an unwatched stretch as
      holding. Worst gap ${worst_gap_ms}ms against a ${interval_secs}s interval
      and a ${for_secs}s for clause.
  evaluationInterval: 5m
  # One instance per affected rule. Without this the identity would take in
  # every string column, and the gap and the interval move between
  # evaluations, so each one would open a fresh instance.
  instanceLabels: [rule]
  # No `for` clause on purpose. This rule watches the mechanism that a `for`
  # clause depends on, so a pending phase here could be discarded by the very
  # fault it reports. The 30-minute window does the smoothing instead: a
  # worker restart costs each rule one restart, so three inside half an hour
  # is a cadence problem, not a deploy.
  condition:
    operator: gte
    threshold: 3
  query: |
    SELECT
      LogAttributes['everr.alert.rule'] AS rule,
      count() AS value,
      max(toUInt64OrZero(LogAttributes['everr.alert.unobserved_gap_ms'])) AS worst_gap_ms,
      max(toUInt32OrZero(LogAttributes['everr.alert.interval_secs'])) AS interval_secs,
      max(toUInt32OrZero(LogAttributes['everr.alert.for_secs'])) AS for_secs
    FROM logs
    WHERE Timestamp >= now() - INTERVAL 30 MINUTE
      AND Body = 'alerts.evaluate.for_clock_restarted'
    GROUP BY rule
    ORDER BY value DESC

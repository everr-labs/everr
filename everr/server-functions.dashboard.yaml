kind: Dashboard
metadata:
  name: server-functions
  project: default
  template: rpc-services
spec:
  display:
    name: Server Functions
    description: 'TanStack server functions, described with the RPC semantic conventions. Inbound work
      only: these spans stay Internal so they do not double-count against the framework''s own POST /_serverFn/:id
      SERVER span, so the panels accept Internal as well as Server. There is no outbound half because
      nothing here makes an RPC client call.'
  duration: 6h
  layouts:
  - kind: Grid
    spec:
      items:
      - content:
          $ref: '#/spec/panels/calls'
        height: 5
        width: 6
        x: 0
        y: 0
      - content:
          $ref: '#/spec/panels/error-rate'
        height: 5
        width: 6
        x: 6
        y: 0
      - content:
          $ref: '#/spec/panels/p95-latency'
        height: 5
        width: 6
        x: 12
        y: 0
      - content:
          $ref: '#/spec/panels/p99-latency'
        height: 5
        width: 6
        x: 18
        y: 0
      - content:
          $ref: '#/spec/panels/by-status'
        height: 8
        width: 12
        x: 0
        y: 5
      - content:
          $ref: '#/spec/panels/by-method'
        height: 8
        width: 12
        x: 12
        y: 5
      - content:
          $ref: '#/spec/panels/latency-by-method'
        height: 8
        width: 12
        x: 0
        y: 13
      - content:
          $ref: '#/spec/panels/by-system'
        height: 8
        width: 12
        x: 12
        y: 13
      - content:
          $ref: '#/spec/panels/slowest-methods'
        height: 9
        width: 12
        x: 0
        y: 21
      - content:
          $ref: '#/spec/panels/time-by-method'
        height: 9
        width: 12
        x: 12
        y: 21
      - content:
          $ref: '#/spec/panels/failing-methods'
        height: 9
        width: 24
        x: 0
        y: 30
  panels:
    by-method:
      kind: Panel
      spec:
        display:
          description: The eight busiest methods over the range. Quieter methods are in the tables below.
          name: Calls by method
        plugin:
          kind: TimeSeriesChart
          spec:
            showLegend: true
            stacked: true
        queries:
        - kind: ClickHouseSQL
          spec:
            plugin:
              kind: ClickHouseSQL
              spec:
                query: |-
                  SELECT toStartOfInterval(Timestamp, INTERVAL {step:UInt32} * 6 SECOND) AS ts,
                         coalesce(nullIf(SpanAttributes['rpc.method'], ''), SpanName) AS method,
                         count() AS calls
                  FROM traces
                  WHERE Timestamp >= {from:String} AND Timestamp <= {to:String} AND ServiceName IN $service AND SpanAttributes['rpc.system.name'] != '' AND SpanKind IN ('Server', 'Internal')
                    AND coalesce(nullIf(SpanAttributes['rpc.method'], ''), SpanName) IN (
                    SELECT coalesce(nullIf(SpanAttributes['rpc.method'], ''), SpanName) FROM traces WHERE Timestamp >= {from:String} AND Timestamp <= {to:String} AND ServiceName IN $service AND SpanAttributes['rpc.system.name'] != '' AND SpanKind IN ('Server', 'Internal')
                    GROUP BY coalesce(nullIf(SpanAttributes['rpc.method'], ''), SpanName) ORDER BY count() DESC LIMIT 8
                  )
                  GROUP BY ts, method
                  ORDER BY ts
    by-status:
      kind: Panel
      spec:
        display:
          description: Empty until server functions set rpc.response.status_code. This is protocol
            status rather than span status, so a call that returns a handled error still counts
            as completed.
          name: Calls by status code
        plugin:
          kind: TimeSeriesChart
          spec:
            showLegend: true
            stacked: true
        queries:
        - kind: ClickHouseSQL
          spec:
            plugin:
              kind: ClickHouseSQL
              spec:
                query: |-
                  SELECT toStartOfInterval(Timestamp, INTERVAL {step:UInt32} * 6 SECOND) AS ts,
                         SpanAttributes['rpc.response.status_code'] AS status_code,
                         count() AS calls
                  FROM traces
                  WHERE Timestamp >= {from:String} AND Timestamp <= {to:String} AND ServiceName IN $service AND SpanAttributes['rpc.system.name'] != '' AND SpanKind IN ('Server', 'Internal') AND SpanAttributes['rpc.response.status_code'] != ''
                    AND SpanAttributes['rpc.response.status_code'] IN (
                    SELECT SpanAttributes['rpc.response.status_code'] FROM traces WHERE Timestamp >= {from:String} AND Timestamp <= {to:String} AND ServiceName IN $service AND SpanAttributes['rpc.system.name'] != '' AND SpanKind IN ('Server', 'Internal') AND SpanAttributes['rpc.response.status_code'] != ''
                    GROUP BY SpanAttributes['rpc.response.status_code'] ORDER BY count() DESC LIMIT 8
                  )
                  GROUP BY ts, status_code
                  ORDER BY ts
    by-system:
      kind: Panel
      spec:
        display:
          description: One line per protocol. A single-protocol service draws one line, which is the expected
            shape.
          name: Calls by RPC system
        plugin:
          kind: TimeSeriesChart
          spec:
            showLegend: true
            stacked: true
        queries:
        - kind: ClickHouseSQL
          spec:
            plugin:
              kind: ClickHouseSQL
              spec:
                query: |-
                  SELECT toStartOfInterval(Timestamp, INTERVAL {step:UInt32} * 6 SECOND) AS ts,
                         SpanAttributes['rpc.system.name'] AS rpc_system,
                         count() AS calls
                  FROM traces
                  WHERE Timestamp >= {from:String} AND Timestamp <= {to:String} AND ServiceName IN $service AND SpanAttributes['rpc.system.name'] != '' AND SpanKind IN ('Server', 'Internal')
                    AND SpanAttributes['rpc.system.name'] IN (
                    SELECT SpanAttributes['rpc.system.name'] FROM traces WHERE Timestamp >= {from:String} AND Timestamp <= {to:String} AND ServiceName IN $service AND SpanAttributes['rpc.system.name'] != '' AND SpanKind IN ('Server', 'Internal')
                    GROUP BY SpanAttributes['rpc.system.name'] ORDER BY count() DESC LIMIT 8
                  )
                  GROUP BY ts, rpc_system
                  ORDER BY ts
    calls:
      kind: Panel
      spec:
        display:
          name: Calls
        plugin:
          kind: StatChart
          spec:
            calculation: sum
            sparkline: true
        queries:
        - kind: ClickHouseSQL
          spec:
            plugin:
              kind: ClickHouseSQL
              spec:
                query: |-
                  SELECT toStartOfInterval(Timestamp, INTERVAL {step:UInt32} SECOND) AS ts, count() AS calls
                  FROM traces
                  WHERE Timestamp >= {from:String} AND Timestamp <= {to:String} AND ServiceName IN $service AND SpanAttributes['rpc.system.name'] != '' AND SpanKind IN ('Server', 'Internal')
                  GROUP BY ts
                  ORDER BY ts
    error-rate:
      kind: Panel
      spec:
        display:
          name: Error rate
        plugin:
          kind: StatChart
          spec:
            calculation: last
            decimals: 2
            thresholds:
              defaultColor: '#22c55e'
              mode: absolute
              steps:
              - color: '#f59e0b'
                value: 1
              - color: '#ef4444'
                value: 5
            unit: '%'
        queries:
        - kind: ClickHouseSQL
          spec:
            plugin:
              kind: ClickHouseSQL
              spec:
                query: |-
                  SELECT countIf(StatusCode = 'Error') / count() * 100 AS error_pct
                  FROM traces
                  WHERE Timestamp >= {from:String} AND Timestamp <= {to:String} AND ServiceName IN $service AND SpanAttributes['rpc.system.name'] != '' AND SpanKind IN ('Server', 'Internal')
    failing-methods:
      kind: Panel
      spec:
        display:
          description: error.type is what semconv asks an instrumentation to set on a failed call, so
            an empty column means it does not set one.
          name: Failing methods
        plugin:
          kind: Table
          spec:
            stickyHeader: true
        queries:
        - kind: ClickHouseSQL
          spec:
            plugin:
              kind: ClickHouseSQL
              spec:
                query: |-
                  SELECT coalesce(nullIf(SpanAttributes['rpc.method'], ''), SpanName) AS method,
                         count() AS calls,
                         countIf(StatusCode = 'Error') AS errors,
                         anyIf(SpanAttributes['rpc.response.status_code'], StatusCode = 'Error' AND SpanAttributes['rpc.response.status_code'] != '') AS sample_status,
                         anyIf(SpanAttributes['error.type'], SpanAttributes['error.type'] != '') AS sample_error
                  FROM traces
                  WHERE Timestamp >= {from:String} AND Timestamp <= {to:String} AND ServiceName IN $service AND SpanAttributes['rpc.system.name'] != '' AND SpanKind IN ('Server', 'Internal')
                  GROUP BY method
                  HAVING errors > 0
                  ORDER BY errors DESC
                  LIMIT 30
    latency-by-method:
      kind: Panel
      spec:
        display:
          name: P95 latency by method
        plugin:
          kind: TimeSeriesChart
          spec:
            showLegend: true
            unit: ms
        queries:
        - kind: ClickHouseSQL
          spec:
            plugin:
              kind: ClickHouseSQL
              spec:
                query: |-
                  SELECT toStartOfInterval(Timestamp, INTERVAL {step:UInt32} * 6 SECOND) AS ts,
                         coalesce(nullIf(SpanAttributes['rpc.method'], ''), SpanName) AS method,
                         round(quantile(0.95)(Duration) / 1000000, 1) AS p95_ms
                  FROM traces
                  WHERE Timestamp >= {from:String} AND Timestamp <= {to:String} AND ServiceName IN $service AND SpanAttributes['rpc.system.name'] != '' AND SpanKind IN ('Server', 'Internal')
                    AND coalesce(nullIf(SpanAttributes['rpc.method'], ''), SpanName) IN (
                    SELECT coalesce(nullIf(SpanAttributes['rpc.method'], ''), SpanName) FROM traces WHERE Timestamp >= {from:String} AND Timestamp <= {to:String} AND ServiceName IN $service AND SpanAttributes['rpc.system.name'] != '' AND SpanKind IN ('Server', 'Internal')
                    GROUP BY coalesce(nullIf(SpanAttributes['rpc.method'], ''), SpanName) ORDER BY count() DESC LIMIT 8
                  )
                  GROUP BY ts, method
                  ORDER BY ts
    p95-latency:
      kind: Panel
      spec:
        display:
          name: P95 latency
        plugin:
          kind: StatChart
          spec:
            calculation: last
            decimals: 1
            unit: ms
        queries:
        - kind: ClickHouseSQL
          spec:
            plugin:
              kind: ClickHouseSQL
              spec:
                query: |-
                  SELECT round(quantile(0.95)(Duration) / 1000000, 1) AS p95
                  FROM traces
                  WHERE Timestamp >= {from:String} AND Timestamp <= {to:String} AND ServiceName IN $service AND SpanAttributes['rpc.system.name'] != '' AND SpanKind IN ('Server', 'Internal')
    p99-latency:
      kind: Panel
      spec:
        display:
          name: P99 latency
        plugin:
          kind: StatChart
          spec:
            calculation: last
            decimals: 1
            unit: ms
        queries:
        - kind: ClickHouseSQL
          spec:
            plugin:
              kind: ClickHouseSQL
              spec:
                query: |-
                  SELECT round(quantile(0.99)(Duration) / 1000000, 1) AS p99
                  FROM traces
                  WHERE Timestamp >= {from:String} AND Timestamp <= {to:String} AND ServiceName IN $service AND SpanAttributes['rpc.system.name'] != '' AND SpanKind IN ('Server', 'Internal')
    slowest-methods:
      kind: Panel
      spec:
        display:
          description: Ranked by P95. Low-traffic methods can top this list.
          name: Slowest methods
        plugin:
          kind: Table
          spec:
            stickyHeader: true
        queries:
        - kind: ClickHouseSQL
          spec:
            plugin:
              kind: ClickHouseSQL
              spec:
                query: |-
                  SELECT coalesce(nullIf(SpanAttributes['rpc.method'], ''), SpanName) AS method,
                         SpanAttributes['rpc.system.name'] AS rpc_system,
                         count() AS calls,
                         round(avg(Duration) / 1000000, 1) AS avg_ms,
                         round(quantile(0.95)(Duration) / 1000000, 1) AS p95_ms,
                         round(quantile(0.99)(Duration) / 1000000, 1) AS p99_ms
                  FROM traces
                  WHERE Timestamp >= {from:String} AND Timestamp <= {to:String} AND ServiceName IN $service AND SpanAttributes['rpc.system.name'] != '' AND SpanKind IN ('Server', 'Internal')
                  GROUP BY method, rpc_system
                  ORDER BY p95_ms DESC
                  LIMIT 30
    time-by-method:
      kind: Panel
      spec:
        display:
          description: Total handler time, not per-call time. Where the service actually spends its day.
          name: Time spent by method
        plugin:
          kind: Table
          spec:
            stickyHeader: true
        queries:
        - kind: ClickHouseSQL
          spec:
            plugin:
              kind: ClickHouseSQL
              spec:
                query: |-
                  SELECT coalesce(nullIf(SpanAttributes['rpc.method'], ''), SpanName) AS method,
                         SpanAttributes['rpc.system.name'] AS rpc_system,
                         count() AS calls,
                         round(sum(Duration) / 1000000000, 2) AS total_seconds,
                         round(sum(Duration) / (SELECT sum(Duration) FROM traces WHERE Timestamp >= {from:String} AND Timestamp <= {to:String} AND ServiceName IN $service AND SpanAttributes['rpc.system.name'] != '' AND SpanKind IN ('Server', 'Internal')) * 100, 1) AS share_pct
                  FROM traces
                  WHERE Timestamp >= {from:String} AND Timestamp <= {to:String} AND ServiceName IN $service AND SpanAttributes['rpc.system.name'] != '' AND SpanKind IN ('Server', 'Internal')
                  GROUP BY method, rpc_system
                  ORDER BY total_seconds DESC
                  LIMIT 30
  refreshInterval: 1m
  variables:
  - kind: ListVariable
    spec:
      allowAllValue: true
      allowMultiple: true
      defaultValue: __all
      display:
        name: Service
      name: service
      plugin:
        kind: ClickHouseSQLVariable
        spec:
          query: SELECT DISTINCT ServiceName FROM traces WHERE Timestamp >= {from:String} AND Timestamp
            <= {to:String} ORDER BY ServiceName
      sort: alphabetical-asc

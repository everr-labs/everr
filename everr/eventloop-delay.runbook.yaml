kind: Runbook
metadata:
  name: eventloop-delay
  # no project → "default", matching the eventloop-delay alert
spec:
  display:
    name: Node.js event loop delay — runbook
    description: Triage steps for the eventloop-delay alert (elevated Node.js event loop p99 delay).
  duration: 6h
  refreshInterval: 1m
  panels:
    eventloop-delay:
      kind: Panel
      spec:
        display:
          name: Event loop delay percentiles
          description: How long work waited for the event loop, p50/p90/p99. The alert fires when p99 averages over 100ms.
        plugin:
          kind: TimeSeriesChart
          spec:
            unit: ms
            showLegend: true
            lineWidth: 1.5
            curveType: monotone
        queries:
          - kind: ClickHouseSQL
            spec:
              plugin:
                kind: ClickHouseSQL
                spec:
                  query: |
                    SELECT
                      toStartOfInterval(TimeUnix, INTERVAL {step:UInt32} SECOND) AS ts,
                      round(avgIf(Value, MetricName = 'nodejs.eventloop.delay.p50') * 1000, 1) AS p50,
                      round(avgIf(Value, MetricName = 'nodejs.eventloop.delay.p90') * 1000, 1) AS p90,
                      round(avgIf(Value, MetricName = 'nodejs.eventloop.delay.p99') * 1000, 1) AS p99
                    FROM metrics_gauge
                    WHERE TimeUnix >= {from:String} AND TimeUnix <= {to:String}
                      AND MetricName IN (
                        'nodejs.eventloop.delay.p50',
                        'nodejs.eventloop.delay.p90',
                        'nodejs.eventloop.delay.p99'
                      )
                    GROUP BY ts
                    ORDER BY ts
    eventloop-utilization:
      kind: Panel
      spec:
        display:
          name: Event loop utilization
          description: Fraction of wall-clock time the event loop was busy. Near 100% means the loop is CPU-saturated.
        plugin:
          kind: TimeSeriesChart
          spec:
            unit: "%"
            showLegend: false
            lineWidth: 1.5
            curveType: monotone
        queries:
          - kind: ClickHouseSQL
            spec:
              plugin:
                kind: ClickHouseSQL
                spec:
                  query: |
                    SELECT
                      toStartOfInterval(TimeUnix, INTERVAL {step:UInt32} SECOND) AS ts,
                      round(avg(Value) * 100, 2) AS utilization_pct
                    FROM metrics_gauge
                    WHERE TimeUnix >= {from:String} AND TimeUnix <= {to:String}
                      AND MetricName = 'nodejs.eventloop.utilization'
                    GROUP BY ts
                    ORDER BY ts
    heap-used:
      kind: Panel
      spec:
        display:
          name: V8 heap used
          description: Heap in use over time. A sawtooth climbing toward the limit means GC pressure, whose pauses stall the loop.
        plugin:
          kind: TimeSeriesChart
          spec:
            unit: MB
            showLegend: false
            lineWidth: 1.5
            curveType: monotone
        queries:
          - kind: ClickHouseSQL
            spec:
              plugin:
                kind: ClickHouseSQL
                spec:
                  query: |
                    SELECT
                      toStartOfInterval(TimeUnix, INTERVAL {step:UInt32} SECOND) AS ts,
                      round(avg(Value) / 1048576, 1) AS heap_used_mb
                    FROM metrics_gauge
                    WHERE TimeUnix >= {from:String} AND TimeUnix <= {to:String}
                      AND MetricName = 'v8js.memory.heap.used'
                    GROUP BY ts
                    ORDER BY ts
    slowest-requests:
      kind: Panel
      spec:
        display:
          name: Slowest requests
          description: >-
            The worst individual requests in the selected window, slowest first,
            for services that emit the event loop delay metric. Match the started
            column against spikes on the delay chart, then open the trace.
        plugin:
          kind: Table
          spec:
            stickyHeader: true
        queries:
          - kind: ClickHouseSQL
            spec:
              plugin:
                kind: ClickHouseSQL
                spec:
                  query: |
                    SELECT
                      formatDateTime(min(Timestamp), '%m-%d %H:%i:%S') AS started,
                      any(ServiceName) AS service,
                      anyIf(SpanName, SpanKind = 'Server' OR ParentSpanId = '') AS entry,
                      anyIf(SpanAttributes['rpc.method'], SpanAttributes['rpc.method'] != '') AS server_fn,
                      round(max(Duration) / 1e6, 1) AS duration_ms,
                      TraceId AS trace_id
                    FROM traces
                    WHERE Timestamp >= {from:String} AND Timestamp <= {to:String}
                      AND ServiceName IN (
                        SELECT DISTINCT ServiceName
                        FROM metrics_gauge
                        WHERE TimeUnix >= {from:String} AND TimeUnix <= {to:String}
                          AND MetricName = 'nodejs.eventloop.delay.p99'
                      )
                    GROUP BY TraceId
                    ORDER BY duration_ms DESC
                    LIMIT 30
    top-operations:
      kind: Panel
      spec:
        display:
          name: Heaviest operations
          description: >-
            Entry spans and server functions ranked by total time in the selected
            window. The repeat offender is usually at the top.
        plugin:
          kind: Table
          spec:
            stickyHeader: true
        queries:
          - kind: ClickHouseSQL
            spec:
              plugin:
                kind: ClickHouseSQL
                spec:
                  query: |
                    SELECT
                      if(SpanAttributes['rpc.method'] != '',
                         concat('fn ', SpanAttributes['rpc.method']),
                         SpanName) AS operation,
                      count() AS calls,
                      round(quantile(0.95)(Duration) / 1e6, 1) AS p95_ms,
                      round(max(Duration) / 1e6, 1) AS max_ms,
                      round(sum(Duration) / 1e6, 0) AS total_ms
                    FROM traces
                    WHERE Timestamp >= {from:String} AND Timestamp <= {to:String}
                      AND ServiceName IN (
                        SELECT DISTINCT ServiceName
                        FROM metrics_gauge
                        WHERE TimeUnix >= {from:String} AND TimeUnix <= {to:String}
                          AND MetricName = 'nodejs.eventloop.delay.p99'
                      )
                      AND (SpanKind = 'Server' OR ParentSpanId = '' OR SpanAttributes['rpc.method'] != '')
                    GROUP BY operation
                    ORDER BY total_ms DESC
                    LIMIT 20
    request-latency:
      kind: Panel
      spec:
        display:
          name: Request latency percentiles
          description: Server span duration p50/p95/p99 for services that emit the event loop delay metric.
        plugin:
          kind: TimeSeriesChart
          spec:
            unit: ms
            showLegend: true
            lineWidth: 1.5
            curveType: monotone
        queries:
          - kind: ClickHouseSQL
            spec:
              plugin:
                kind: ClickHouseSQL
                spec:
                  query: |
                    SELECT
                      toStartOfInterval(Timestamp, INTERVAL {step:UInt32} SECOND) AS ts,
                      round(quantile(0.5)(Duration) / 1e6, 1) AS p50,
                      round(quantile(0.95)(Duration) / 1e6, 1) AS p95,
                      round(quantile(0.99)(Duration) / 1e6, 1) AS p99
                    FROM traces
                    WHERE Timestamp >= {from:String} AND Timestamp <= {to:String}
                      AND SpanKind = 'Server'
                      AND ServiceName IN (
                        SELECT DISTINCT ServiceName
                        FROM metrics_gauge
                        WHERE TimeUnix >= {from:String} AND TimeUnix <= {to:String}
                          AND MetricName = 'nodejs.eventloop.delay.p99'
                      )
                    GROUP BY ts
                    ORDER BY ts
    slow-endpoints:
      kind: Panel
      spec:
        display:
          name: Slowest endpoints
          description: Server entry spans ranked by p95 duration in the selected window.
        plugin:
          kind: Table
          spec:
            stickyHeader: true
        queries:
          - kind: ClickHouseSQL
            spec:
              plugin:
                kind: ClickHouseSQL
                spec:
                  query: |
                    SELECT
                      ServiceName AS service,
                      SpanName AS endpoint,
                      count() AS calls,
                      round(quantile(0.5)(Duration) / 1e6, 1) AS p50_ms,
                      round(quantile(0.95)(Duration) / 1e6, 1) AS p95_ms,
                      round(max(Duration) / 1e6, 1) AS max_ms,
                      countIf(StatusCode = 'Error') AS errors
                    FROM traces
                    WHERE Timestamp >= {from:String} AND Timestamp <= {to:String}
                      AND SpanKind = 'Server'
                      AND ServiceName IN (
                        SELECT DISTINCT ServiceName
                        FROM metrics_gauge
                        WHERE TimeUnix >= {from:String} AND TimeUnix <= {to:String}
                          AND MetricName = 'nodejs.eventloop.delay.p99'
                      )
                    GROUP BY service, endpoint
                    ORDER BY p95_ms DESC
                    LIMIT 30
    server-functions:
      kind: Panel
      spec:
        display:
          name: Slowest server functions
          description: TanStack server functions ranked by p95 duration, broken out by rpc.method.
        plugin:
          kind: Table
          spec:
            stickyHeader: true
        queries:
          - kind: ClickHouseSQL
            spec:
              plugin:
                kind: ClickHouseSQL
                spec:
                  query: |
                    SELECT
                      SpanAttributes['rpc.method'] AS server_fn,
                      count() AS calls,
                      round(quantile(0.5)(Duration) / 1e6, 1) AS p50_ms,
                      round(quantile(0.95)(Duration) / 1e6, 1) AS p95_ms,
                      round(max(Duration) / 1e6, 1) AS max_ms,
                      countIf(StatusCode = 'Error') AS errors
                    FROM traces
                    WHERE Timestamp >= {from:String} AND Timestamp <= {to:String}
                      AND SpanAttributes['rpc.method'] != ''
                    GROUP BY server_fn
                    ORDER BY p95_ms DESC
                    LIMIT 30
  markdown:
    file: ./eventloop-delay.runbook.md
  pages:
    - name: app-server-latency
      display: { name: App server latency }
      markdown:
        file: ./eventloop-delay.app-server-latency.md

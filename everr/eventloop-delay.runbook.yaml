kind: Runbook
metadata:
  name: eventloop-delay
  # no project → "default", matching the eventloop-delay alert
spec:
  display:
    name: Node.js event loop delay — runbook
    description: Triage steps for the eventloop-delay alert (elevated Node.js event loop p99 delay).
  duration: 6h
  refreshInterval: 1m
  panels:
    eventloop-delay:
      kind: Panel
      spec:
        display:
          name: Event loop delay percentiles
          description: How long work waited for the event loop, p50/p90/p99. The alert fires when p99 averages over 100ms.
        plugin:
          kind: TimeSeriesChart
          spec:
            unit: ms
            showLegend: true
            lineWidth: 1.5
            curveType: monotone
        queries:
          - kind: ClickHouseSQL
            spec:
              plugin:
                kind: ClickHouseSQL
                spec:
                  query: |
                    SELECT
                      toStartOfInterval(TimeUnix, INTERVAL {step:UInt32} SECOND) AS ts,
                      replaceOne(MetricName, 'nodejs.eventloop.delay.', '') AS series,
                      round(avg(Value) * 1000, 1) AS delay_ms
                    FROM metrics_gauge
                    WHERE TimeUnix >= {from:String} AND TimeUnix <= {to:String}
                      AND MetricName IN (
                        'nodejs.eventloop.delay.p50',
                        'nodejs.eventloop.delay.p90',
                        'nodejs.eventloop.delay.p99'
                      )
                    GROUP BY ts, series
                    ORDER BY ts
    eventloop-utilization:
      kind: Panel
      spec:
        display:
          name: Event loop utilization
          description: Fraction of wall-clock time the event loop was busy. Near 100% means the loop is CPU-saturated.
        plugin:
          kind: TimeSeriesChart
          spec:
            unit: "%"
            showLegend: false
            lineWidth: 1.5
            curveType: monotone
        queries:
          - kind: ClickHouseSQL
            spec:
              plugin:
                kind: ClickHouseSQL
                spec:
                  query: |
                    SELECT
                      toStartOfInterval(TimeUnix, INTERVAL {step:UInt32} SECOND) AS ts,
                      round(avg(Value) * 100, 2) AS utilization_pct
                    FROM metrics_gauge
                    WHERE TimeUnix >= {from:String} AND TimeUnix <= {to:String}
                      AND MetricName = 'nodejs.eventloop.utilization'
                    GROUP BY ts
                    ORDER BY ts
    heap-used:
      kind: Panel
      spec:
        display:
          name: V8 heap used
          description: Heap in use over time. A sawtooth climbing toward the limit means GC pressure, whose pauses stall the loop.
        plugin:
          kind: TimeSeriesChart
          spec:
            unit: MB
            showLegend: false
            lineWidth: 1.5
            curveType: monotone
        queries:
          - kind: ClickHouseSQL
            spec:
              plugin:
                kind: ClickHouseSQL
                spec:
                  query: |
                    SELECT
                      toStartOfInterval(TimeUnix, INTERVAL {step:UInt32} SECOND) AS ts,
                      round(avg(Value) / 1048576, 1) AS heap_used_mb
                    FROM metrics_gauge
                    WHERE TimeUnix >= {from:String} AND TimeUnix <= {to:String}
                      AND MetricName = 'v8js.memory.heap.used'
                    GROUP BY ts
                    ORDER BY ts
    current-percentiles:
      kind: Panel
      spec:
        display:
          name: Current delay percentiles
          description: Latest event loop delay distribution across the selected window.
        plugin:
          kind: Table
          spec:
            stickyHeader: true
        queries:
          - kind: ClickHouseSQL
            spec:
              plugin:
                kind: ClickHouseSQL
                spec:
                  query: |
                    SELECT
                      replaceOne(MetricName, 'nodejs.eventloop.delay.', '') AS percentile,
                      round(avg(Value) * 1000, 1) AS delay_ms
                    FROM metrics_gauge
                    WHERE TimeUnix >= {from:String} AND TimeUnix <= {to:String}
                      AND MetricName LIKE 'nodejs.eventloop.delay.%'
                    GROUP BY percentile
                    ORDER BY delay_ms DESC
    alert-status:
      kind: Panel
      spec:
        display:
          name: Alert service status
          description: Recent alert service events for this alert, projected into logs.
        plugin:
          kind: Table
          spec:
            stickyHeader: true
        queries:
          - kind: ClickHouseSQL
            spec:
              plugin:
                kind: ClickHouseSQL
                spec:
                  query: |
                    SELECT
                      TimestampTime AS event_time,
                      LogAttributes['alert.event_type'] AS event_type,
                      LogAttributes['alert.row_count'] AS row_count,
                      LogAttributes['alert.silenced'] AS silenced,
                      LogAttributes['alert.delivery_targets'] AS delivery_targets,
                      LogAttributes['alert.instance_labels'] AS instance_labels
                    FROM logs
                    WHERE Timestamp >= {from:String} AND Timestamp <= {to:String}
                      AND ServiceName = 'alert'
                      AND LogAttributes['alert.slug'] = 'eventloop-delay'
                    ORDER BY event_time DESC
                    LIMIT 50
  markdown:
    inline: |
      # Node.js event loop delay — runbook

      The **eventloop-delay** alert fires when a service's
      `nodejs.eventloop.delay.p99`, averaged over the last 5 minutes, exceeds
      **100ms**. Each firing instance is one `ServiceName`.

      The event loop is Node's single thread. "Delay" is how long a ready
      callback waited before it ran — when it climbs, the process is **blocked**
      (CPU-bound work, synchronous I/O, or GC pauses) and every request served by
      that instance gets slower. This runbook localizes which of those it is.

      ## 1. Confirm severity

      ```panel
      ref: eventloop-delay
      ```

      - **p99 spiking while p50 stays low** → occasional stalls (a periodic job, a
        few heavy requests). Annoying tail latency, not a meltdown.
      - **All percentiles elevated together** → sustained saturation; the loop is
        behind continuously and the service is broadly slow.

      ## 2. Is the loop CPU-saturated?

      ```panel
      ref: eventloop-utilization
      ```

      - **Utilization near 100%** → the loop is genuinely busy: CPU-bound work on
        the main thread (large JSON parse/stringify, synchronous crypto/zlib,
        tight loops, regex backtracking). Move it off the loop — stream/chunk it,
        or push it to `worker_threads`.
      - **Low utilization but high delay** → the loop is *blocked*, not busy:
        synchronous filesystem calls, a native addon, or GC pauses. Check memory
        next.

      ## 3. GC / memory pressure

      ```panel
      ref: heap-used
      ```

      A heap that sawtooths up to the limit and back drives frequent major GCs,
      and each major GC pause freezes the loop. Growth that never drops back is a
      leak. Mitigations: cut per-request allocation, raise `--max-old-space-size`
      if the working set is legitimately large, or fix the leak.

      ## 4. Current snapshot

      ```panel
      ref: current-percentiles
      ```

      ## 5. Alert service status

      This panel reads the alert service's projected logs for
      **eventloop-delay**. Use it to confirm recent `firing`, `resolved`,
      `evaluation_failed`, and `delivery_failed` events, plus row counts and
      delivery/silence metadata.

      ```panel
      ref: alert-status
      ```

      ## 6. Common causes & what to do

      | Signal | Likely cause | Action |
      | --- | --- | --- |
      | High utilization, high delay | CPU-bound work on the main thread | Offload to `worker_threads`; chunk/stream heavy work |
      | Low utilization, high delay | Synchronous I/O or native call blocking the loop | Replace sync `fs`/crypto with async; audit native addons |
      | Heap sawtooth near the limit | GC pauses | Reduce allocations; raise heap; check for leaks |
      | Delay tracks request bursts | Overload | Scale out or shed load |
      | One service only, after a deploy | Regression in that release | Correlate with deploy history; roll back |

      ## 7. Related

      - **app-server-latency** — event loop delay surfaces as elevated request
        latency; use that runbook to find which endpoints are affected, then come
        back here to see whether the loop is the cause.

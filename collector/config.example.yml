extensions:
  file_storage/ingestion:
    directory: ${env:EVERR_QUEUE_DIRECTORY:-/var/lib/everr/queue}
    create_directory: true
    fsync: true
  everr_usage:
    internal_tenant: ${env:USAGE_INTERNAL_TENANT_ID:-}
    retention_days: 90
    max_series: 30000
  # Authenticates public OTLP ingest by exchanging a Bearer key with the
  # everr app's internal verify endpoint. The shared secret guards that
  # endpoint; rotate both sides together.
  everr_apikey:
    endpoint: ${env:INGEST_VERIFY_URL:-http://host.docker.internal:5173/api/internal/verify-key}
    shared_secret: ${env:INGEST_VERIFY_SHARED_SECRET:-replace-with-a-long-random-value}

receivers:
  everr_usage:
    interval: 60s
    timeout: 10s
  githubactions:
    path: /webhook/github
    endpoint: 0.0.0.0:8080
    secret: WEBHOOKSECRETFROMGHAPP
    gh_api:
      auth:
        app_id: 1234
        private_key_path: /etc/everr-collector/dev-everr-app.pem

  # Public OTLP ingest. Authenticated via the everr_apikey extension; tenant
  # is derived from the validated key, never from request headers/attrs.
  otlp/public:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: everr_apikey
        # Browser ingestion: CORS preflights carry no Authorization header,
        # so the receiver must admit any origin at the CORS layer. Real
        # enforcement is per key: the everr_apikey extension forwards the
        # request's Origin to verify-key, which only allows public keys from
        # their allowlisted origins.
        cors:
          allowed_origins: ["*"]
          allowed_headers: ["Authorization", "Content-Type"]
        # confighttp's default (20 MiB), made explicit for the public edge.
        max_request_body_size: 20971520
      grpc:
        endpoint: 0.0.0.0:4317
        auth:
          authenticator: everr_apikey

  # >>> DEV ONLY: DELETE THIS RECEIVER FOR PRODUCTION <<<
  # Dev-only self-telemetry ingest for the locally running app (server and
  # browser) and other first-party dev tools. Unauthenticated on purpose: it
  # is only exposed on the dev machine by docker-compose (bound to loopback)
  # and carries no customer data. Its pipelines stamp the internal dev tenant
  # and ship to BOTH the dev clickhouse and the desktop everr instance.
  #
  # This writes to the same clickhouse as the public path with no auth at all,
  # so a production copy of this file must not carry it. Both endpoints bind
  # to loopback, so a copy that keeps the block by mistake is still not
  # reachable off the box: the banner is not the only thing standing between
  # a copy and an unauthenticated cross-tenant write. Every dev-only block
  # in this file is marked with the same `DEV ONLY` banner; grep for it.
  otlp/dev:
    protocols:
      http:
        endpoint: 127.0.0.1:4320
        cors:
          allowed_origins:
            - http://localhost:5173
            - http://127.0.0.1:5173
      grpc:
        endpoint: 127.0.0.1:4319

connectors:
  everr_queue:
    sending_queue:
      storage: file_storage/ingestion
      queue_size: 10000
      num_consumers: 10
      batch:
        min_size: 8192
        flush_timeout: 1s
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0s

processors:
  everr_usage: {}
  # Internal pipeline (github webhook): tenant comes from a trusted header the
  # app sets when it forwards the webhook
  # (packages/app/src/server/github-events/collector.ts). Never convert it to
  # an int: it is a better-auth organization id, a string like "org_abc123",
  # and app.* stores tenant_id as String.
  resource:
    attributes:
      - action: upsert
        key: everr.tenant.id
        from_context: metadata.x-everr-tenant-id

  # Retention is one key, everr.retention.days, and each pipeline stamps the
  # window for its own signal. A span never needs the logs window, so stamping
  # all three would put two dead keys on every row: on the wire, in the landing
  # table, and in the map the view has to filter before storage. The processor
  # is separate from the tenant one above so the pipelines can compose them
  # instead of repeating the tenant block per signal.
  resource/retention_traces:
    attributes:
      - action: upsert
        key: everr.retention.days
        from_context: metadata.x-everr-retention-traces-days
  resource/retention_logs:
    attributes:
      - action: upsert
        key: everr.retention.days
        from_context: metadata.x-everr-retention-logs-days
  resource/retention_metrics:
    attributes:
      - action: upsert
        key: everr.retention.days
        from_context: metadata.x-everr-retention-metrics-days

  # Public pipeline: strip any client-supplied tenant or retention attr from
  # spans/logs/metric points so only the auth-derived values land downstream.
  attributes/strip_user_tenant:
    actions:
      - action: delete
        key: everr.tenant.id
      - action: delete
        key: everr.retention.days

  # Public pipeline: stamp tenant and retention from the auth context onto the
  # resource. upsert overwrites any client-supplied resource value.
  resource/public_tenant:
    attributes:
      - action: upsert
        key: everr.tenant.id
        from_context: auth.tenant_id
  resource/public_retention_traces:
    attributes:
      - action: upsert
        key: everr.retention.days
        from_context: auth.retention_traces_days
  resource/public_retention_logs:
    attributes:
      - action: upsert
        key: everr.retention.days
        from_context: auth.retention_logs_days
  resource/public_retention_metrics:
    attributes:
      - action: upsert
        key: everr.retention.days
        from_context: auth.retention_metrics_days

  # >>> DEV ONLY: DELETE THIS PROCESSOR FOR PRODUCTION <<<
  # Dev self-telemetry: stamp everything onto the internal dev tenant so it is
  # browsable in the cloud app. Retention is literal because this receiver is
  # unauthenticated and has no auth context to supply the signal's window.
  resource/dev_tenant:
    attributes:
      - action: upsert
        key: everr.tenant.id
        value: ${env:DEV_SELF_TENANT_ID:-replace-with-your-dev-org-id}
  resource/dev_retention_traces:
    attributes:
      - action: upsert
        key: everr.retention.days
        value: "14"
  resource/dev_retention_logs:
    attributes:
      - action: upsert
        key: everr.retention.days
        value: "14"
  resource/dev_retention_metrics:
    attributes:
      - action: upsert
        key: everr.retention.days
        value: "14"

exporters:
  debug:
    verbosity: detailed
  # Writes into otel.* landing tables (ENGINE = Null). Nothing is stored there;
  # the views in clickhouse/init/10-create-mvs.sql stamp tenant and retention
  # and write app.*. `ttl` is unused with create_schema: false.
  clickhouse: &storage_exporter
    endpoint: http://clickhouse:8123
    username: collector_rw
    password: collector-dev
    database: otel
    create_schema: false
    connection_params:
      wait_for_async_insert: "1"
      materialized_views_ignore_errors: "0"
    # Logs and traces write JSON attribute columns with typed values and one
    # keys array per attribute column; the landing tables in
    # clickhouse/init/03 declare that column set. A Map exporter against those
    # tables fails every insert, and the reverse too, so this flag and the
    # schema move together.
    json: true
    # Durable queueing and retries happen before the metering processor. This
    # exporter must return the storage result, without buffering or retrying.
    sending_queue:
      enabled: false
    retry_on_failure:
      enabled: false
  # Usage flushes are consumed once. Never retry an ambiguous usage insert.
  clickhouse/usage:
    <<: *storage_exporter
    sending_queue:
      enabled: false
    retry_on_failure:
      enabled: false

  # >>> DEV ONLY: DELETE THIS EXPORTER FOR PRODUCTION <<<
  # Forward to the dev machine's local everr desktop instance so distributed
  # traces assemble whole there (app half + engine half in one store).
  otlphttp/localdev:
    endpoint: ${env:EVERR_DEV_OTLP_ENDPOINT:-http://host.docker.internal:54318}

service:
  extensions: [everr_apikey, everr_usage, file_storage/ingestion]
  pipelines:
    metrics/usage:
      receivers: [everr_usage]
      exporters: [clickhouse/usage]

    # Persistent queue consumers call the meter and storage synchronously.
    traces/storage:
      receivers: [everr_queue]
      processors: [everr_usage]
      exporters: [clickhouse]
    logs/storage:
      receivers: [everr_queue]
      processors: [everr_usage]
      exporters: [clickhouse]
    metrics/storage:
      receivers: [everr_queue]
      processors: [everr_usage]
      exporters: [clickhouse]

    # Internal pipelines: trusted receivers, tenant from receiver-populated metadata header.
    traces:
      receivers: [githubactions]
      processors: [resource, resource/retention_traces]
      exporters: [everr_queue]
    metrics:
      receivers: [githubactions]
      processors: [resource, resource/retention_metrics]
      exporters: [everr_queue]
    logs:
      receivers: [githubactions]
      processors: [resource, resource/retention_logs]
      exporters: [everr_queue]

    # Public pipelines: untrusted clients, tenant from authenticated key.
    # Must NOT share the `resource` processor with the internal pipelines:
    # that one trusts the x-everr-tenant-id header and would let OTLP clients
    # spoof their tenant.
    traces/public:
      receivers: [otlp/public]
      processors: [attributes/strip_user_tenant, resource/public_tenant, resource/public_retention_traces]
      exporters: [everr_queue]
    metrics/public:
      receivers: [otlp/public]
      processors: [attributes/strip_user_tenant, resource/public_tenant, resource/public_retention_metrics]
      exporters: [everr_queue]
    logs/public:
      receivers: [otlp/public]
      processors: [attributes/strip_user_tenant, resource/public_tenant, resource/public_retention_logs]
      exporters: [everr_queue]

    # >>> DEV ONLY: DELETE THESE THREE PIPELINES FOR PRODUCTION <<<
    # Dev self-telemetry (app server + browser, dev tools): both stores.
    traces/dev:
      receivers: [otlp/dev]
      processors: [attributes/strip_user_tenant, resource/dev_tenant, resource/dev_retention_traces]
      exporters: [clickhouse, otlphttp/localdev]
    metrics/dev:
      receivers: [otlp/dev]
      processors: [attributes/strip_user_tenant, resource/dev_tenant, resource/dev_retention_metrics]
      exporters: [clickhouse, otlphttp/localdev]
    logs/dev:
      receivers: [otlp/dev]
      processors: [attributes/strip_user_tenant, resource/dev_tenant, resource/dev_retention_logs]
      exporters: [clickhouse, otlphttp/localdev]

  # Ship the collector's own telemetry (its logs, metrics, and internal
  # traces) to the dev-machine's local everr collector so we can observe the
  # collector itself the same way we observe everything else.
  telemetry:
    logs:
      level: debug
      processors:
        - batch:
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: http://host.docker.internal:54318
                insecure: true
    metrics:
      readers:
        - periodic:
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: http://host.docker.internal:54318
                insecure: true
    traces:
      processors:
        - batch:
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: http://host.docker.internal:54318
                insecure: true

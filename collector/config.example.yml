extensions:
  # Authenticates public OTLP ingest by exchanging a Bearer key with the
  # everr app's internal verify endpoint. The shared secret guards that
  # endpoint; rotate both sides together.
  everr_apikey:
    endpoint: ${env:INGEST_VERIFY_URL:-http://host.docker.internal:5173/api/internal/verify-key}
    shared_secret: ${env:INGEST_VERIFY_SHARED_SECRET:-replace-with-a-long-random-value}

  # Trusted first-party ingest. Only clickety-clack holds this token; rotate it
  # like any shared secret. The token gates admission only and carries no
  # tenant — tenant is the per-ResourceLogs everr.tenant.id CC sets.
  bearertokenauth/trusted:
    scheme: "Bearer"
    token: ${env:TRUSTED_INGEST_TOKEN:-replace-with-a-long-random-trusted-token}

receivers:
  githubactions:
    path: /webhook/github
    endpoint: 0.0.0.0:8080
    secret: WEBHOOKSECRETFROMGHAPP
    gh_api:
      auth:
        app_id: 1234
        private_key_path: /etc/everr-collector/dev-everr-app.pem

  # Public OTLP ingest. Authenticated via the everr_apikey extension; tenant
  # is derived from the validated key, never from request headers/attrs.
  otlp/public:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: everr_apikey
        # Browser ingestion: CORS preflights carry no Authorization header,
        # so the receiver must admit any origin at the CORS layer. Real
        # enforcement is per key: the everr_apikey extension forwards the
        # request's Origin to verify-key, which only allows public keys from
        # their allowlisted origins.
        cors:
          allowed_origins: ["*"]
          allowed_headers: ["Authorization", "Content-Type"]
        # confighttp's default (20 MiB), made explicit for the public edge.
        max_request_body_size: 20971520
      grpc:
        endpoint: 0.0.0.0:4317
        auth:
          authenticator: everr_apikey

  # Dev-only self-telemetry ingest for the locally running app (server and
  # browser) and other first-party dev tools. Unauthenticated on purpose: it
  # is only exposed on the dev machine by docker-compose and carries no
  # customer data. Its pipelines stamp the internal dev tenant and ship to
  # BOTH the dev clickhouse and the desktop everr instance.
  otlp/dev:
    protocols:
      http:
        endpoint: 0.0.0.0:4320
        cors:
          allowed_origins:
            - http://localhost:5173
            - http://127.0.0.1:5173
      grpc:
        endpoint: 0.0.0.0:4319

  # Trusted OTLP ingest for clickety-clack. Reachable only by first-party infra
  # (network policy + bearertokenauth/trusted secret). Preserves everr.tenant.id.
  otlp/trusted:
    protocols:
      http:
        endpoint: 0.0.0.0:4418
        auth:
          authenticator: bearertokenauth/trusted
      grpc:
        endpoint: 0.0.0.0:4417
        auth:
          authenticator: bearertokenauth/trusted

processors:
  batch:
  # Internal pipeline (github webhook): tenant comes from a trusted header
  # populated by the githubactions receiver after webhook-secret validation.
  resource:
    attributes:
      - action: upsert
        key: everr.tenant.id
        from_context: metadata.x-everr-tenant-id
      - action: convert
        key: everr.tenant.id
        converted_type: int

  # Public pipeline: strip any client-supplied tenant attr from spans/logs/
  # metric points so only the auth-derived value can land downstream.
  attributes/strip_user_tenant:
    actions:
      - action: delete
        key: everr.tenant.id

  # Public pipeline: stamp tenant from the auth context onto the resource.
  resource/public_tenant:
    attributes:
      - action: upsert
        key: everr.tenant.id
        from_context: auth.tenant_id

  # Dev self-telemetry: stamp everything onto the internal dev tenant (the
  # same org the engine's ingest key resolves to) so it is browsable in the
  # cloud app alongside the engine's telemetry.
  resource/dev_tenant:
    attributes:
      - action: upsert
        key: everr.tenant.id
        value: ${env:DEV_SELF_TENANT_ID:-replace-with-your-dev-org-id}

  # Public-to-local mirror: keep only the engine's own telemetry. Real public
  # ingest (demo/customer-shaped data) stays cloud-only.
  filter/engine_only:
    error_mode: ignore
    traces:
      span:
        - resource.attributes["service.name"] == nil or not IsMatch(resource.attributes["service.name"], "^clickety-clack")
    metrics:
      metric:
        - resource.attributes["service.name"] == nil or not IsMatch(resource.attributes["service.name"], "^clickety-clack")
    logs:
      log_record:
        - resource.attributes["service.name"] == nil or not IsMatch(resource.attributes["service.name"], "^clickety-clack")

exporters:
  debug:
    verbosity: detailed
  clickhouse:
    endpoint: http://clickhouse:8123
    username: collector_rw
    password: collector-dev
    database: otel
    create_schema: false
    ttl: 72h
  # Forward to the dev machine's local everr desktop instance so distributed
  # traces assemble whole there (app half + engine half in one store).
  otlphttp/localdev:
    endpoint: ${env:EVERR_DEV_OTLP_ENDPOINT:-http://host.docker.internal:54318}

connectors:
  testlogstotraces:

service:
  extensions: [everr_apikey, bearertokenauth/trusted]
  pipelines:
    # Internal pipelines: trusted receivers, tenant from receiver-populated metadata header.
    traces:
      receivers: [githubactions, testlogstotraces]
      processors: [resource, batch]
      exporters: [clickhouse, debug]
    metrics:
      receivers: [githubactions]
      processors: [resource, batch]
      exporters: [clickhouse, debug]
    logs:
      receivers: [githubactions]
      processors: [resource, batch]
      exporters: [clickhouse, debug, testlogstotraces]

    # Public pipelines: untrusted clients, tenant from authenticated key.
    # Must NOT share the `resource` processor with the internal pipelines —
    # that one trusts the x-everr-tenant-id header and would let OTLP clients
    # spoof their tenant.
    traces/public:
      receivers: [otlp/public]
      processors: [attributes/strip_user_tenant, resource/public_tenant, batch]
      exporters: [clickhouse, debug]
    metrics/public:
      receivers: [otlp/public]
      processors: [attributes/strip_user_tenant, resource/public_tenant, batch]
      exporters: [clickhouse, debug]
    logs/public:
      receivers: [otlp/public]
      processors: [attributes/strip_user_tenant, resource/public_tenant, batch]
      exporters: [clickhouse, debug]

    # Dev self-telemetry (app server + browser, dev tools): both stores.
    traces/dev:
      receivers: [otlp/dev]
      processors: [attributes/strip_user_tenant, resource/dev_tenant, batch]
      exporters: [clickhouse, otlphttp/localdev]
    metrics/dev:
      receivers: [otlp/dev]
      processors: [attributes/strip_user_tenant, resource/dev_tenant, batch]
      exporters: [clickhouse, otlphttp/localdev]
    logs/dev:
      receivers: [otlp/dev]
      processors: [attributes/strip_user_tenant, resource/dev_tenant, batch]
      exporters: [clickhouse, otlphttp/localdev]

    # Engine mirror: copy clickety-clack telemetry from the public path to
    # the local desktop instance. Other public ingest is not mirrored, and
    # the trusted product pipelines (alert log, SLO samples) stay cloud-only.
    traces/engine_mirror:
      receivers: [otlp/public]
      processors: [filter/engine_only, batch]
      exporters: [otlphttp/localdev]
    metrics/engine_mirror:
      receivers: [otlp/public]
      processors: [filter/engine_only, batch]
      exporters: [otlphttp/localdev]
    logs/engine_mirror:
      receivers: [otlp/public]
      processors: [filter/engine_only, batch]
      exporters: [otlphttp/localdev]

    # Trusted pipeline: CC alert events. No strip/stamp — the per-ResourceLogs
    # everr.tenant.id is trusted and flows to otel.otel_logs -> app.logs.
    logs/trusted:
      receivers: [otlp/trusted]
      processors: [batch]
      exporters: [clickhouse, debug]
    # Trusted SLO samples: CC records raw (good, valid) counts per SLO/group/
    # window as gauges. Same trust as logs/trusted (no strip, no stamp) so the
    # per-ResourceMetrics everr.tenant.id flows to app.metrics_gauge.tenant_id.
    metrics/trusted:
      receivers: [otlp/trusted]
      processors: [batch]
      exporters: [clickhouse, debug]

  # Ship the collector's own telemetry (its logs, metrics, and internal
  # traces) to the dev-machine's local everr collector so we can observe the
  # collector itself the same way we observe everything else.
  telemetry:
    logs:
      level: debug
      processors:
        - batch:
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: http://host.docker.internal:54318
                insecure: true
    metrics:
      readers:
        - periodic:
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: http://host.docker.internal:54318
                insecure: true
    traces:
      processors:
        - batch:
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: http://host.docker.internal:54318
                insecure: true

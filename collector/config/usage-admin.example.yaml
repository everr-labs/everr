# Optional overlay for the main collector configuration.
# Load with a second --config argument. Uses the same ClickHouse exporter.
processors:
  resource/admin_usage:
    attributes:
      - key: everr.tenant.id
        value: ${env:EVERR_ADMIN_TENANT_ID}
        action: upsert
service:
  pipelines:
    metrics/usage_admin:
      receivers: [forward/usage]
      processors: [resource/admin_usage]
      exporters: [clickhouse]

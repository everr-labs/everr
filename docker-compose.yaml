# Dev stack. Everything here uses throwaway credentials that are committed to the
# repo, so any port carrying one is published on 127.0.0.1 rather than 0.0.0.0:
# on a shared network an unbound port hands the whole stack to anyone on the LAN.
# Only the authenticated public edge (8080, 4317, 4318) is left reachable, so a
# tunnel or a device on the network can still reach ingest.
services:
  clickhouse:
    build: ./clickhouse
    ports:
      - "127.0.0.1:8123:8123"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: everr
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      COLLECTOR_RW_PASSWORD: collector-dev
      APP_RO_PASSWORD: app-dev
      WEB_APP_ADMIN_PASSWORD: web-app-admin-dev
    volumes:
      - ./volumes/clickhouse:/var/lib/clickhouse:Z

  postgres:
    image: postgres:18.3-alpine3.23
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./volumes/postgres:/var/lib/postgresql:Z

  collector:
    build: ./collector
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "4317:4317"
      - "4318:4318"
      # Dev-only unauthenticated self-telemetry ingest (otlp/dev receiver):
      # the locally running app ships here; the collector fans out to both
      # the dev clickhouse and the desktop everr instance.
      - "127.0.0.1:4319:4319"
      - "127.0.0.1:4320:4320"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./collector/config.yml:/etc/everr-collector/config.yaml:ro,z
      - ./collector/dev-everr-app.pem:/etc/everr-collector/dev-everr-app.pem:ro,z
  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    restart: unless-stopped
    volumes:
      - ./volumes/mailpit:/data:Z
    ports:
      - 8025:8025
      - 1025:1025
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

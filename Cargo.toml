[workspace]
members = ["packages/cli"]
resolver = "2"

# Debug CLIs unpack the ~340 MB embedded chDB library on first start; unoptimized
# inflate makes that ~8x slower and pushes `local start -d` past its readiness deadline.
[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

# build.rs hashes the ~130 MB of embedded assets, and build scripts are unoptimized by default.
[profile.dev.package.sha2]
opt-level = 3

[profile.release.package.sha2]
opt-level = 3

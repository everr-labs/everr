services:
  postgres:
    image: postgres:17.11-alpine3.23
    environment:
      POSTGRES_PASSWORD: dev
    ports:
      - target: 5432
        host_ip: 127.0.0.1
    volumes:
      - postgres:/var/lib/postgresql/data
    labels:
      dev.checkout: ${DEV_ROOT}
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres]
      interval: 1s
      timeout: 3s
      retries: 60
  clickhouse-app:
    build:
      context: ../../clickhouse
      target: self-hosted
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: dev
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_SQL_API_PASSWORD: dev
      COLLECTOR_RW_PASSWORD: dev
      APP_RO_PASSWORD: dev
      WEB_APP_ADMIN_PASSWORD: dev
    ports:
      - target: 8123
        host_ip: 127.0.0.1
    volumes:
      - clickhouse-app:/var/lib/clickhouse
    labels:
      dev.checkout: ${DEV_ROOT}
    healthcheck:
      test:
        [
          CMD-SHELL,
          'clickhouse-client --host "$$HOSTNAME" --password "$$CLICKHOUSE_PASSWORD" --query "SELECT 1 FROM app.alert_events LIMIT 0"',
        ]
      interval: 1s
      timeout: 3s
      retries: 60
  clickhouse-cloud:
    build:
      context: ../../clickhouse
      target: cloud
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: dev
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      COLLECTOR_RW_PASSWORD: dev
      APP_RO_PASSWORD: dev
      WEB_APP_ADMIN_PASSWORD: dev
    ports:
      - target: 8123
        host_ip: 127.0.0.1
    volumes:
      - clickhouse-cloud:/var/lib/clickhouse
    labels:
      dev.checkout: ${DEV_ROOT}
    healthcheck:
      test:
        [
          CMD-SHELL,
          'clickhouse-client --host "$$HOSTNAME" --password "$$CLICKHOUSE_PASSWORD" --query "SELECT 1 FROM app.alert_events LIMIT 0"',
        ]
      interval: 1s
      timeout: 3s
      retries: 60
volumes:
  postgres:
    labels:
      dev.checkout: ${DEV_ROOT}
  clickhouse-app:
    labels:
      dev.checkout: ${DEV_ROOT}
  clickhouse-cloud:
    labels:
      dev.checkout: ${DEV_ROOT}

# Each dev server applies its ClickHouse migrations on startup. Keep the image
# at the version deploy/compose.yaml pins.
x-clickhouse: &clickhouse
  image: clickhouse/clickhouse-server:26.8.34.13
  environment:
    CLICKHOUSE_USER: default
    CLICKHOUSE_PASSWORD: dev
    CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
  ports:
    - target: 8123
      host_ip: 127.0.0.1

services:
  mailpit:
    image: axllent/mailpit:v1.20.4
    ports:
      - target: 1025
        host_ip: 127.0.0.1
      - target: 8025
        host_ip: 127.0.0.1
    labels:
      dev.checkout: ${DEV_ROOT}
  postgres:
    image: postgres:17.11-alpine3.23
    environment:
      POSTGRES_PASSWORD: dev
    ports:
      - target: 5432
        host_ip: 127.0.0.1
    volumes:
      - postgres:/var/lib/postgresql/data
      - ${DEV_ROOT}/scripts/dev/init-postgres.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    labels:
      dev.checkout: ${DEV_ROOT}
  clickhouse-app:
    <<: *clickhouse
    volumes:
      - clickhouse-app:/var/lib/clickhouse
    labels:
      dev.checkout: ${DEV_ROOT}
  clickhouse-cloud:
    <<: *clickhouse
    volumes:
      - clickhouse-cloud:/var/lib/clickhouse
    labels:
      dev.checkout: ${DEV_ROOT}
volumes:
  postgres:
    labels:
      dev.checkout: ${DEV_ROOT}
  clickhouse-app:
    labels:
      dev.checkout: ${DEV_ROOT}
  clickhouse-cloud:
    labels:
      dev.checkout: ${DEV_ROOT}

version: "0.5"
environment:
  - DEV_MAIL=true
  - EMAIL_FROM=Everr <dev@example.test>
processes:
  mailpit:
    command: |
      trap 'docker compose --profile mail rm --force --stop mailpit' EXIT
      docker compose --profile mail up --abort-on-container-exit mailpit
    depends_on:
      databases: { condition: process_healthy }
    success_exit_codes: [143]
    availability: { restart: exit_on_failure }
    readiness_probe:
      exec:
        command: curl --fail --silent "http://$(docker compose port mailpit 8025)/livez"
      period_seconds: 2
      failure_threshold: 60
    shutdown:
      command: docker compose stop --timeout 10 mailpit
      timeout_seconds: 15
  app:
    depends_on:
      mailpit: { condition: process_healthy }
  cloud:
    depends_on:
      mailpit: { condition: process_healthy }
